<style>
/* Layout: one narrow column like a field notebook; plan days as map-legend strips; study card with a fixed thumb bar */
:root {
  --paper: #eef1e8;
  --surface: #fafbf6;
  --ink: #1b201b;
  --muted: #586055;
  --line: #d2d8c7;
  --grid: rgba(56, 92, 60, .11);
  --contour: #8f501d;
  --contour-soft: #f0e0cf;
  --forest: #2a673b;
  --forest-soft: #d9e9d8;
  --hydro: #235d8c;
  --hydro-soft: #dbe7f1;
  --red: #b3322a;
  --red-soft: #f5dcd8;
  --btn: #1b201b;
  --btn-ink: #f3f5ee;
  --f-display: "PT Sans Narrow", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "PT Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono: "PT Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141814; --surface: #1c211c; --ink: #e6e9de; --muted: #a0a898; --line: #343c33;
    --grid: rgba(150, 190, 150, .07);
    --contour: #d9a06a; --contour-soft: #3a2b1d; --forest: #7cc490; --forest-soft: #1f3524;
    --hydro: #7fb5e2; --hydro-soft: #1b2c3b; --red: #f07f73; --red-soft: #3d201d;
    --btn: #e6e9de; --btn-ink: #141814; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141814; --surface: #1c211c; --ink: #e6e9de; --muted: #a0a898; --line: #343c33;
  --grid: rgba(150, 190, 150, .07);
  --contour: #d9a06a; --contour-soft: #3a2b1d; --forest: #7cc490; --forest-soft: #1f3524;
  --hydro: #7fb5e2; --hydro-soft: #1b2c3b; --red: #f07f73; --red-soft: #3d201d;
  --btn: #e6e9de; --btn-ink: #141814; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 17px; line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--paper);
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--hydro); outline-offset: 2px; border-radius: 6px; }
.wrap {
  max-width: 640px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}

/* ── план ── */
.hero {
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0;
  padding: 22px max(16px, env(safe-area-inset-left, 0px)) 20px;
  background-color: var(--surface);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 30px 30px;
  border-bottom: 1px solid var(--line);
  display: grid; gap: 12px;
}
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; color: var(--contour); text-transform: uppercase; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 40px; line-height: 1; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.stat { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 15px; color: var(--muted); }
.stat b { font-family: var(--f-mono); font-weight: 400; font-size: 22px; color: var(--ink); font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .lrn { background: var(--contour); }
.bar .ok { background: var(--forest); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; border: 1px solid var(--line); }
.legend .l0 { background: var(--surface); }
.legend .l1 { background: var(--contour-soft); border-color: var(--contour); }
.legend .l2 { background: var(--forest-soft); border-color: var(--forest); }

.btn {
  appearance: none; border: 1px solid transparent; border-radius: 10px; cursor: pointer;
  min-height: 48px; padding: 10px 16px; font-weight: 700; font-size: 17px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
}
.btn-main { background: var(--btn); color: var(--btn-ink); width: 100%; }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn-small { min-height: 40px; padding: 6px 12px; font-size: 15px; }
.btn[disabled] { opacity: .55; cursor: default; }

.howto { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 2px 14px; margin-top: 16px; }
.howto summary { cursor: pointer; font-weight: 700; padding: 10px 0; color: var(--hydro); }
.howto ol { margin: 0 0 12px; padding-left: 1.3em; display: grid; gap: 6px; font-size: 15px; }

h2 { font-family: var(--f-display); font-size: 24px; margin: 26px 0 10px; letter-spacing: .01em; }
.days { display: grid; gap: 10px; }
.day {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px; display: grid; gap: 10px; min-width: 0;
}
.day.now { border-color: var(--contour); box-shadow: inset 4px 0 0 var(--contour); }
.dayhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.dayname { font-family: var(--f-display); font-size: 21px; line-height: 1.1; }
.dayname small { display: block; font-family: var(--f-body); font-size: 14px; color: var(--muted); font-weight: 400; margin-top: 3px; }
.tag { font-family: var(--f-mono); font-size: 12px; color: var(--contour); border: 1px solid var(--contour); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.cells { display: flex; flex-wrap: wrap; gap: 5px; }
.cell {
  appearance: none; cursor: pointer; width: 38px; height: 32px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--paper);
  font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums;
}
.cell.s1 { background: var(--contour-soft); border-color: var(--contour); color: var(--contour); }
.cell.s2 { background: var(--forest-soft); border-color: var(--forest); color: var(--forest); }
.cell.due { box-shadow: 0 0 0 2px var(--hydro); }
.dayfoot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.counts { font-size: 14px; color: var(--muted); }
.counts b { font-family: var(--f-mono); font-weight: 400; color: var(--ink); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.foot { margin-top: 26px; display: grid; gap: 10px; font-size: 14px; color: var(--muted); }
.confirm { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.danger { color: var(--red); border-color: var(--red); }

/* ── карточка ── */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--paper); border-bottom: 1px solid var(--line);
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 6px;
}
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.back { appearance: none; background: none; border: none; cursor: pointer; padding: 8px 4px; font-weight: 700; color: var(--hydro); font-size: 16px; }
.mode { font-size: 14px; color: var(--muted); text-align: right; min-width: 0; }
.mode b { font-family: var(--f-mono); font-weight: 400; color: var(--ink); }
.sbar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.sbar i { display: block; height: 100%; background: var(--forest); transition: width .25s; }

.card { padding: 18px 0 0; display: grid; gap: 10px; min-width: 0; }
.chiprow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.num { font-family: var(--f-mono); font-size: 14px; color: var(--contour); background: var(--contour-soft); border-radius: 6px; padding: 2px 9px; }
.blk { font-size: 13px; color: var(--muted); }
.q { font-family: var(--f-display); font-size: 27px; line-height: 1.16; margin: 0; text-wrap: balance; }
.hint { font-size: 15px; color: var(--muted); }
.hint b { font-family: var(--f-mono); font-weight: 400; color: var(--ink); }
.answer { border-top: 1px dashed var(--line); padding-top: 12px; margin-top: 4px; display: grid; gap: 4px; min-width: 0; }
.label { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--forest); }
.k ol { margin: 4px 0 6px; padding-left: 1.45em; display: grid; gap: 7px; }
.k li { padding-left: 2px; }
.k li::marker { font-family: var(--f-mono); color: var(--forest); }
.k b { color: var(--forest); }
.k .sub { font-family: var(--f-display); font-size: 17px; letter-spacing: .02em; color: var(--ink); margin-top: 10px; padding-top: 8px; border-top: 1px dotted var(--line); }
.k .sub:first-child { margin-top: 2px; padding-top: 0; border-top: none; }
.mn { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--contour-soft); font-size: 16px; }
.mn span { font-weight: 700; color: var(--contour); }
.more { margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 0 12px; font-size: 16px; }
.more summary { cursor: pointer; padding: 11px 0; font-weight: 700; color: var(--hydro); }
.more ul { margin: 0 0 12px; padding-left: 1.2em; display: grid; gap: 7px; }
.src { margin-top: 12px; font-size: 13px; color: var(--muted); }

.spacer { height: 150px; }
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.dock-in { max-width: 640px; margin: 0 auto; display: grid; gap: 8px; }
.grades { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.grades.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g {
  appearance: none; cursor: pointer; border-radius: 10px; border: 1px solid; min-height: 58px; padding: 6px 4px;
  display: grid; place-items: center; gap: 1px; font-weight: 700; font-size: 15px;
}
.g small { font-family: var(--f-mono); font-weight: 400; font-size: 12px; opacity: .85; }
.g0 { background: var(--red-soft); border-color: var(--red); color: var(--red); }
.g1 { background: var(--contour-soft); border-color: var(--contour); color: var(--contour); }
.g2 { background: var(--forest-soft); border-color: var(--forest); color: var(--forest); }
.g3 { background: var(--hydro-soft); border-color: var(--hydro); color: var(--hydro); }
.nav3 { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 8px; }

.done { padding: 40px 0; display: grid; gap: 14px; }
.done h1 { font-size: 36px; }
.done p { margin: 0; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .sbar i { transition: none; } }
</style>

</head>

<script type="application/json" id="data">{"days": [{"n": 1, "title": "Общая тактика", "sub": "вопросы 1–12"}, {"n": 2, "title": "Передвижение, оборона, наступление", "sub": "вопросы 13–21"}, {"n": 3, "title": "Управление, инженерка, местность", "sub": "вопросы 22–29"}, {"n": 4, "title": "Топография и документы", "sub": "вопросы 30–35"}, {"n": 5, "title": "Связь", "sub": "вопросы 36–41 и практика 1–4"}, {"n": 6, "title": "ОМП и защита", "sub": "вопросы 42–45 и практика 5–8"}], "cards": [{"n": "1", "day": 1, "dayTitle": "Общая тактика", "q": "Содержание основных тактических понятий.", "k": "<ol><li><b>Тактика<\/b> — теория и практика подготовки и ведения боя подразделениями, частями и соединениями<\/li><li><b>Бой<\/b> — основная форма тактических действий: организованные и согласованные по цели, месту и времени <b>удары, огонь и манёвр<\/b> для уничтожения противника, отражения его ударов и выполнения других задач в ограниченном районе за короткое время<\/li><li><b>Удар<\/b> — одновременное мощное поражение группировок и объектов противника ядерным, высокоточным и обычным оружием, средствами РЭБ или войсками<\/li><li><b>Огонь<\/b> — поражение противника из различных видов оружия<\/li><li><b>Манёвр<\/b> — организованное перемещение подразделений и перенос огня; подразделениями: <b>охват, обход, их сочетание, смена района (позиций)<\/b>; огнём: <b>сосредоточение, перенос, распределение<\/b><\/li><li><b>Боевая задача<\/b> — задача, поставленная вышестоящим командиром для достижения определённых целей в бою <b>к установленному сроку<\/b><\/li><li>Ещё понятия: <b>атака, заграждения, позиция, походный и предбоевой порядок, приданные подразделения, фланг, фронт<\/b><\/li><\/ol>", "cnt": 7, "m": "Бой = Удар + Огонь + Манёвр; манёвр огнём — «СПР»: сосредоточение, перенос, распределение", "d": "<ul><li>Атака — стремительное движение в боевом порядке в сочетании с огнём наивысшего напряжения для уничтожения противника.<\/li><li>Заграждения — искусственные препятствия и разрушения, чтобы нанести урон и задержать противника: взрывные, невзрывные, комбинированные.<\/li><li>Позиция — полоса (участок, район) местности, занятая или намеченная для боя: боевого охранения, выжидательные, запасные, ложные, огневые, отсечные и др.<\/li><li>Походный порядок — построение для марша; предбоевой порядок — расчленённое по фронту и в глубину построение при подходе к полю боя.<\/li><li>Приданные подразделения — во временном подчинении для усиления; выходят из подчинения по указанию старшего командира.<\/li><li>Фланг — правая и левая сторона боевого порядка, самая уязвимая часть; фронт — сторона боевого порядка, обращённая к противнику (ещё: объединение ВС, линия соприкосновения, район боевых действий).<\/li><li>Огонь различают по видам оружия, по направлению (фронтальный, фланговый, перекрёстный, кинжальный), по характеру воздействия (на подавление, уничтожение, воспрещение, разрушение).<\/li><li>Охват — выход для удара во фланг; обход — более глубокий манёвр для удара с тыла; отход — только с разрешения или по приказу старшего.<\/li><li>Мсб (тб) — основное тактическое подразделение, мср (тр) — тактическое подразделение.<\/li><\/ul>", "src": "Тема 1 «Основы современного общевойскового боя»"}, {"n": "2", "day": 1, "dayTitle": "Общая тактика", "q": "Принятые названия и сокращения, порядок их написания в боевых документах.", "k": "<ol><li>Перечень сокращений — <b>приложение № 3 БУСВ, часть 2<\/b><\/li><li>Подразделения, части и соединения — <b>строчными буквами<\/b>: мсп, мсб, мср, мсв, мсо; тп, тб, тр, тв<\/li><li>Объединения (<b>АРМИЯ, ВО, ФРОНТ<\/b>), <b>боевая техника<\/b> и <b>общие термины<\/b> — <b>прописными<\/b> или сочетанием прописных и строчных: БМП, ПТУР, батр ПТУР<\/li><li><b>Общевойсковые<\/b>: пдб, пдр, пдв; рр, рв, ро; пулв, пуло; птв; птпулв; гв, го<\/li><li><b>Артиллерия<\/b>: адн, батр, садн, минбатр, минв, ву; <b>ПВО<\/b>: зрбатр, зрв, зро, забатр, зав<\/li><li><b>Спецвойска<\/b>: иср, исв, исо, рхз, врхр, всо, ов, рс, вс, ос, кр; <b>тыл и ТО<\/b>: автр, ремр, хозв, воб, всн, ото<\/li><\/ol>", "cnt": 6, "m": "", "d": "<ul><li>Номер подразделения пишут арабской цифрой перед сокращением: 2 мср, 1 тв.<\/li><li>садн — самоходно-артиллерийский дивизион, понр — понтонная рота, пдеср — переправочно-десантная рота, ов — огнемётный взвод, всо — взвод специальной обработки, кр — комендантская рота.<\/li><li>В конце темы 1 преподаватель задавал тест по условным обозначениям — повтори таблицу сокращений из приложения.<\/li><\/ul>", "src": "Тема 1 «Основы современного общевойскового боя»"}, {"n": "3", "day": 1, "dayTitle": "Общая тактика", "q": "Виды общевойскового боя и их характеристика.", "k": "<ol><li>Бой бывает <b>общевойсковым, воздушным, противовоздушным, морским<\/b><\/li><li>Виды общевойскового боя — <b>оборона<\/b> и <b>наступление<\/b>; разновидность наступления — <b>встречный бой<\/b><\/li><li><b>Черты боя<\/b>: <b>решительность, высокая манёвренность, напряжённость и скоротечность<\/b>, резкие изменения обстановки, разнообразие способов, действия на земле и в воздухе, на широком фронте и большую глубину, высокие темпы, сложная радиоэлектронная обстановка<\/li><li><b>Оборона<\/b> — отразить наступление, нанести максимальные потери, удержать важные районы, создать условия для наступления; <b>позиционная<\/b> и <b>манёвренная<\/b><\/li><li><b>Наступление<\/b> — полный разгром противника в короткие сроки и овладение важными районами; на <b>обороняющегося<\/b>, <b>наступающего<\/b> (встречный бой), <b>отходящего<\/b> (преследование)<\/li><li>Основной способ боя с обычным оружием — <b>последовательный разгром<\/b>; с ядерным — <b>одновременное поражение<\/b> на всю глубину<\/li><\/ol>", "cnt": 6, "m": "", "d": "<ul><li>Общевойсковой бой ведут объединёнными усилиями соединений, частей и подразделений родов войск, спецвойск, ВВС, ПВО, на приморском направлении — флота.<\/li><li>Формы военных действий: операция, сражение, боевые действия, бой, удар.<\/li><li>На обороняющегося противника наступают с выдвижением из глубины или из положения непосредственного соприкосновения.<\/li><li>Оборона и наступление связаны: любая оборона содержит элементы наступления, и наоборот. Наступление ведётся непрерывно днём и ночью.<\/li><\/ul>", "src": "Тема 1 «Основы современного общевойскового боя»"}, {"n": "4", "day": 1, "dayTitle": "Общая тактика", "q": "Последовательность и содержание работы командира.", "k": "<ol><li><b>Уяснение задачи<\/b><\/li><li><b>Расчёт времени<\/b> на подготовку<\/li><li><b>Ориентирование<\/b> заместителей, помощников и командиров подразделений<\/li><li><b>Оценка обстановки<\/b><\/li><li><b>Принятие решения<\/b>, доклад старшему и утверждение<\/li><li><b>Объявление решения<\/b> заместителям и командирам подразделений<\/li><li><b>Рекогносцировка<\/b>: участие в рекогносцировке старшего и своя<\/li><li><b>Разработка боевых документов<\/b><\/li><li><b>Постановка боевых задач<\/b>, заслушивание решений подчинённых<\/li><li>Организация <b>взаимодействия, системы огня, всестороннего обеспечения и управления<\/b><\/li><\/ol>", "cnt": 10, "m": "Уяснил → Посчитал → Сориентировал → Оценил → Решил → Объявил → Посмотрел → Задокументировал → Поставил → Организовал", "d": "<ul><li>Работа начинается с получением боевого распоряжения (в роте — боевого приказа) и ведётся на местности; если нельзя — по карте, схеме, макету.<\/li><li>Уясняя задачу, командир понимает: цель действий; место и роль своего подразделения в замысле старшего; свою задачу; объекты, поражаемые старшим; задачи соседей; ориентиры и сигналы; сроки готовности.<\/li><li>Выводы из уяснения: направление сосредоточения основных усилий; тактические задачи; мероприятия по подготовке; расчёт времени.<\/li><li>Оценка обстановки: противник, свои подразделения, соседи, местность, время года и суток, расчёты; по каждому элементу — выводы.<\/li><li>Расчёт времени в батальоне подписывает начальник штаба и утверждает командир, в роте — подписывает командир роты.<\/li><li>Последовательность может меняться в зависимости от времени и обстановки.<\/li><\/ul>", "src": "Тема 2 «Содержание подготовки общевойскового боя»"}, {"n": "5", "day": 1, "dayTitle": "Общая тактика", "q": "Организация оборонительного, наступательного боя, штурмовых действий и передвижения.", "k": "<div class=\"sub\">Оборона<\/div><ol><li><b>Организация обороны<\/b> (решение, задачи, планирование, организация огня, взаимодействия, обеспечения, управления), <b>подготовка командования и подразделений<\/b>, <b>занятие и построение обороны<\/b>, <b>инженерное оборудование<\/b> района (опорного пункта), <b>практическая работа<\/b><\/li><\/ol><div class=\"sub\">Наступление<\/div><ol><li><b>Принятие решения, постановка задач, рекогносцировка<\/b>, организация <b>взаимодействия, огневого поражения, всестороннего обеспечения, управления<\/b>, <b>планирование боя<\/b><\/li><\/ol><div class=\"sub\">Штурмовые действия<\/div><ol><li><b>Скрытный подход<\/b> → <b>точки огневого прикрытия<\/b> → <b>взрывные устройства и гранаты<\/b> перед штурмом → <b>быстрый захват и зачистка<\/b>, контроль ключевых точек → <b>эвакуация<\/b> с минимальными потерями<\/li><\/ol><div class=\"sub\">Передвижение (марш)<\/div><ol><li><b>Подготовка<\/b> л/с и техники, <b>решение<\/b>, <b>постановка задач<\/b>, <b>контроль и помощь<\/b>; по карте изучают <b>маршрут<\/b>, рубежи вероятной <b>встречи с противником<\/b>, <b>привалы<\/b> и дозаправку, <b>скорости и время<\/b>, район <b>отдыха<\/b><\/li><\/ol>", "cnt": 4, "m": "", "d": "<ul><li>Работу по организации обороны и наступления командир по возможности проводит на местности.<\/li><li>Оборона в соприкосновении с противником: уяснение, оценка и замысел — в ходе захвата рубежа; затем предварительные распоряжения, решение, задачи, инженерное оборудование.<\/li><li>Оборона вне соприкосновения: решение по карте → рекогносцировка → боевой приказ → взаимодействие и система огня → вывод в район обороны → инженерное оборудование → доклад о готовности.<\/li><li>Работу заканчивают так, чтобы большую часть времени оставить подчинённым.<\/li><li>При наступлении из соприкосновения больше работы на местности, но строже маскировка: войска в зоне огня противника.<\/li><\/ul>", "src": "Тема 2 «Содержание подготовки общевойскового боя»"}, {"n": "6", "day": 1, "dayTitle": "Общая тактика", "q": "Содержание решения, боевого приказа на бой и на передвижение.", "k": "<div class=\"sub\">Решение<\/div><ol><li><b>Замысел<\/b>: направление сосредоточения основных усилий, способы выполнения задачи, боевой (походный) порядок<\/li><li><b>Задачи подразделениям<\/b> и основные вопросы <b>взаимодействия, обеспечения, управления<\/b><\/li><\/ol><div class=\"sub\">Боевой приказ батальона (роты) — 7 пунктов по порядку<\/div><ol><li><b>Противник<\/b>: состав, положение, вероятный характер действий<\/li><li><b>Боевая задача<\/b>, средства усиления, ракеты и боеприпасы на задачу<\/li><li>Задачи <b>старшего начальника<\/b> в интересах батальона, <b>соседей<\/b>, разграничительные линии<\/li><li>«<b>РЕШИЛ<\/b>» — замысел<\/li><li>«<b>ПРИКАЗЫВАЮ<\/b>» — задачи подразделениям<\/li><li>Место и время развёртывания <b>КНП<\/b>, его перемещение, кому управление при выходе из строя<\/li><li><b>Время готовности<\/b><\/li><\/ol><div class=\"sub\">Приказ на марш (взвод)<\/div><ol><li>Отделениям: <b>место в колонне, скорость и дистанции, огонь по воздушным целям, действия при встрече с противником и при засаде<\/b><\/li><\/ol>", "cnt": 10, "m": "Противник → Задача → Старший и соседи → РЕШИЛ → ПРИКАЗЫВАЮ → КНП → Готовность", "d": "<ul><li>При отдаче устного боевого приказа замысел до командиров подразделений не доводится.<\/li><li>Приказ краткий, предельно ясный, исключает разное толкование; отдаёт лично командир или по его указанию начальник штаба — устно, по средствам связи или через АСУВ.<\/li><li>В вопросах взаимодействия определяют тактические задачи и их последовательность, силы и средства, время, место и метод организации.<\/li><li>Боевой приказ на марш командир взвода обычно отдаёт всему личному составу взвода.<\/li><li>Приказы командира батальона записываются в рабочую тетрадь, командиры подразделений расписываются об ознакомлении.<\/li><\/ul>", "src": "Тема 2 «Содержание подготовки общевойскового боя»"}, {"n": "7", "day": 1, "dayTitle": "Общая тактика", "q": "Цель проведения штурма и способы его достижения.", "k": "<ol><li><b>Штурм<\/b> — способ овладения <b>сильно укреплённой позицией<\/b>: быстрые, часто неожиданные действия, чтобы <b>нарушить систему обороны<\/b> и создать условия для <b>продвижения основных сил<\/b><\/li><\/ol><div class=\"sub\">Тактики штурма<\/div><ol><li><b>Скрытное проникновение<\/b> — захват внезапно для противника<\/li><li><b>Динамичная атака<\/b> — стремительное проникновение, подавить до организованного сопротивления<\/li><li><b>Поочерёдный захват<\/b> — объект берут по частям, оставляя коридор для основных сил<\/li><\/ol><div class=\"sub\">Этапы штурма<\/div><ol><li><b>Подготовка и изоляция<\/b> объекта: подавление и ослепление, полная изоляция, прикрытие<\/li><li><b>Скрытное сближение и проникновение<\/b> группы захвата<\/li><li><b>Штурм лестниц<\/b><\/li><li><b>Завершение<\/b>: выход, соединение с группой поддержки, оборона объекта<\/li><\/ol>", "cnt": 8, "m": "Тактики «СДП»: Скрытно, Динамично, Поочерёдно", "d": "<ul><li>Принципы планирования: изучить оборону (система огня, фланговый огонь из соседних зданий, подходы, заграждения); определить место захода; огневое прикрытие — пока одни двигаются, другие прикрывают; учесть все точки входа; подходить с выгодной стороны (обычно объект «по левую руку»).<\/li><li>Овладение населённым пунктом начинается после огневой подготовки; штурмовой отряд занимает исходное положение как можно ближе к объекту.<\/li><li>Зачистка — на высокой скорости, без задержек у входов; лестничные марши держат под огнём снизу.<\/li><\/ul>", "src": "Тема 3 «Основы штурмовых действий»"}, {"n": "8", "day": 1, "dayTitle": "Общая тактика", "q": "Способы выполнения боевых задач при штурме назначенного объекта.", "k": "<ol><li>Укрепрайон штурмуют, когда его <b>не удалось захватить с ходу или обойти<\/b>: наступлением на <b>узких участках<\/b> после всесторонней подготовки<\/li><li>Действуют <b>штурмовые отряды (группы)<\/b>: мсб (мср) + танки, артиллерия, ПТУР, ПВО, саперы, огнемётчики; доп. запас гранат, подрывных зарядов, аэрозольных средств<\/li><li><b>Исходное положение<\/b> занимают <b>в ночь перед штурмом<\/b> (или с началом огневой подготовки)<\/li><li>Атака — после <b>мощной огневой подготовки<\/b> с <b>периодом разрушения<\/b>: ДОС разрушают, ослепляют, подавляют, делают <b>проходы<\/b><\/li><li><b>Захват ДОС<\/b>: огневая поддержка бьёт по <b>амбразурам<\/b> → разграждение делает <b>проходы<\/b> → захват атакует, <b>закрывает амбразуры<\/b> → <b>подрыв<\/b> и проверка<\/li><li><b>В здании<\/b>: врываются через <b>проломы, подземные коммуникации, подъезды<\/b> под огнём и аэрозольными завесами → <b>гранаты<\/b> → захват <b>лестничных пролётов<\/b> → бой по этажам → <b>закрепление<\/b><\/li><li><b>Опыт СВО<\/b>: малые группы — <b>«двойки» и «тройки»<\/b>, просачивание в тыл, разведка с БпЛА, РЭБ, взаимодействие с <b>танками<\/b><\/li><\/ol>", "cnt": 7, "m": "", "d": "<ul><li>Танковые подразделения обходят и блокируют противника в укрепрайоне и усиливают мср; тр придаётся мср повзводно.<\/li><li>Огневая поддержка — до проникновения на объект, затем огонь переносят на соседние объекты для изоляции атакуемого.<\/li><li>Инженеры проделывают проходы в стенах и перекрытиях, разминируют здания.<\/li><li>Захватив здание (квартал), продолжают бой за следующие; очаги сопротивления добивают группа прикрытия и резерв; выходы из подземных коммуникаций охраняют или разрушают.<\/li><li>По опыту СВО: рубеж выхода в атаку — до 400 м; первые 100–⁠150 м проходят быстро и рассредоточенно, дальше перебежками по 6–⁠8 м и переползанием.<\/li><li>Обучение — в тылу на участках с макетами сооружений противника.<\/li><\/ul>", "src": "Тема 3 «Основы штурмовых действий»"}, {"n": "9", "day": 1, "dayTitle": "Общая тактика", "q": "Боевые задачи и боевой порядок при штурме.", "k": "<div class=\"sub\">Боевой порядок штурмового отряда<\/div><ol><li><b>2–⁠3 штурмовые группы<\/b> — овладение зданием (объектом) или его частью; обычно усиленная <b>мср<\/b><\/li><li><b>Резерв<\/b> (до взвода) — усиление групп, развитие успеха, внезапные задачи<\/li><li><b>Группа прикрытия<\/b> (до роты) — закрепление объекта, прикрытие флангов и тыла<\/li><li><b>Группа огневой поддержки<\/b> — артиллерия, танки, зенитчики, гранатомётчики, пулемётчики, снайперы, огнемётчики<\/li><li><b>Группа разграждения<\/b> — проходы, подрыв стен, разминирование; для особо прочных зданий — <b>группа разрушения<\/b><\/li><\/ol><div class=\"sub\">Боевой порядок штурмовой группы<\/div><ol><li>Подгруппы <b>захвата, управления, огневой поддержки<\/b> (+ <b>разграждения<\/b> при наличии сил)<\/li><\/ol><div class=\"sub\">Боевые задачи<\/div><ol><li>Отряду (группе) указывают <b>ближайшую задачу<\/b> и <b>направление продолжения наступления<\/b><\/li><li>Ближайшая задача группы — <b>захват или уничтожение ДОС<\/b> на направлении наступления; дальше — на <b>следующее сооружение<\/b><\/li><\/ol>", "cnt": 8, "m": "Отряд: Штурм, Резерв, Прикрытие, Огонь, Разграждение. Группа: Захват, Управление, Огонь", "d": "<ul><li>Ближайшая задача штурмового отряда — захват и уничтожение ДОС в опорных пунктах рот первого эшелона противника; направление продолжения — на сооружения в глубине его первой позиции.<\/li><li>Подгруппа захвата — на основе мсо (взвода), может включать огнемётчиков; подгруппа управления — на основе управления взвода.<\/li><li>Штурмовой группе в составе взвода указывают объект атаки и направление дальнейшего наступления.<\/li><li>Опыт СВО: штурмовой взвод делят на 3 отделения — первое штурмует, второе и третье дают огневую поддержку; отделения делятся на «двойки» и «тройки».<\/li><\/ul>", "src": "Тема 3 «Основы штурмовых действий»"}, {"n": "10", "day": 1, "dayTitle": "Общая тактика", "q": "Всестороннее обеспечение боевых действий.", "k": "<ol><li><b>Всестороннее обеспечение<\/b> — подготовка и осуществление мероприятий для поддержания подразделений в <b>высокой боевой готовности<\/b>, сохранения <b>боеспособности<\/b> и создания <b>условий<\/b> для выполнения задач<\/li><li>Виды: <b>боевое, морально-психологическое, техническое, тыловое и медицинское<\/b><\/li><li>Планируется <b>заблаговременно<\/b>, проводится <b>непрерывно<\/b> в любых условиях<\/li><li>Организуют <b>командир (штаб)<\/b> батальона (роты) и <b>заместители<\/b> на основе решения командира, указаний старшего и обстановки<\/li><\/ol>", "cnt": 4, "m": "«Б-М-Т-Т-М»: Боевое, Морально-психологическое, Техническое, Тыловое, Медицинское", "d": "<ul><li>Перед любыми действиями старший начальник проводит мероприятия по управлению, ПВО, авиационному прикрытию, разведке, охранению, маскировке, РХБЗ, инженерному, техническому, тыловому и медицинскому обеспечению, комендантской службе.<\/li><li>Мероприятия проводятся на всех уровнях управления — и при подготовке, и в ходе выполнения задачи.<\/li><li>Подробно виды — в вопросе 11.<\/li><\/ul>", "src": "Тема 4 «Всестороннее обеспечение боевых действий»"}, {"n": "11", "day": 1, "dayTitle": "Общая тактика", "q": "Виды всестороннего обеспечения и их характеристика.", "k": "<ol><li><b>Боевое<\/b> — повысить эффективность своих подразделений и снизить эффективность противника (вопрос 12)<\/li><li><b>Морально-психологическое<\/b> — высокое морально-психологическое состояние, защита от деморализации, воздействие на противника; работа <b>информационно-воспитательная, психологическая, военно-социальная, культурно-досуговая<\/b>, <b>защита от ИПВ<\/b><\/li><li><b>Техническое<\/b> — обеспечение <b>вооружением, техникой, ракетами, боеприпасами<\/b>, ВТИ; <b>эксплуатация<\/b>; <b>восстановление<\/b> (техразведка, эвакуация, ремонт, возвращение в строй)<\/li><li><b>Тыловое<\/b> — материальные, транспортные, бытовые потребности; <b>материальное обеспечение<\/b>: потребность, получение и запасы, сохранность, учёт, подвоз<\/li><li><b>Медицинское<\/b> — сохранение жизни, восстановление боеспособности, профилактика заболеваний, помощь раненым и возвращение в строй<\/li><\/ol>", "cnt": 5, "m": "«Б-М-Т-Т-М»: Боевое, Морально-психологическое, Техническое, Тыловое, Медицинское", "d": "<ul><li>Запасы делятся на расходную часть и неприкосновенный запас; НЗ расходуют с разрешения командира бригады (полка), в крайнем случае — командира батальона с докладом.<\/li><li>Эксплуатация ВВТ — использование, техническое обслуживание, транспортирование и хранение.<\/li><li>Медицинское обеспечение: лечебно-эвакуационные и санитарно-противоэпидемические мероприятия, медицинская защита от ОМП, снабжение медимуществом.<\/li><li>Запасы содержатся в боевых машинах, при вооружении и личном составе, на транспорте взвода обеспечения батальона.<\/li><li>На одном слайде лекции тыловое делится на материальное и медицинское, на другом медицинское выделено отдельно — называй пять видов.<\/li><\/ul>", "src": "Тема 4 «Всестороннее обеспечение боевых действий»"}, {"n": "12", "day": 1, "dayTitle": "Общая тактика", "q": "Сущность, цели и виды боевого обеспечения.", "k": "<ol><li><b>Цель<\/b>: <b>повышение эффективности<\/b> применения своих подразделений и <b>снижение эффективности<\/b> применения войск, сил и средств противника<\/li><\/ol><div class=\"sub\">Виды<\/div><ol><li><b>Разведка<\/b> — сведения о противнике и местности; главное — исключить внезапность<\/li><li><b>Охранение<\/b> — боевое, походное, сторожевое, непосредственное<\/li><li><b>РЭБ<\/b> — радиоэлектронное поражение и радиоэлектронная защита<\/li><li><b>Тактическая маскировка<\/b> — скрытие, имитация, демонстративные действия, дезинформация<\/li><li><b>Инженерное обеспечение<\/b> — разведка, фортификация, заграждения, проходы, переправы, вода<\/li><li><b>РХБ защита<\/b> — защита от ОМП и заражения, выявление РХ обстановки, огнемётно-зажигательные средства<\/li><\/ol>", "cnt": 7, "m": "«Рота Охраны Рыла Траншеи И Рвы»: Разведка, Охранение, РЭБ, Тактическая маскировка, Инженерное, РХБЗ", "d": "<ul><li>Способы добывания разведсведений: наблюдение, подслушивание, поиски, засады, налёты, опрос местных жителей, допрос пленных и перебежчиков, изучение трофейных документов и техники.<\/li><li>Требования к разведке: непрерывность, активность, целеустремлённость, своевременность, достоверность, точность координат целей.<\/li><li>Боевое охранение — в обороне, до усиленного взвода, до 2 км от батальона первого эшелона.<\/li><li>Непосредственное охранение — во всех видах боя: наблюдатели, патрули, секреты, суточный наряд; в батальоне — дежурное подразделение (взвод).<\/li><li>Пропуск — название оружия или техники, отзыв — населённый пункт на ту же букву (автомат — Архангельск).<\/li><li>РЭБ: снизить эффективность оружия и радиосредств противника, защитить свою технику от разведки, обеспечить устойчивость своего управления.<\/li><\/ul>", "src": "Тема 4 «Всестороннее обеспечение боевых действий»"}, {"n": "13", "day": 2, "dayTitle": "Передвижение, оборона, наступление", "q": "Условия и способы передвижения войск.", "k": "<ol><li><b>Цель<\/b>: создание (изменение) состава войск, их <b>усиление<\/b> или <b>развёртывание<\/b> на новых направлениях<\/li><li><b>Способы<\/b>: <b>своим ходом (марш)<\/b>, <b>перевозка<\/b> (ж/д, морским, речным, воздушным транспортом), <b>комбинированный<\/b><\/li><li><b>Основной способ<\/b> для батальона (роты) — <b>марш<\/b><\/li><li>Способ выбирают по <b>цели, расстоянию, времени<\/b>, состоянию коммуникаций и наличию транспорта<\/li><li><b>Условия<\/b>: угроза <b>ЯО и ВТО<\/b>, дистанционного минирования, <b>авиации<\/b>, десантов, <b>ДРГ<\/b> и НВФ, заражения, разрушения дорог и переправ, противодействия населения<\/li><\/ol>", "cnt": 5, "m": "", "d": "<ul><li>Ж/д транспорт сохраняет силы личного состава и запас хода техники, но очень уязвим от ЯО и авиации.<\/li><li>Водный транспорт требует причалов и мощных кранов для тяжёлой техники.<\/li><li>Воздушный — для мотострелков без тяжёлой техники, даёт большой выигрыш во времени.<\/li><li>Комбинированный — например, гусеничная техника по ж/д или на большегрузных прицепах, колёсная своим ходом.<\/li><\/ul>", "src": "Тема 5 «Передвижение и расположение на месте»"}, {"n": "14", "day": 2, "dayTitle": "Передвижение, оборона, наступление", "q": "Марш, его цель, виды и условия совершения.", "k": "<ol><li><b>Марш<\/b> — организованное передвижение войск <b>в колоннах по дорогам и колонным путям<\/b> для своевременного выхода в назначенный район или на рубеж<\/li><li><b>Цель<\/b>: прибыть <b>своевременно и в полной боевой готовности<\/b><\/li><li><b>Условия<\/b>: <b>в предвидении вступления в бой<\/b> или <b>вне угрозы столкновения<\/b>; скрытно, обычно <b>ночью<\/b><\/li><li><b>По направлению<\/b>: <b>к фронту, вдоль фронта, от фронта в тыл<\/b><\/li><li><b>Маршевые возможности<\/b>: <b>средняя скорость<\/b>, <b>суточный переход<\/b>, <b>запас хода<\/b><\/li><li><b>Скорость<\/b>: смешанные и танковые колонны <b>20–⁠25 км/ч<\/b>, автомобильные <b>25–⁠30<\/b>, пешком <b>4–⁠5<\/b>; <b>суточный переход<\/b> до <b>250 км<\/b> (автоколонны до 300)<\/li><li><b>Регулирование<\/b>: исходный пункт в <b>5–⁠10 км<\/b>; <b>привалы<\/b> через 3–⁠4 ч до 1 ч и один до 2 ч во второй половине перехода; <b>дневной (ночной) отдых<\/b> 5–⁠6 ч<\/li><li><b>Походный порядок<\/b>: <b>колонна главных сил и охранение<\/b>; дистанция <b>25–⁠50 м<\/b> (до 100–⁠150 м)<\/li><\/ol>", "cnt": 8, "m": "", "d": "<ul><li>Маршевые возможности — способность пройти своим ходом за сутки и более максимальное расстояние, сохранив боеспособность.<\/li><li>Механик-водитель сохраняет боеспособность при 10–⁠12 ч движения в сутки.<\/li><li>В горах, на севере, в лесисто-болотистой местности скорость до 15–⁠20 км/ч, суточный переход до 200 км.<\/li><li>Пункты регулирования — через 3–⁠4 ч движения.<\/li><li>Походное охранение: головная походная застава (взвод или рота) высылает головной дозор (взвод), тот — дозорное отделение; задачи — не пропустить разведку противника и обеспечить развёртывание и вступление в бой.<\/li><li>Тыл и техническое обеспечение идут за боевыми подразделениями, медпункт — в голове тыла.<\/li><\/ul>", "src": "Тема 5 «Передвижение и расположение на месте»"}, {"n": "15", "day": 2, "dayTitle": "Передвижение, оборона, наступление", "q": "Особенности передвижения войск воздушным и морским транспортом.", "k": "<div class=\"sub\">Воздушный транспорт<\/div><ol><li>Плюсы: <b>выигрыш во времени<\/b>, сохраняются силы л/с, моторесурс и топливо; минус — <b>без тяжёлой техники<\/b><\/li><li><b>Район погрузки<\/b>: <b>аэродромы<\/b>, <b>районы сосредоточения<\/b>, <b>районы ожидания<\/b> (5–⁠10 км от аэродромов), маршруты, <b>вспомогательный пункт управления ВТА<\/b><\/li><li><b>Район выгрузки<\/b>: аэродромы, <b>районы сбора<\/b> (не ближе 10 км), маршруты, ВПУ ВТА<\/li><\/ol><div class=\"sub\">Морской (речной) транспорт<\/div><ol><li>Перевозят пароходства на <b>судах<\/b>; подразделения формируют в <b>воинские эшелоны<\/b><\/li><li><b>Требования к судам<\/b>: безопасность, наименьшая утомляемость л/с, сохранность техники, компактность, минимальные сроки<\/li><li><b>Воинская вместимость<\/b> — сколько л/с, техники и грузов судно берёт безопасно<\/li><\/ol>", "cnt": 6, "m": "", "d": "<ul><li>Районы сосредоточения нужны, чтобы не скапливать войска у аэродромов; там распределяют подразделения по аэродромам и готовят технику.<\/li><li>В районы ожидания выходят непосредственно перед погрузкой.<\/li><li>Районы выгрузки — по возможности ближе к войскам, ведущим бой, но скрытно от радиотехнической разведки.<\/li><li>Грузовместимость судна — объём грузов во внутренних помещениях, в м³.<\/li><li>Воинская вместимость зависит от грузоподъёмности, полезной площади трюмов, твиндеков и палубы, оборудования судна, дальности перевозки и рода войск.<\/li><\/ul>", "src": "Тема 5 «Передвижение и расположение на месте»"}, {"n": "16", "day": 2, "dayTitle": "Передвижение, оборона, наступление", "q": "Сущность оборонительного боя. Виды обороны и условия перехода к обороне. Требования, предъявляемые к обороне.", "k": "<ol><li><b>Цели обороны<\/b>: <b>отразить (сорвать)<\/b> наступление превосходящих сил, <b>нанести значительные потери<\/b>, <b>удержать важные районы<\/b>, создать условия для <b>перехода в наступление<\/b><\/li><li><b>Сущность<\/b>: отражение наступления ударами авиации и огнём всех средств, <b>заграждения<\/b>, манёвр, <b>контратаки<\/b> при <b>упорном удержании<\/b> важных позиций<\/li><li><b>Виды<\/b>: <b>позиционная<\/b> — основной вид, упорное удержание районов, где потеря территории недопустима; <b>манёвренная<\/b> — потери противнику, выигрыш времени, сохранение сил, допускает оставление части территории<\/li><li><b>Переход<\/b>: <b>преднамеренно<\/b> или <b>вынужденно<\/b>; <b>вне соприкосновения<\/b> или <b>в непосредственном соприкосновении<\/b>; заблаговременно или в ходе боя<\/li><li><b>Требования<\/b>: оборона <b>устойчивая и активная<\/b>; позиции не оставлять <b>без приказа<\/b> старшего, даже в окружении<\/li><\/ol>", "cnt": 5, "m": "Цели «ОНУС»: Отразить, Нанести потери, Удержать, Создать условия", "d": "<ul><li>Вне соприкосновения: заблаговременно у границы в угрожаемый период, у пунктов дислокации при внезапном вторжении, на побережье, во вторых эшелонах.<\/li><li>В соприкосновении (чаще всего): при внезапном вторжении, для отражения контратак, закрепления захваченного, после больших потерь, при неудачном встречном бое.<\/li><li>Устойчивость и активность дают: стойкость и моральный дух; система огня, особенно ПТ, с заграждениями; надёжная ПВО; манёвр; контратаки; местность, инженерное оборудование и маскировка; защита от зажигательного оружия; взаимодействие; всестороннее обеспечение; твёрдое управление.<\/li><li>Обороняющимся придётся отражать противника с 5–⁠6‑кратным превосходством.<\/li><\/ul>", "src": "Тема 6 «Основы ведения обороны»"}, {"n": "17", "day": 2, "dayTitle": "Передвижение, оборона, наступление", "q": "Построение обороны: боевой порядок, система опорных пунктов и огневых позиций, система инженерных заграждений.", "k": "<ol><li><b>Построение обороны<\/b>: <b>боевой порядок<\/b>, <b>система опорных пунктов и огневых позиций<\/b>, <b>система огня<\/b>, <b>система заграждений<\/b><\/li><li><b>Боевой порядок мсб<\/b>: мср <b>первого эшелона<\/b> со средствами усиления, мср <b>второго эшелона<\/b> или <b>резерв<\/b> (не менее взвода), <b>огневые средства<\/b> в непосредственном подчинении, <b>бронегруппа<\/b>, <b>огневая засада<\/b><\/li><li><b>Система ОП батальона<\/b>: <b>позиция боевого охранения<\/b> (до 2 км), <b>опорные пункты рот<\/b> в батальонном районе обороны, <b>огневые позиции<\/b> танков, БМП, ПТУР, <b>траншеи и ходы сообщения<\/b><\/li><li><b>Размеры<\/b>: район мсб <b>3–⁠5 км<\/b> по фронту и <b>2–⁠2,5 км<\/b> в глубину; ОП роты <b>1–⁠1,5 км × до 1 км<\/b>; ОП взвода <b>до 500 × 400 м<\/b>; позиция отделения <b>до 100 м<\/b><\/li><li><b>Траншеи<\/b>: 3–⁠4; вторая в <b>300–⁠600 м<\/b> от первой, третья в <b>600–⁠1000 м<\/b> от второй<\/li><li><b>Система огня мсб<\/b>: участки сосредоточенного и рубежи заградительного огня артиллерии, <b>зоны ПТ и сплошного многослойного огня<\/b>, <b>подготовленный манёвр огнём<\/b>; основа — <b>ПТ огонь<\/b><\/li><li><b>Заграждения<\/b>: минно-взрывные, невзрывные, комбинированные; перед передним краем, на флангах, в промежутках и глубине; <b>прикрываются огнём<\/b><\/li><\/ol>", "cnt": 7, "m": "", "d": "<ul><li>Система огня — совокупность огня средств обычного оружия, размещённых по решению командира, для максимального поражения противника.<\/li><li>Промежутки между ОП рот — до 1000 м, между ОП взводов — до 300 м, между позициями отделений — до 50 м. На одном слайде ОП взвода указан 400 × 300 м.<\/li><li>Боевой порядок роты — в один или два эшелона; взводы могут стоять углом назад или уступом.<\/li><li>Взвод: отделения обычно в одной траншее в линию, при угрозе с фланга — уступом; есть группа управления и огневой поддержки, может быть группа боевых машин и кочующая БМП.<\/li><li>Позиции огневых средств — основные, запасные, временные; кочующие танки, БМП и орудия вводят противника в заблуждение.<\/li><li>Первая траншея — передний край; инженерное оборудование начинается сразу после определения позиций и организации системы огня.<\/li><li>Про заграждения текста в лекции почти нет (только схемы) — этот пункт сверь с конспектом.<\/li><\/ul>", "src": "Тема 6 «Основы ведения обороны»"}, {"n": "18", "day": 2, "dayTitle": "Передвижение, оборона, наступление", "q": "Способы и мероприятия защиты войск (в т.ч. от БпЛА и FPV-дронов), работа командира по защите войск в бою.", "k": "<ol><li><b>Основные мероприятия<\/b>: <b>оповещение и рассредоточение<\/b>, <b>маскировка и укрытие<\/b> л/с и техники<\/li><li><b>Остаться незамеченным<\/b>: не скапливаться на открытом месте, ночью без фонарей и фар, без костров и мусора, дым из блиндажей — по нескольким тонким каналам, навесы из маскировочной сети, «лисьи норы»<\/li><li><b>Наблюдение<\/b>: посты воздушного наблюдения (2–⁠3 разведчика, <b>до 400 м<\/b> от переднего края), круглосуточно<\/li><li><b>Огневое поражение<\/b>: <b>огневые группы<\/b> (снайпер, 1–⁠2 стрелка, наблюдатель с биноклем и связью); по летящему на подразделение — <b>непрерывный огонь с 700–⁠900 м<\/b>; сбоку или над — <b>заградительный или сопроводительный<\/b><\/li><li><b>Звено взвод–рота–батальон<\/b>: наблюдатель (отделение, взвод), пост воздушного наблюдения (рота); огонь — <b>дежурный автоматчик (пулемётчик)<\/b>, <b>дежурный расчёт БМП<\/b>, в батальоне <b>мсв<\/b> для огня по НЛЦ и <b>передатчики помех<\/b><\/li><li><b>Защита техники<\/b>: <b>решётчатые экраны («козырьки»)<\/b>, <b>сетки<\/b>, ПДЭСР (базовая часть, походный и боевой комплекты)<\/li><li><b>Работа командира<\/b>: <b>оценка обстановки и замысел<\/b> → <b>решение<\/b> → <b>планирование<\/b> → <b>взаимодействие, обеспечение, управление<\/b> → <b>контроль и помощь<\/b><\/li><\/ol>", "cnt": 7, "m": "", "d": "<ul><li>Рассредоточение — расстояния, исключающие одновременное поражение объектов одним БпЛА; не должно мешать задаче, управлению и взаимодействию.<\/li><li>Маскировка против БпЛА — скрытие, имитация (ложные позиции, макеты, имитаторы), демонстративные действия.<\/li><li>По малоразмерным целям из автоматов (пулемётов) — до 500 м, прицел 4 или «П»; целеуказание трассирующими.<\/li><li>Монтаж-демонтаж противодроновых экранов — не более 5–⁠10 минут; они не должны мешать эвакуации экипажа.<\/li><li>В жару около 40 °C тепловизор БпЛА почти не видит человека; при сильном ветре, дыме и грозе БпЛА летать не могут.<\/li><li>Важные объекты полка, бригады, дивизии прикрывают сводные группы из вторых эшелонов и резервов, с ПВО и РЭБ.<\/li><\/ul>", "src": "Темы 6 и 7 (оборона, наступление)"}, {"n": "19", "day": 2, "dayTitle": "Передвижение, оборона, наступление", "q": "Современный наступательный бой, его цель и сущность. Способы перехода в наступление.", "k": "<ol><li><b>Сущность<\/b>: поражение противника всеми огневыми средствами, <b>решительная атака<\/b>, <b>стремительное продвижение<\/b> в глубину, уничтожение и пленение живой силы, захват техники, овладение рубежами<\/li><li><b>Цель<\/b>: <b>полный разгром<\/b> противника и <b>овладение важными рубежами (районами), объектами<\/b><\/li><li><b>Черты<\/b>: <b>решительность, высокая скоротечность, напряжённость, динамичность<\/b>; наземно-воздушный характер<\/li><li>Наступают на <b>обороняющегося<\/b> (обычно с <b>прорыва обороны<\/b>), <b>наступающего<\/b> (встречный бой), <b>отходящего<\/b> (преследование)<\/li><li><b>Способы перехода<\/b>: <b>из положения непосредственного соприкосновения<\/b> и <b>с ходу<\/b><\/li><li>С обычным оружием основной способ — <b>последовательный разгром<\/b> обороняющегося противника<\/li><\/ol>", "cnt": 6, "m": "Черты «РСНД»: Решительность, Скоротечность, Напряжённость, Динамичность", "d": "<ul><li>Из соприкосновения: взводу (роте) назначают исходную позицию — траншею с ходами сообщения и огневыми позициями БМП; рота первого эшелона — в первой траншее, второго — во второй и третьей.<\/li><li>С ходу: бой готовят вне соприкосновения, а выдвижение, развёртывание и атаку проводят безостановочно; минусы — нагрузка на людей и расход горючего.<\/li><li>Исходный район: батальону до 10 км², роте до 1 км², взводу до 0,1 км²; удалён так, чтобы исключить поражение артиллерией.<\/li><li>Прорыв — взлом обороны на узком участке, брешь и её расширение в глубину и к флангам; взвод, рота, батальон сами оборону не прорывают, но участвуют.<\/li><li>Преимущества наступления: инициатива в выборе направления, времени и способов, рост морального духа.<\/li><\/ul>", "src": "Тема 7 «Основы ведения наступления»"}, {"n": "20", "day": 2, "dayTitle": "Передвижение, оборона, наступление", "q": "Боевой порядок подразделений тб в наступлении (элементы и построение).", "k": "<ol><li><b>Батальон<\/b>: <b>первый и второй эшелоны<\/b>, <b>артиллерийские подразделения<\/b>, подразделения и огневые средства в <b>непосредственном подчинении<\/b>; при одном эшелоне — <b>общевойсковой резерв<\/b><\/li><li><b>Рота<\/b>: <b>первый эшелон<\/b>, артиллерийское подразделение, средства в непосредственном подчинении (обычно <b>один эшелон<\/b>)<\/li><li><b>Первый эшелон<\/b> (2–⁠3 роты со средствами усиления) — разгром противника, ближайшая задача и развитие наступления<\/li><li><b>Второй эшелон<\/b> (до роты) — развитие успеха, замена или усиление первого эшелона, отражение контратак, уничтожение противника на флангах и в тылу<\/li><li><b>Задачи батальона<\/b>: <b>ближайшая<\/b> — уничтожить противника в ОП рот первого эшелона (<b>до 2 км<\/b>); <b>дальнейшая<\/b> — овладеть первой позицией (<b>3 км и более<\/b>)<\/li><li><b>Задачи роты (взвода)<\/b>: только <b>ближайшая<\/b> (ОП взвода первого эшелона, <b>до 0,5 км<\/b>) и <b>направление дальнейшего наступления<\/b><\/li><li><b>Построение взвода<\/b>: <b>в линию, углом вперёд, углом назад, уступом вправо (влево)<\/b><\/li><\/ol>", "cnt": 7, "m": "", "d": "<ul><li>Требования к боевому порядку: успешное наступление с обычным и ядерным оружием, сосредоточение усилий на избранном направлении, наибольшее участие огневых средств, поражение на большую глубину, быстрое использование результатов огня; наименьшая уязвимость, непрерывное взаимодействие, удобство управления.<\/li><li>Содержание задачи — уничтожение определённого противника и овладение рубежом к назначенному времени; глубина — удаление рубежа от переднего края противника.<\/li><li>Приданная артиллерия бьёт по средствам ЯО и ХО, танкам, ПТ средствам, пунктам управления, РЭС, сооружениям, обеспечивает освещение.<\/li><li>Для прорыва по опыту ВОВ нужно превосходство по танкам 6:1, по стрелковым ротам 4:1.<\/li><li>Схема боевого порядка именно тб в лекции дана рисунком — элементы те же, что у батальона.<\/li><\/ul>", "src": "Тема 7 «Основы ведения наступления»"}, {"n": "21", "day": 2, "dayTitle": "Передвижение, оборона, наступление", "q": "Встречный бой как разновидность наступательного боя.", "k": "<ol><li><b>Встречный бой<\/b> — <b>наступление на наступающего противника<\/b><\/li><li><b>Когда возникает<\/b>: <b>на марше<\/b>, при <b>контратаках в обороне<\/b>, при <b>развитии наступления<\/b><\/li><li><b>Цель<\/b>: <b>разгром<\/b> наступающего противника <b>в короткие сроки<\/b>, <b>захват инициативы<\/b>, выгодные условия для дальнейших действий<\/li><li><b>Черты<\/b>: резкое изменение обстановки и <b>скоротечность<\/b>, <b>быстрое сближение<\/b>, вступление в бой <b>с ходу<\/b>, борьба за <b>время, инициативу и огневое превосходство<\/b>, <b>промежутки и открытые фланги<\/b><\/li><li><b>Решающее<\/b>: <b>упреждение<\/b> противника в развёртывании, открытии огня и переходе в атаку<\/li><li><b>Задачи<\/b>: развёртывание мсб → огневое поражение → бой на <b>сковывающем<\/b> направлении → разгром <b>прикрытия (охранения)<\/b> → ввод <b>резерва<\/b> → разгром на <b>главном<\/b> направлении<\/li><\/ol>", "cnt": 6, "m": "Обе стороны наступают; кто первым развернулся и открыл огонь, тот и выиграл", "d": "<ul><li>Мсб ведёт встречный бой самостоятельно, мср — как правило в составе батальона.<\/li><\/ul>", "src": "Тема 7 «Основы ведения наступления»"}, {"n": "22", "day": 3, "dayTitle": "Управление, инженерка, местность", "q": "Органы и пункты управления полка.", "k": "<ol><li><b>Система управления<\/b> = <b>органы управления<\/b> + <b>пункты управления<\/b> + <b>средства управления<\/b> (связь и АСУ)<\/li><li><b>Органы управления<\/b> — руководящие лица и небольшие коллективы офицеров: <b>командиры, их заместители и штабы<\/b><\/li><li>Орган управления батальона = <b>командование + штаб<\/b>; командование тб: командир, заместитель, зам по <b>воспитательной работе<\/b>, зам по <b>вооружению<\/b> (в мсб ещё зам по <b>тылу<\/b> и помощник по <b>артиллерии<\/b>)<\/li><li><b>Пункт управления<\/b> — специально оборудованное место, откуда руководят подразделениями при подготовке и в ходе боя<\/li><li>В звене батальон–рота–взвод это <b>КНП<\/b>: высокоподвижные, на танках, БМП, БТР, командно-штабных машинах<\/li><li><b>Состав КНП<\/b>: <b>орган управления<\/b>, <b>средства управления<\/b>, <b>подразделения обеспечения и обслуживания<\/b><\/li><li>Система управления — <b>живучая, помехозащищённая, надёжная<\/b>; централизованное и децентрализованное управление<\/li><\/ol>", "cnt": 7, "m": "Система управления «ОПС»: Органы, Пункты, Средства", "d": "<ul><li>КНП подразделения — для руководства боем, наблюдения за полем боя и разведки противника наблюдением.<\/li><li>КНП мсб: командир, заместитель, помощник по артиллерии, офицеры штаба, командиры приданных подразделений; средства — БМП‑2К с Р‑173 и Р‑111, машина радиоотделения.<\/li><li>Размещение и перемещение КНП зависит от того, где подразделение: на месте, на марше, в наступлении, во встречном бою, в обороне.<\/li><li>Требования к управлению: устойчивость, непрерывность, оперативность, скрытность.<\/li><li>Вопрос назван «полка», но в лекции разобраны батальон и рота — отвечай по ним.<\/li><\/ul>", "src": "Тема 8 «Управление подразделением в бою»"}, {"n": "23", "day": 3, "dayTitle": "Управление, инженерка, местность", "q": "Порядок работы командира подразделения после получения боевой задачи.", "k": "<ol><li><b>Уяснение задачи<\/b><\/li><li><b>Мероприятия<\/b>, которые нужно провести <b>немедленно<\/b><\/li><li><b>Расчёт времени<\/b><\/li><li><b>Указания<\/b> подчинённым по подготовке<\/li><li><b>Оценка обстановки<\/b><\/li><li><b>Решение<\/b>, оформление на карте, <b>доклад<\/b> старшему и утверждение<\/li><li><b>Разработка<\/b> боевого приказа и указаний по взаимодействию, обеспечению, управлению<\/li><li><b>Рекогносцировка<\/b>: участие в рекогносцировке старшего и своя<\/li><li><b>Отдача боевого приказа<\/b><\/li><li>Организация <b>взаимодействия, боевого обеспечения, управления<\/b>, МПО, тылового, технического, медицинского обеспечения<\/li><\/ol>", "cnt": 10, "m": "Уяснил → Срочное → Время → Указания → Оценил → Решил и доложил → Разработал → Посмотрел → Приказал → Организовал", "d": "<ul><li>Это порядок работы командира взвода (штурмовой группы) из лекции темы 3; порядок для командира батальона (роты) — в вопросе 4.<\/li><li>В штурме при оценке обстановки командир взвода дополнительно изучает систему огня объекта, подступы, заграждения, ширину улиц, подземные сооружения, водные преграды.<\/li><li>Отделениям указывают объект атаки, направление продолжения наступления и рубеж перехода в атаку; группе управления, огневой поддержки и группе боевых машин — состав и задачи.<\/li><\/ul>", "src": "Тема 3 «Основы штурмовых действий»"}, {"n": "24", "day": 3, "dayTitle": "Управление, инженерка, местность", "q": "Содержание взаимодействия в основных видах боя.", "k": "<ol><li><b>Взаимодействие<\/b> — согласование действий подразделений <b>по задачам, направлениям, рубежам и времени<\/b><\/li><li>Организует <b>командир<\/b> с заместителями и командирами подчинённых, приданных и взаимодействующих подразделений<\/li><li>Доводятся <b>сигналы оповещения, взаимодействия, управления, опознавания<\/b>, способы <b>целеуказания и корректирования огня<\/b><\/li><li><b>Методы<\/b>: <b>указаний<\/b> командира; <b>заслушивания докладов<\/b> с розыгрышем тактических эпизодов; их <b>сочетание<\/b><\/li><li><b>Оборона<\/b>: по задачам, рубежам, времени и <b>вероятным направлениям наступления<\/b> — при выдвижении и атаке противника, его <b>вклинении<\/b>, <b>контратаках<\/b>, ударах ЯО и ВТО, смене позиций<\/li><li><b>Наступление<\/b>: <b>на всю глубину<\/b>, детально — на глубину <b>ближайшей задачи<\/b>: выдвижение и развёртывание, <b>проходы<\/b>, <b>атака переднего края<\/b>, бой в глубине, <b>отражение контратак<\/b>, <b>ввод второго эшелона<\/b><\/li><\/ol>", "cnt": 6, "m": "", "d": "<ul><li>Цель — единое понимание задачи и способов её выполнения, знание всем л/с сигналов и порядка действий по ним.<\/li><li>На местности взаимодействие организуют на глубину видимости, по карте и макету — на всю глубину задачи.<\/li><li>При остром дефиците времени — методом указаний или прямо при постановке задач.<\/li><li>Доводят общую схему ориентиров и единую нумерацию целей.<\/li><li>Командиры взаимодействующих подразделений держат устойчивую связь и информируют друг друга.<\/li><\/ul>", "src": "Тема 8 «Управление подразделением в бою»"}, {"n": "25", "day": 3, "dayTitle": "Управление, инженерка, местность", "q": "Назначение, характеристики, способы устройства сооружений для ведения огня, укрытий для личного состава и техники.", "k": "<ol><li><b>Очерёдность работ<\/b>: <b>первая очередь<\/b> — занятие обороны и отражение противника; <b>вторая<\/b> — дооборудование и круговая оборона; <b>дальнейшие<\/b> — совершенствование<\/li><li><b>Для ведения огня<\/b>: <b>одиночные (парные) окопы<\/b> → <b>окопы на отделение<\/b> → <b>траншея<\/b>; окопы для <b>БМП и танков<\/b> на основных и запасных позициях; <b>ходы сообщения<\/b><\/li><li><b>Окоп для стрелка<\/b>: для стрельбы <b>лёжа → с колена → стоя<\/b><\/li><li><b>Для л/с<\/b> по росту защиты: <b>открытые и перекрытые щели<\/b>, <b>блиндажи<\/b>, <b>убежища<\/b><\/li><li><b>Щель<\/b>: длина 3–⁠4 м, глубина 1,5 м, ширина по дну 60 см; перекрытие с обсыпкой <b>не менее 60 см<\/b><\/li><li><b>Блиндаж<\/b> — защита от ЯО и обычных средств, <b>кратковременное<\/b> пребывание, на <b>6–⁠8 человек<\/b><\/li><li><b>Траншея<\/b> — огонь, наблюдение, скрытое расположение, манёвр; <b>ломаного начертания<\/b>: фасы <b>40–⁠50 м<\/b> (машинами) или <b>20–⁠30 м<\/b> (вручную)<\/li><li><b>Способы<\/b>: <b>вручную<\/b> или <b>землеройными машинами<\/b>; техника — в <b>окопах и укрытиях<\/b> под маскировочными покрытиями<\/li><\/ol>", "cnt": 8, "m": "", "d": "<ul><li>Первая очередь: окопы для пулемётчиков, гранатомётчиков, стрелков-зенитчиков, окопы для танков и БМП на основных позициях, расчистка секторов.<\/li><li>Вторая: окопы соединяют в окопы на отделение, окопы на запасных позициях, ходы сообщения к БМП и танкам, перекрытые щели или блиндажи на каждое отделение.<\/li><li>Дальше: окопы соединяют траншеей, ходы сообщения в тыл — сначала глубиной 0,6 м, потом 1,1 м; ячейки, площадки, бойницы, ниши для боеприпасов.<\/li><li>Траншею оборудуют бойницами, ячейками для стрелков, площадками для пулемётов, укрытиями; прямолинейное начертание не допускается.<\/li><li>В районе расположения: сразу щели, при наличии времени блиндажи и убежища; техника — под радиорассеивающими и теплоотражающими покрытиями; в населённом пункте укрываются в подвалах.<\/li><\/ul>", "src": "Темы 5 и 6 (инженерное оборудование)"}, {"n": "26", "day": 3, "dayTitle": "Управление, инженерка, местность", "q": "Средства и приёмы маскировки.", "k": "<ol><li><b>Цель<\/b>: ввести противника в заблуждение о <b>составе, положении, состоянии и намерениях<\/b> войск; внезапность, живучесть, сохранение боеспособности<\/li><li><b>Способы (приёмы)<\/b>: <b>скрытие, имитация, демонстративные действия, дезинформация<\/b><\/li><li><b>Мероприятия<\/b>: <b>рассредоточение<\/b> и скрытое расположение с использованием местности; <b>радиомаскировка<\/b>; <b>световая и звуковая<\/b> маскировка; <b>ложные районы<\/b>; <b>демонстративные действия<\/b> и передвижения<\/li><li><b>Средства<\/b>: <b>естественные<\/b> (местность, растительность, ночь, туман); <b>табельные<\/b> (маскировочные сети и комплекты, радиорассеивающие и <b>теплоотражающие покрытия<\/b>, <b>макеты<\/b>, тепловые ловушки); <b>местные<\/b> (ветки, трава, снег); <b>дымовые<\/b><\/li><li><b>Скрыть<\/b>: в обороне — план, состав, систему позиций, огневые рубежи и рубежи контратак, заграждения; в наступлении — <b>цель, замысел и время начала<\/b>, боевой порядок, исходные районы, рубежи развёртывания и атаки<\/li><\/ol>", "cnt": 5, "m": "«СИДД»: Скрытие, Имитация, Демонстративные действия, Дезинформация", "d": "<ul><li>Имитация — воспроизведение демаскирующих признаков: ложные позиции, районы, маршруты, мосты; показ жизнедеятельности — движение машин, следы, работа радиостанций, костры.<\/li><li>Маскировку проверяют визуальным наблюдением; каждый командир контролирует маскировочную дисциплину.<\/li><li>Командир взвода указывает мероприятия, объём, сроки, силы и средства, порядок соблюдения маскировочной дисциплины и контроля.<\/li><li>Против БпЛА — см. вопрос 18: навесы из сетей, «лисьи норы», без костров и фонарей.<\/li><\/ul>", "src": "Темы 4–⁠6 (маскировка)"}, {"n": "27", "day": 3, "dayTitle": "Управление, инженерка, местность", "q": "Тактические свойства местности.", "k": "<ol><li><b>Определение<\/b>: свойства местности, существенно влияющие на организацию и ведение боя, применение оружия и техники<\/li><li><b>Проходимость<\/b> — проходимая, труднопроходимая, непроходимая<\/li><li>Условия <b>ориентирования<\/b><\/li><li>Условия <b>наблюдения<\/b><\/li><li><b>Маскирующие<\/b> свойства<\/li><li>Условия <b>ведения огня<\/b><\/li><li><b>Защитные<\/b> свойства<\/li><li>Условия <b>инженерного оборудования<\/b><\/li><\/ol>", "cnt": 8, "m": "«ПОНМОЗИ»: Проходимость, Ориентирование, Наблюдение, Маскировка, Огонь, Защита, Инженерное оборудование", "d": "<ul><li>Проходимость способствует или затрудняет передвижение. Крутизна доступных скатов: автомобиль и БТР — 20–⁠30°, танк — 30–⁠35° (на коротких подъёмах до 40°).<\/li><li>Защитные свойства ослабляют поражающие факторы ядерного и обычного оружия: рельеф, растительность, укрытия.<\/li><li>Наблюдение — просматриваемость и дальность обзора; ориентирование — возможность определить своё место и направление.<\/li><li>Ведение огня — удобное и скрытое расположение огневых средств, точный огонь, корректирование.<\/li><li>Инженерное оборудование зависит от грунта, грунтовых вод, стройматериалов, укрытий и препятствий.<\/li><li>Рельеф: равнинный (до 300 м), холмистый (до 500 м), низкогорный (500–⁠1000 м), среднегорный (1000–⁠2000 м), высокогорный (свыше 2000 м).<\/li><\/ul>", "src": "Лекция «Ориентирование на местности»"}, {"n": "28", "day": 3, "dayTitle": "Управление, инженерка, местность", "q": "Понятия: дирекционный угол, истинный азимут, магнитный азимут. Подготовка данных для движения по азимутам.", "k": "<ol><li><b>Дирекционный угол<\/b> — угол в горизонтальной плоскости при точке стояния, по ходу часовой стрелки <b>от 0 до 360°<\/b>, между <b>северным направлением вертикальной линии километровой сетки<\/b> и направлением на объект<\/li><li><b>Истинный азимут<\/b> — то же, от <b>северного направления истинного меридиана<\/b><\/li><li><b>Магнитный азимут<\/b> — то же, от <b>северного направления магнитного меридиана<\/b><\/li><li><b>Подготовка данных<\/b>: маршрут с <b>ориентирами у поворотов<\/b> → <b>дирекционный угол и длина<\/b> каждого участка → перевод <b>с учётом поправки<\/b> в <b>магнитные азимуты<\/b> → длины в <b>пары шагов<\/b> (≈1,5 м) → <b>таблица, карта или схема<\/b><\/li><li><b>Движение<\/b>: от ориентира к ориентиру; на исходном пункте выставить азимут, ориентировать компас, выбрать предмет и идти<\/li><\/ol>", "cnt": 5, "m": "", "d": "<ul><li>Поправка направления ПН = (±δ) − (±γ), где δ — склонение магнитной стрелки, γ — сближение меридианов; Ам = α − ПН. Значения даны под южной рамкой карты.<\/li><li>Точность компаса Андрианова ±2–⁠3°; отклонение при выходе к ориентиру — обычно 1/10 пройденного пути.<\/li><li>Обход препятствия: при видимости — заметить ориентир на той стороне и прибавить ширину препятствия; без видимости — по прямым с фиксированными азимутами и длинами.<\/li><li>По азимутам ходят при плохой видимости и на местности, бедной ориентирами; при магнитной аномалии компас не годится.<\/li><li>Пример строки таблицы: «Развилка дорог — опушка леса, 42°, 900 пар шагов».<\/li><\/ul>", "src": "Лекция «Ориентирование на местности»"}, {"n": "29", "day": 3, "dayTitle": "Управление, инженерка, местность", "q": "Ориентиры и порядок их использования в бою, порядок целеуказания в бою.", "k": "<ol><li><b>Ориентиры<\/b> — местные предметы и формы рельефа, относительно которых определяют своё место, положение целей и указывают направление<\/li><li>Выбирают <b>ясно видимые<\/b>, которые противник <b>не может уничтожить<\/b>; <b>нумеруют справа налево и по рубежам от себя в сторону противника<\/b><\/li><li><b>Виды<\/b>: <b>площадные<\/b> (населённые пункты, леса), <b>линейные<\/b> (дороги, реки, ЛЭП), <b>точечные<\/b> (трубы, перекрёстки, отдельные деревья)<\/li><li><b>Целеуказание<\/b> — быстрое и правильное указание целей и ориентиров: <b>на местности, по карте, по аэрофотоснимку<\/b><\/li><li><b>На местности<\/b>: <b>от ориентира<\/b>, <b>по азимуту и дальности<\/b>, <b>от направления движения<\/b>, <b>по азимутальному указателю<\/b>, <b>наведением оружия<\/b>, <b>трассирующими<\/b> пулями и сигнальными ракетами<\/li><li><b>По карте<\/b>: в <b>прямоугольных координатах<\/b>, <b>по квадратам<\/b> сетки, <b>от условной линии<\/b>, <b>от ориентиров<\/b> и контуров, <b>по азимуту и дальности<\/b><\/li><li>Пример: «<b>Ориентир два, вправо сорок пять, дальше сто, у отдельного дерева — наблюдатель<\/b>»<\/li><\/ol>", "cnt": 7, "m": "", "d": "<ul><li>Квадрат называют по координатам юго-западного угла: «Цель М, квадрат 6590»; уточняют делением на 4 части (буквы) или 9 частей (цифры, «улитка»): «квадрат 6590‑Б» или «квадрат 65904».<\/li><li>Угол от ориентира — в тысячных, удаление — в метрах; с приборами можно давать вертикальный угол: «Ориентир четыре, влево тридцать, ниже десять».<\/li><li>Полярный способ: «Азимут тридцать пять, дальность шестьсот — танк в окопе — уничтожить».<\/li><li>Наведение оружия — когда дающий и принимающий рядом, например в танке: «Бронетранспортёр, пятьсот».<\/li><li>Тактическое ориентирование — знать своё место относительно своих войск и противника и свою задачу.<\/li><\/ul>", "src": "Лекция «Ориентирование» и тема 12"}, {"n": "30", "day": 4, "dayTitle": "Топография и документы", "q": "Сущность картографического изображения местности и его основные свойства. Топографическая карта и план, уровенная поверхность, эллипсоид, масштаб карты.", "k": "<ol><li><b>Сущность<\/b>: изображение земной поверхности на плоскости по <b>математическим законам<\/b> — проектирование на <b>уровенную поверхность<\/b>, затем <b>картографическая проекция<\/b>; часть свойств при этом неизбежно искажается<\/li><li><b>Уровенная поверхность<\/b> — перпендикулярна отвесным линиям; совпадающая со спокойным океаном даёт <b>геоид<\/b><\/li><li><b>Эллипсоид<\/b> — двухосный эллипсоид вращения, ближайший к геоиду, для упрощения расчётов (отличие от геоида — до ~100 м)<\/li><li><b>Топографическая карта<\/b> — <b>уменьшенное, точное, подробное и наглядное<\/b> изображение земной поверхности со всеми объектами в определённой проекции<\/li><li><b>План<\/b> — изображение <b>небольшого участка<\/b> без учёта кривизны Земли, в крупном масштабе<\/li><li><b>Масштаб<\/b> — отношение длины линии на карте к длине на местности: <b>численный<\/b> (1:100 000), <b>величина масштаба<\/b> (в 1 см 1 км), <b>линейный<\/b><\/li><li>Карты 1:500 000 и крупнее — в <b>равноугольной поперечно-цилиндрической проекции Гаусса<\/b><\/li><\/ol>", "cnt": 7, "m": "Топокарта — уменьшенная, точная, подробная, наглядная", "d": "<ul><li>Карта (географическая) — обобщённое изображение земной поверхности на плоскости, построенное по математическим законам.<\/li><li>Проекции по характеру искажений: равноугольные, равновеликие, равнопромежуточные, произвольные.<\/li><li>Классификация: крупномасштабные 1:25 000 и 1:50 000 (тактические); среднемасштабные 1:100 000 и 1:200 000 (оперативно-тактические); мелкомасштабные 1:500 000 и 1:1 000 000 (оперативные).<\/li><li>Горизонтальное проложение — проекция линии местности на уровенную поверхность; на скате 20° расстояние по карте нужно увеличивать на 6%.<\/li><li>Определение плана в тексте лекции не дано — сверь с конспектом.<\/li><\/ul>", "src": "Тема 11 «Топографические карты и их чтение»"}, {"n": "31", "day": 4, "dayTitle": "Топография и документы", "q": "Разграфка и номенклатура топографических карт. Определение номенклатуры смежных листов.", "k": "<ol><li><b>Разграфка<\/b> — система деления карты на листы; <b>номенклатура<\/b> — система обозначения листов<\/li><li>В основе — лист <b>1:1 000 000<\/b>: <b>ряды<\/b> — прописные латинские буквы через <b>4° по широте<\/b> от экватора; <b>колонны<\/b> — цифры через <b>6° по долготе<\/b>: <b>N‑37<\/b> (Москва), <b>N‑44<\/b> (Барнаул)<\/li><li><b>1:500 000<\/b> — 4 листа (2°×3°): N‑37‑<b>В<\/b><\/li><li><b>1:200 000<\/b> — 36 листов (40′×1°): N‑37‑<b>XXX<\/b><\/li><li><b>1:100 000<\/b> — 144 листа (20′×30′): N‑37‑<b>91<\/b><\/li><li><b>1:50 000<\/b> — 4 листа от 1:100 000 (10′×15′): N‑37‑91‑<b>Б<\/b><\/li><li><b>1:25 000<\/b> — 4 листа от 1:50 000 (5′×7′30″): N‑37‑91‑В‑<b>а<\/b><\/li><li><b>Смежные листы 1:100 000<\/b> (сетка 12×12): <b>±1<\/b> по сторонам, <b>±12<\/b> сверху и снизу, <b>±11 и ±13<\/b> по углам<\/li><\/ol>", "cnt": 8, "m": "4 → 36 → 144, дальше всё по 4: А, а, 1", "d": "<ul><li>Пример из лекции: вокруг М‑35‑28 лежат М‑35‑15, 16, 17, 27, 29, 39, 40, 41.<\/li><li>Для 1:50 000 соседей ищут по буквам: вокруг N‑36‑51‑А — N‑36‑38‑Г, 39‑В, 39‑Г, 50‑Б, 51‑Б, 50‑Г, 51‑В, 51‑Г.<\/li><li>На краю переходят на соседний миллионный лист: над N‑35‑2 лежит О‑35‑134.<\/li><li>Рядов 44 (по 22 от экватора), всего 2640 листов миллионной карты; листы внутри нумеруют слева направо и сверху вниз.<\/li><\/ul>", "src": "Тема 11 «Топографические карты и их чтение»"}, {"n": "32", "day": 4, "dayTitle": "Топография и документы", "q": "Виды условных знаков, цветовое оформление карт, пояснительные подписи и цифровые обозначения.", "k": "<ol><li><b>Топографические условные знаки<\/b> — система графических, цифровых и буквенных обозначений местоположения объектов и их характеристик<\/li><li><b>Масштабные<\/b> (площадные, контурные, <b>линейные<\/b>) — размеры можно измерить по карте: лес, озеро, дорога<\/li><li><b>Внемасштабные<\/b> — мелкие объекты без соблюдения масштаба: колодец, отдельное дерево, памятник; положение — <b>главная точка<\/b> знака<\/li><li><b>Пояснительные<\/b> — дополнительная характеристика: порода леса, направление течения<\/li><li><b>Цвета<\/b>: <b>зелёный<\/b> — растительность; <b>синий<\/b> — гидрография; <b>коричневый<\/b> — рельеф; <b>оранжевый<\/b> — автострады и шоссе, огнестойкие кварталы; <b>жёлтый<\/b> — улучшенные грунтовые дороги, неогнестойкие кварталы; <b>чёрный<\/b> — остальное<\/li><li><b>Цифры<\/b>: жители в сельских пунктах, ширина, глубина и скорость <b>рек<\/b>, <b>мосты<\/b>, <b>броды<\/b>, <b>паромы<\/b>, <b>лес<\/b>, <b>дороги<\/b><\/li><\/ol>", "cnt": 6, "m": "", "d": "<ul><li>Главная точка внемасштабного знака: геометрический центр (симметричный знак), середина основания (широкое основание), вершина прямого угла у основания, центр нижней фигуры (составной знак).<\/li><li>У линейного знака точное положение объекта — по продольной оси знака.<\/li><li>Мост «ЖБ 12 / 370–⁠10 / 60»: железобетон, 12 м над водой, длина 370 м, ширина 10 м, грузоподъёмность 60 т.<\/li><li>Лес «25/0,30 6»: высота 25 м, толщина 0,30 м, расстояние между деревьями 6 м.<\/li><li>Автострада «8×2Ц»: полоса 8 м, 2 полосы, цементобетон. Брод — глубина, длина, грунт, скорость течения.<\/li><li>Группы знаков: рельеф, гидрография, населённые пункты, дорожная сеть, растительность и грунты, отдельные объекты.<\/li><\/ul>", "src": "Тема 11 «Топографические карты и их чтение»"}, {"n": "33", "day": 4, "dayTitle": "Топография и документы", "q": "Виды боевых графических документов, составляемых в подразделениях, их назначение.", "k": "<ol><li><b>Рабочая карта командира<\/b> — основной документ: решение, обстановка, ход боя<\/li><li><b>Расчёт времени<\/b><\/li><li><b>Боевой приказ<\/b> (записывается в рабочую тетрадь)<\/li><li><b>Указания по видам всестороннего обеспечения<\/b><\/li><li><b>Плановая таблица взаимодействия<\/b><\/li><li><b>Схема района обороны (опорного пункта)<\/b> и расположения в районе<\/li><li><b>Карточка огня<\/b> (отделения, взвода, танка, БМП)<\/li><\/ol>", "cnt": 7, "m": "", "d": "<ul><li>Эти документы разрабатывает штаб батальона (командир роты) на основе решения командира.<\/li><li>Карточка огня отделения: ориентиры с номерами, названиями и расстояниями; противник; позиция отделения; полоса огня и дополнительный сектор; позиции БМП, РПГ, пулемёта; секторы обстрела; соседи; участки сосредоточенного огня; заграждения.<\/li><li>Для движения по азимутам составляют схему маршрута или таблицу.<\/li><li>В лекциях документы перечислены списком, отдельной классификации «графических» нет — при ответе подчеркни, что графические — это карта, схемы и карточка огня.<\/li><\/ul>", "src": "Темы 2 и 6"}, {"n": "34", "day": 4, "dayTitle": "Топография и документы", "q": "Содержание рабочей карты командира, порядок и правила её ведения.", "k": "<div class=\"sub\">Что на карте<\/div><ol><li><b>Противник<\/b>: положение, состав, вероятный характер действий<\/li><li><b>Задача<\/b> своего подразделения, <b>задачи соседей<\/b> и разграничительные линии, <b>задачи старшего<\/b> в районе действий<\/li><li><b>Замысел<\/b> и <b>задачи подчинённым<\/b><\/li><li><b>КНП<\/b>: место и время развёртывания<\/li><li>Вопросы <b>взаимодействия, обеспечения, управления<\/b>; <b>таблица сигналов<\/b>; расчёты и пояснения<\/li><li>Районы, маршруты, рубежи, время, построение походного порядка<\/li><\/ol><div class=\"sub\">Подготовка карты<\/div><ol><li><b>Выбор<\/b> → <b>склеивание<\/b> → <b>подъём<\/b> → <b>складывание<\/b> → <b>кодировка<\/b><\/li><\/ol><div class=\"sub\">Правила<\/div><ol><li>Ведёт <b>лично командир<\/b>; <b>точно, наглядно, своевременно<\/b>, принятыми знаками, с указанием <b>времени<\/b><\/li><\/ol>", "cnt": 8, "m": "", "d": "<ul><li>Выбор: год съёмки (за рамкой в юго-восточном углу), масштаб и точность, высота сечения рельефа, шкала заложения, схема магнитного склонения.<\/li><li>Склеивание: срезают правые поля (кроме крайних правых) и нижние поля (кроме крайних нижних); склеивают в колонны, затем колонны между собой.<\/li><li>Подъём карандашами: зелёный — растительность, синий — гидрография и болота, светло-коричневый — рельеф, тёмно-коричневый — дороги, чёрный — остальное и подписи. Подъём не должен нарушать топографическую основу.<\/li><li>Складывание: ориентировать к противнику или вдоль маршрута, подогнуть по ширине сумки, сложить гармошкой.<\/li><li>Кодировка: километровым линиям дают условные номера — по X трёхзначные, по Y двухзначные.<\/li><li>Рабочая карта часто единственный боевой документ командира подразделения.<\/li><\/ul>", "src": "Темы 2 и 12"}, {"n": "35", "day": 4, "dayTitle": "Топография и документы", "q": "Тактические условные знаки и сокращённые обозначения, надписи на картах, нанесение обстановки на карту.", "k": "<ol><li><b>Цвета<\/b>: <b>красный<\/b> — свои войска (общевойсковые подразделения, их позиции и действия); <b>чёрный<\/b> — артиллерия, спецвойска, заграждения, надписи; <b>синий<\/b> — противник<\/li><li><b>Знаки<\/b> показывают: <b>подразделения<\/b>, <b>позиции и районы<\/b>, <b>рубежи и направления<\/b> действий (стрелки), <b>огневые средства<\/b>, <b>заграждения<\/b>, <b>пункты управления<\/b><\/li><li><b>Надписи<\/b>: только принятые <b>сокращения<\/b>, параллельно северу, на свободных местах, с <b>временем<\/b> положения<\/li><li><b>Нанесение<\/b>: точно по месту, ориентируясь на местные предметы; обстановку на разное время — с подписью времени<\/li><\/ol>", "cnt": 4, "m": "", "d": "<ul><li>Центр (основание) знака совпадает с фактическим положением объекта.<\/li><li>Планируемое (предполагаемое) положение — прерывистой линией, фактическое — сплошной.<\/li><li>Направления действий — стрелками: наступление, контратака, отход.<\/li><li>Цветовую схему сверь с конспектом: в пособиях её детализируют по-разному.<\/li><\/ul>", "src": ""}, {"n": "36", "day": 5, "dayTitle": "Связь", "q": "Задачи связи.", "k": "<ol><li>Главная задача — <b>обеспечение управления<\/b> подразделениями в <b>любой обстановке<\/b><\/li><li>Своевременная <b>передача приказов, команд и сигналов<\/b><\/li><li><b>Сбор донесений<\/b> и докладов<\/li><li><b>Оповещение<\/b> о противнике, ударах с воздуха, БпЛА, ОМП<\/li><li>Обеспечение <b>взаимодействия<\/b> с соседями, артиллерией, авиацией<\/li><\/ol>", "cnt": 5, "m": "", "d": "<ul><li>Связь — основное средство управления; без неё командир теряет влияние на бой.<\/li><li>Организуется по решению командира и указаниям старшего штаба.<\/li><li>Средства: радио, проводные, подвижные (посыльные), сигнальные.<\/li><\/ul>", "src": ""}, {"n": "37", "day": 5, "dayTitle": "Связь", "q": "Требования, предъявляемые к связи.", "k": "<ol><li><b>Своевременность<\/b> — информация передаётся в установленные сроки<\/li><li><b>Достоверность<\/b> — принимается без искажений<\/li><li><b>Безопасность (скрытность)<\/b> — противник не получает сведений из переговоров и не может засечь средства связи<\/li><li><b>Надёжность (устойчивость)<\/b> — работа при помехах, ударах, перемещениях; живучесть и помехоустойчивость<\/li><\/ol>", "cnt": 4, "m": "«СДБН» — Связь Должна Быть Надёжной", "d": "<ul><li>Как достигается: дублирование каналов, запасные частоты, ДКС и засекречивающая аппаратура, дисциплина связи.<\/li><li>Безопасность нарушают переговоры открытым текстом и лишние выходы в эфир: по ним противник пеленгует станцию и наводит удар.<\/li><\/ul>", "src": ""}, {"n": "38", "day": 5, "dayTitle": "Связь", "q": "Правила установления связи, передачи и подтверждения сигнала и радиограммы.", "k": "<ol><li><b>Установление связи<\/b>: в радиосети связь устанавливает <b>главная станция<\/b>; подчинённые отвечают по очереди<\/li><li><b>Вызов<\/b>: «<b>Сосна, я Береза, как слышите? Приём<\/b>» → «<b>Береза, я Сосна, слышу хорошо, приём<\/b>»<\/li><li><b>Сигнал<\/b>: «Сосна, я Береза, <b>333, 333<\/b>, приём» → подтверждение <b>повторением сигнала<\/b>: «Береза, я Сосна, 333, приём»<\/li><li><b>Радиограмма<\/b>: вызов → «<b>радиограмма<\/b>» → номер, число групп, <b>текст<\/b> → «приём»; <b>квитанция<\/b>: «Береза, я Сосна, <b>номер радиограммы<\/b>, приём»<\/li><li><b>Правила<\/b>: только <b>позывные и назначенные частоты<\/b>, работа по <b>ДКС<\/b>, кратко; <b>без открытого текста<\/b> о войсках; соблюдать <b>радиомолчание<\/b><\/li><\/ol>", "cnt": 5, "m": "", "d": "<ul><li>Позывные, частоты, время перехода на запасные частоты — в радиоданных.<\/li><li>Сигналы — по таблице сигналов, текст — по переговорной таблице, координаты — по кодированной карте.<\/li><li>Минимум времени на передачу — противник пеленгует станции.<\/li><li>Точные слова и форму квитанции сверь с тем, как учили на занятиях по связи.<\/li><\/ul>", "src": ""}, {"n": "39", "day": 5, "dayTitle": "Связь", "q": "Радиосеть, радионаправление, направление проводной связи, ось проводной связи.", "k": "<ol><li><b>Радиосеть<\/b> — связь <b>одного<\/b> командира (главной станции) с <b>несколькими<\/b> корреспондентами на <b>общей частоте<\/b><\/li><li><b>Радионаправление<\/b> — связь <b>между двумя<\/b> радиостанциями<\/li><li><b>Направление проводной связи<\/b> — линия от пункта управления старшего к <b>одному<\/b> пункту подчинённого<\/li><li><b>Ось проводной связи<\/b> — линия, проложенная в направлении <b>перемещения ПУ<\/b> старшего; ПУ подчинённых <b>п
