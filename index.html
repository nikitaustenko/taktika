одключаются к ней отводами<\/b><\/li><\/ol>", "cnt": 4, "m": "Сеть — один со многими; направление — один с одним; ось — линия вслед за КП", "d": "<ul><li>Радиосеть экономит частоты и позволяет дать команду всем сразу (циркулярно).<\/li><li>Радионаправление надёжнее и быстрее для важного корреспондента, но занимает отдельную частоту.<\/li><li>Ось удобна в наступлении: линию наращивают по мере продвижения КП.<\/li><\/ul>", "src": ""}, {"n": "40", "day": 5, "dayTitle": "Связь", "q": "Назначение, характеристика, общее устройство радиостанций Р‑173 и Р‑123М.", "k": "<ol><li><b>Назначение<\/b>: беспоисковая бесподстроечная <b>телефонная связь<\/b> между подвижными объектами (танки, БМП) в тактическом звене — <b>на стоянке и в движении<\/b><\/li><li><b>Тип<\/b>: УКВ, <b>симплексные<\/b>, с <b>частотной модуляцией<\/b>, возимые<\/li><li><b>Р‑173<\/b>: <b>30–⁠75,999 МГц<\/b>, шаг <b>1 кГц<\/b>, <b>10 ЗПЧ<\/b>, мощность <b>≥ 30 Вт<\/b>, дальность <b>до 20 км<\/b>, питание <b>27 В<\/b><\/li><li><b>Р‑123М<\/b>: <b>20–⁠51,5 МГц<\/b> (2 поддиапазона: 20–⁠35,75 и 35,75–⁠51,5), шаг <b>25 кГц<\/b> (1261 частота), <b>4 ЗПЧ<\/b>, мощность <b>≥ 20 Вт<\/b>, дальность <b>до 20 км<\/b> (с включённым шумоподавителем ≈ 13 км), питание <b>26 В<\/b><\/li><li><b>Устройство<\/b>: <b>приёмопередатчик<\/b>, <b>блок питания<\/b> (у Р‑123М), <b>антенное устройство и штыри<\/b>, <b>блок антенных фильтров<\/b>, ВЧ- и НЧ-кабели, <b>нагрудный переключатель<\/b>, ларингофоны (шлемофон), ЗИП<\/li><\/ol>", "cnt": 5, "m": "У 173‑й всё больше: 30–⁠76 МГц, 10 ЗПЧ, 30 Вт. У 123М: 20–⁠51,5 МГц, 4 ЗПЧ, 20 Вт", "d": "<ul><li>Р‑173 — более современная станция (цифровой набор частоты), пришла на смену Р‑123М.<\/li><li>ЗПЧ — заранее подготовленные частоты: переход одним переключателем, без перестройки.<\/li><li>Дальность — для штыревой антенны на средне-пересечённой местности.<\/li><\/ul>", "src": ""}, {"n": "41", "day": 5, "dayTitle": "Связь", "q": "Документы кодированной связи, их классификация и предназначение.", "k": "<ol><li><b>ДКС<\/b> — для <b>скрытия содержания<\/b> переговоров и <b>сокращения времени<\/b> передачи<\/li><li><b>Переговорные таблицы<\/b> — кодирование типовых слов и фраз (команд, докладов)<\/li><li><b>Таблицы сигналов<\/b> — кодированные сигналы (цифровые, словесные) для управления и оповещения<\/li><li><b>Кодированные карты<\/b> (кодировочные таблицы к карте) — кодирование <b>координат<\/b> и местности<\/li><li><b>Таблицы позывных<\/b> и <b>радиоданные<\/b> — скрытие принадлежности и должностей корреспондентов<\/li><\/ol>", "cnt": 5, "m": "", "d": "<ul><li>ДКС выдают под роспись, хранят и уничтожают по правилам; при угрозе захвата — уничтожают.<\/li><li>Срок действия ограничен, по истечении их меняют.<\/li><li>Кодированная карта (тема 12): километровым линиям вокруг района действий присваивают произвольные номера, известные передающему и принимающему.<\/li><li>Набор документов может отличаться — ориентируйся на те, с которыми работали на занятиях.<\/li><\/ul>", "src": ""}, {"n": "П1", "day": 5, "dayTitle": "Связь", "q": "Практика 1. Кодирование (раскодирование) радиограмм и сигналов (команд).", "k": "<ol><li>Составить текст <b>кратко<\/b><\/li><li>Типовые слова и фразы → <b>коды по переговорной таблице<\/b><\/li><li><b>Координаты<\/b> → по <b>кодированной карте<\/b><\/li><li><b>Сигналы и команды<\/b> → по <b>таблице сигналов<\/b><\/li><li>Проверить, проставить <b>номер, время<\/b>, позывной<\/li><li><b>Раскодирование<\/b> — в <b>обратном порядке<\/b>, по тем же документам<\/li><li>Проверить, что <b>не осталось открытых<\/b> сведений о войсках<\/li><\/ol>", "cnt": 7, "m": "", "d": "<ul><li>Тренируйся на скорость: на зачёте обычно дают типовой текст.<\/li><li>Частые ошибки: перепутаны строка и столбец таблицы, ошибка в координатах, лишний открытый текст.<\/li><\/ul>", "src": ""}, {"n": "П2", "day": 5, "dayTitle": "Связь", "q": "Практика 2. Работа на радиостанциях с использованием документов кодированной связи.", "k": "<ol><li>Подготовить станцию, получить <b>радиоданные<\/b> (частоты, позывные) и <b>ДКС<\/b><\/li><li><b>Войти в связь<\/b> по правилам: вызов, ответ, оценка слышимости<\/li><li>Передавать <b>сигналы и радиограммы<\/b> только в <b>закодированном<\/b> виде<\/li><li><b>Подтверждать<\/b> приём: квитанция, повтор сигнала<\/li><li>Соблюдать <b>дисциплину связи<\/b>: кратко, позывными, без открытого текста<\/li><\/ol>", "cnt": 5, "m": "", "d": "<ul><li>Это связка вопросов 38 и 41 и практики 1: сначала закодировал, потом передал по правилам.<\/li><\/ul>", "src": ""}, {"n": "П3", "day": 5, "dayTitle": "Связь", "q": "Практика 3. Подготовка к работе радиостанции Р‑123М. Норматив по связи № 34.", "k": "<ol><li><b>Внешний осмотр<\/b>, проверка <b>комплектности<\/b><\/li><li><b>Подключить<\/b> антенну, кабели, блок питания, шлемофон (нагрудный переключатель)<\/li><li><b>Включить питание<\/b>, дать <b>прогреться<\/b>, проверить работу (шумы в телефонах)<\/li><li><b>Настроить ЗПЧ<\/b>: плавный поддиапазон → частота по шкале → <b>зафиксировать<\/b> → проверить переход на ЗПЧ<\/li><li><b>Настроить антенну<\/b> по максимуму индикатора<\/li><li><b>Проверить связь<\/b>, доложить о готовности<\/li><\/ol>", "cnt": 6, "m": "", "d": "<ul><li>Время на оценки норматива № 34 уточни у преподавателя и впиши сюда (в Anki: ⋮ → Редактировать).<\/li><li>Названия переключателей — как на занятии; отработай руками 5–⁠10 раз.<\/li><\/ul>", "src": ""}, {"n": "П4", "day": 5, "dayTitle": "Связь", "q": "Практика 4. Настройка частот радиостанции Р‑173. Норматив по связи № 35.", "k": "<ol><li><b>Включить<\/b> станцию, проверить работоспособность<\/li><li><b>Набрать частоту<\/b> наборными переключателями (МГц и кГц)<\/li><li><b>Записать<\/b> её в выбранную <b>ЗПЧ<\/b> (всего 10)<\/li><li>Повторить для остальных ЗПЧ по радиоданным<\/li><li><b>Проверить<\/b>: пройти по ЗПЧ, сверить частоты, проверить связь<\/li><\/ol>", "cnt": 5, "m": "", "d": "<ul><li>Время на оценки норматива № 35 уточни у преподавателя и впиши сюда.<\/li><li>Главное — без ошибки в цифре: одна неверная цифра = нет связи.<\/li><\/ul>", "src": ""}, {"n": "42", "day": 6, "dayTitle": "ОМП и защита", "q": "Виды ядерных взрывов. Поражающие факторы ядерных взрывов.", "k": "<ol><li><b>Виды<\/b>: <b>высотный<\/b> (выше 10 км), <b>воздушный<\/b>, <b>наземный<\/b>, <b>надводный<\/b>, <b>подземный<\/b>, <b>подводный<\/b><\/li><\/ol><div class=\"sub\">Поражающие факторы (≈ доля энергии)<\/div><ol><li><b>Ударная волна<\/b> — ~50%<\/li><li><b>Световое излучение<\/b> — ~35%<\/li><li><b>Проникающая радиация<\/b> — ~4–⁠5%<\/li><li><b>Радиоактивное заражение<\/b> — ~10%<\/li><li><b>Электромагнитный импульс<\/b> — ~1%<\/li><\/ol>", "cnt": 6, "m": "«УСПРЭ»: Ударная, Световое, Проникающая, Радиоактивное, ЭМИ", "d": "<ul><li>Воздушный: светящаяся область не касается земли; сильнее ударная волна и световое излучение, заражение местности слабое.<\/li><li>Наземный: сильное радиоактивное заражение по следу облака.<\/li><li>Ударная волна — резкое сжатие воздуха; защищают укрытия и складки местности.<\/li><li>Световое излучение — ожоги, ослепление, пожары; защищает любая непрозрачная преграда.<\/li><li>Проникающая радиация — гамма-излучение и нейтроны в первые секунды; лучевая болезнь.<\/li><li>ЭМИ — выводит из строя электронику и связь.<\/li><\/ul>", "src": ""}, {"n": "43", "day": 6, "dayTitle": "ОМП и защита", "q": "Химическое оружие. Классификация и характеристика отравляющих веществ.", "k": "<ol><li><b>Химическое оружие<\/b> — <b>отравляющие вещества (ОВ)<\/b> + <b>средства их применения<\/b> (снаряды, мины, авиабомбы, ракеты, выливные приборы)<\/li><\/ol><div class=\"sub\">По действию на организм<\/div><ol><li><b>Нервно-паралитические<\/b>: зарин, зоман, V-газы<\/li><li><b>Кожно-нарывные<\/b>: иприт, люизит<\/li><li><b>Общеядовитые<\/b>: синильная кислота, хлорциан<\/li><li><b>Удушающие<\/b>: фосген, дифосген<\/li><li><b>Психохимические<\/b>: Би-Зет<\/li><li><b>Раздражающие<\/b>: Си-Эс, Си-Ар, адамсит<\/li><\/ol><div class=\"sub\">Другие признаки<\/div><ol><li><b>По назначению<\/b>: смертельные, временно выводящие из строя, раздражающие; <b>по быстроте<\/b>: быстро- и медленнодействующие; <b>по стойкости<\/b>: стойкие и нестойкие<\/li><\/ol>", "cnt": 8, "m": "«Нам Копать Окопы Утром, Пока Рано»: Нервно-паралит., Кожно-нарывные, Общеядовитые, Удушающие, Психохимические, Раздражающие", "d": "<ul><li>Нервно-паралитические — самые токсичные: сужение зрачков, слюнотечение, затруднённое дыхание, судороги.<\/li><li>Кожно-нарывные — поражают кожу, глаза, органы дыхания; есть скрытый период.<\/li><li>Общеядовитые — нарушают усвоение кислорода тканями, действуют очень быстро.<\/li><li>Удушающие — поражают лёгкие (отёк), скрытый период несколько часов.<\/li><li>Стойкие ОВ опасны часами и сутками (V-газы, иприт), нестойкие — минутами (синильная кислота, фосген).<\/li><li>Защита: противогаз, ОЗК, своевременное оповещение, антидот из аптечки.<\/li><\/ul>", "src": ""}, {"n": "44", "day": 6, "dayTitle": "ОМП и защита", "q": "Биологическое оружие. Виды, поражающие свойства и средства применения биологического оружия.", "k": "<ol><li><b>Биологическое оружие<\/b> — <b>биологические средства<\/b> (болезнетворные микроорганизмы и токсины) + <b>средства доставки<\/b><\/li><li><b>Виды<\/b>: <b>бактерии<\/b> (чума, сибирская язва, туляремия, холера), <b>вирусы<\/b> (натуральная оспа, жёлтая лихорадка), <b>риккетсии<\/b> (сыпной тиф, Ку-лихорадка), <b>грибки<\/b>, <b>токсины<\/b> (ботулотоксин)<\/li><li><b>Поражающие свойства<\/b>: действие в <b>малых дозах<\/b>, <b>заразность<\/b> (эпидемии), <b>инкубационный период<\/b>, <b>трудность обнаружения<\/b>, <b>длительность действия<\/b>, проникновение в негерметичные помещения, <b>психологическое<\/b> воздействие<\/li><li><b>Средства применения<\/b>: <b>авиабомбы и кассеты<\/b>, <b>ракеты<\/b>, <b>распылители и аэрозольные генераторы<\/b>, <b>заражённые переносчики<\/b> (насекомые, клещи, грызуны), диверсионные способы<\/li><\/ol>", "cnt": 4, "m": "Виды «БВРГТ»: Бактерии, Вирусы, Риккетсии, Грибки, Токсины", "d": "<ul><li>Основной способ — аэрозольный (заражение приземного слоя воздуха).<\/li><li>Признаки применения: глухие разрывы боеприпасов, полосы дыма или тумана, необычное скопление насекомых и клещей, массовые заболевания людей и животных.<\/li><li>Защита: противогаз и средства защиты кожи, прививки, экстренная профилактика, обсервация и карантин.<\/li><\/ul>", "src": ""}, {"n": "45", "day": 6, "dayTitle": "ОМП и защита", "q": "Зажигательное оружие. Зажигательные вещества и смеси, средства их боевого применения.", "k": "<ol><li><b>Зажигательное оружие<\/b> — <b>зажигательные вещества<\/b> + <b>средства их применения<\/b><\/li><\/ol><div class=\"sub\">Вещества и смеси<\/div><ol><li><b>Напалмы<\/b> — на основе нефтепродуктов (загущённые и незагущённые)<\/li><li><b>Пирогели<\/b> — металлизированные смеси<\/li><li><b>Термит<\/b> и термитные составы<\/li><li><b>Белый фосфор<\/b> (и пластифицированный)<\/li><li><b>Самовоспламеняющиеся<\/b> смеси, <b>электрон<\/b> (сплав магния)<\/li><\/ol><div class=\"sub\">Средства применения<\/div><ol><li><b>Зажигательные авиабомбы и баки<\/b>, кассеты, <b>огнемёты<\/b> (ранцевые, реактивные пехотные), <b>снаряды, мины, ракеты, гранаты<\/b>, огневые фугасы<\/li><\/ol>", "cnt": 7, "m": "Н-П-Т-Ф: Напалм, Пирогель, Термит, Фосфор", "d": "<ul><li>Поражение: ожоги, пожары, отравление продуктами горения, сильное психологическое воздействие.<\/li><li>Температура горения: напалм ~1000–⁠1200 °C, термит ~3000 °C.<\/li><li>Фосфор самовоспламеняется на воздухе; на коже гасят водой или мокрой тканью.<\/li><li>Защита: укрытия с перекрытием, ОЗК, плащ-накидка, противопожарные меры, быстро сбросить горящую смесь.<\/li><\/ul>", "src": ""}, {"n": "П5", "day": 6, "dayTitle": "ОМП и защита", "q": "Практика 5. Надевание противогаза. Норматив по ЗОМП № 1.", "k": "<ol><li>По команде «<b>Газы!<\/b>»: <b>задержать дыхание<\/b>, <b>закрыть глаза<\/b><\/li><li>Снять головной убор, вынуть противогаз из сумки<\/li><li>Взять шлем-маску за утолщённые края, <b>приложить к подбородку<\/b>, резко <b>вверх и назад<\/b> натянуть на голову<\/li><li>Без складок, очковый узел — против глаз<\/li><li><b>Полный выдох<\/b>, открыть глаза, возобновить дыхание<\/li><li>Надеть головной убор, закрепить сумку<\/li><li><b>Время<\/b>: отлично <b>7 с<\/b>, хорошо <b>8 с<\/b>, удовл. <b>10 с<\/b> (сверь с преподавателем)<\/li><\/ol>", "cnt": 7, "m": "", "d": "<ul><li>Снижают оценку: не закрыты глаза и не задержано дыхание, не сделан выдох после надевания.<\/li><li>«Неуд»: шлем-маска с перекосом или неплотно прилегает, перекручена соединительная трубка.<\/li><li>Тренировка: 10–⁠15 раз подряд с секундомером на телефоне.<\/li><\/ul>", "src": ""}, {"n": "П6", "day": 6, "dayTitle": "ОМП и защита", "q": "Практика 6. Надевание ОЗК. Нормативы по ЗОМП № 4А, 4Б.", "k": "<ol><li><b>4А — «Плащ в рукава. Газы!»<\/b>: чулки → противогаз → перчатки → плащ в рукава<\/li><li>Время 4А: отлично <b>3 мин<\/b>, хорошо <b>3 мин 20 с<\/b>, удовл. <b>4 мин<\/b><\/li><li><b>4Б — «Защитный костюм надеть. Газы!»<\/b>: чулки → плащ в виде комбинезона → противогаз → подшлемник → перчатки<\/li><li>Время 4Б: отлично <b>4 мин 35 с<\/b>, хорошо <b>5 мин<\/b>, удовл. <b>6 мин<\/b><\/li><li><b>«Неуд»<\/b>: не застёгнуто <b>более двух шпеньков<\/b> или грубые ошибки с противогазом<\/li><\/ol>", "cnt": 5, "m": "", "d": "<ul><li>Время — от подачи команды до полного надевания.<\/li><li>Оценку снижают на балл: не полностью выполнены отдельные операции, ошибки при надевании противогаза.<\/li><li>Больше всего времени теряют на чулках и шпеньках — отработай их отдельно.<\/li><\/ul>", "src": ""}, {"n": "П7", "day": 6, "dayTitle": "ОМП и защита", "q": "Практика 7. Подготовка дозиметрических приборов к работе и проверка их работоспособности. Норматив по ЗОМП № 10.", "k": "<ol><li><b>Внешний осмотр<\/b>, проверка <b>комплектности<\/b><\/li><li>Установить <b>источники питания<\/b>, соблюдая полярность<\/li><li><b>Включить<\/b>, проверить <b>режим питания<\/b> (стрелка в режимном секторе или индикация)<\/li><li>Проверить работоспособность по <b>контрольному источнику<\/b> (ДП‑5В: экран зонда в положение «К», щелчки в телефонах, отклонение стрелки)<\/li><li>Установить нужный <b>поддиапазон<\/b>, доложить о готовности<\/li><li><b>Время<\/b> — уточни у преподавателя<\/li><\/ol>", "cnt": 6, "m": "", "d": "<ul><li>Прибор в вашем ВУЦ может быть другим (ДП‑5В, ИМД‑1 и др.): порядок общий, названия переключателей — по инструкции.<\/li><li>Дозиметрические приборы измеряют мощность дозы (уровень радиации) и заражённость поверхностей.<\/li><\/ul>", "src": ""}, {"n": "П8", "day": 6, "dayTitle": "ОМП и защита", "q": "Практика 8. Подготовка приборов химической разведки к работе и определение ОВ противника. Норматив по ЗОМП № 11.", "k": "<ol><li><b>Прибор ВПХР<\/b>: ручной насос, <b>индикаторные трубки<\/b>, насадка, защитные колпачки, грелка<\/li><li><b>Трубки<\/b>: <b>красное кольцо и точка<\/b> — нервно-паралитические (зарин, зоман, V-газы); <b>три зелёных кольца<\/b> — фосген, синильная кислота, хлорциан; <b>одно жёлтое<\/b> — иприт<\/li><li><b>Порядок<\/b>: подготовить прибор → вскрыть трубку (для нервно-паралитических — <b>опытную и контрольную<\/b>) → разбить ампулы → вставить в насос и <b>прокачать воздух<\/b> → <b>сравнить окраску<\/b> с контрольной трубкой или эталоном<\/li><li>Сначала определяют <b>опасные концентрации<\/b> нервно-паралитических ОВ, затем остальные<\/li><li><b>Время<\/b> — уточни у преподавателя<\/li><\/ol>", "cnt": 5, "m": "", "d": "<ul><li>Ориентировочно число качаний: красная — 5–⁠6, три зелёные — 10–⁠15, жёлтая — 60. Сверь с инструкцией.<\/li><li>Работают в противогазе; концы трубок надрезают ножом на головке насоса.<\/li><li>Для нервно-паралитических: если опытная трубка осталась красной, а контрольная пожелтела — ОВ есть.<\/li><\/ul>", "src": ""}]}</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("data").textContent);
  var CARDS = DATA.cards, DAYS = DATA.days;
  var BY = {}; CARDS.forEach(function (c) { BY[c.n] = c; });
  var KEY = "taktika-vuc-progress-v1";
  var MIN = 60000, AHEAD = 20 * MIN, MAXIVL = 4;
  var app = document.getElementById("app");

  var state = { cards: {} };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var p = JSON.parse(raw); if (p && p.cards) state = p; }
  } catch (e) {}

  // ── расписание повторений ──
  function dayAt(d) {
    var x = new Date();
    if (x.getHours() < 4) x.setDate(x.getDate() - 1);
    x.setHours(4, 0, 0, 0);
    x.setDate(x.getDate() + d);
    return x.getTime();
  }
  function next(s, g) {
    var now = Date.now();
    var st = s ? JSON.parse(JSON.stringify(s)) : { phase: "new", ivl: 0, reps: 0, lapses: 0, step: 0 };
    st.reps += 1; st.t = now;
    if (st.phase === "review") {
      if (g === 0) { st.lapses += 1; st.phase = "learn"; st.step = 0; st.due = now + 10 * MIN; }
      else {
        var f = [0, 1.2, 2.2, 3][g];
        var ivl = Math.round(st.ivl * f);
        if (g > 1) ivl = Math.max(ivl, st.ivl + 1);
        st.ivl = Math.min(MAXIVL, Math.max(1, ivl));
        st.due = dayAt(st.ivl);
      }
    } else {
      if (g === 0) { st.phase = "learn"; st.step = 0; st.due = now + MIN; }
      else if (g === 1) { st.phase = "learn"; st.due = now + 6 * MIN; }
      else if (g === 2) {
        if (st.phase === "new" || (st.step || 0) < 1) { st.phase = "learn"; st.step = 1; st.due = now + 10 * MIN; }
        else { st.phase = "review"; st.ivl = 1; st.due = dayAt(1); }
      } else { st.phase = "review"; st.ivl = st.lapses ? 2 : 3; st.due = dayAt(st.ivl); }
    }
    return st;
  }
  function label(st) {
    if (st.phase === "review") return st.ivl + " д";
    var m = Math.max(1, Math.round((st.due - Date.now()) / MIN));
    return m + " мин";
  }
  function phaseOf(n) { var s = state.cards[n]; return s ? s.phase : "new"; }
  function isDue(n) { var s = state.cards[n]; return !!s && s.due <= Date.now(); }

  // ── сохранение ──
  var dbRef = null, saving = false, dirty = false, saveTimer = null, retried = false;
  var store = "local";
  function persistLocal() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function scheduleSave() {
    persistLocal();
    if (!dbRef) return;
    dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700);
  }
  function flush() {
    if (saving || !dirty || !dbRef) return;
    saving = true; dirty = false;
    dbRef.set({ v: 1, cards: state.cards, updated: Date.now() }).then(function () {
      retried = false; saving = false; if (dirty) flush();
    }, function (e) {
      saving = false;
      if (e && e.code === "unavailable" && !retried) { retried = true; dirty = true; setTimeout(flush, 1200 + Math.random() * 1200); }
      else { dbRef = null; store = "local"; if (view === "home") render(); }
    });
  }
  function mergeCards(remote) {
    var changed = false;
    Object.keys(remote || {}).forEach(function (n) {
      if (!BY[n]) return;
      var r = remote[n], l = state.cards[n];
      if (!l || (r && r.t > (l.t || 0))) { state.cards[n] = r; changed = true; }
    });
    return changed;
  }
  // ── состояние экрана ──
  var view = "home", S = null, confirmReset = false;

  function dayStats(d) {
    var list = CARDS.filter(function (c) { return c.day === d; });
    var st = { total: list.length, nNew: 0, due: 0, ok: 0, lrn: 0 };
    list.forEach(function (c) {
      var ph = phaseOf(c.n);
      if (ph === "new") st.nNew++; else if (ph === "review") st.ok++; else st.lrn++;
      if (isDue(c.n)) st.due++;
    });
    return st;
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (ch) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]; }); }

  function renderHome() {
    var total = CARDS.length, ok = 0, lrn = 0, dueAll = 0;
    CARDS.forEach(function (c) {
      var ph = phaseOf(c.n);
      if (ph === "review") ok++; else if (ph === "learn") lrn++;
      if (isDue(c.n)) dueAll++;
    });
    var nowDay = 0;
    for (var i = 0; i < DAYS.length; i++) { if (dayStats(DAYS[i].n).nNew > 0) { nowDay = DAYS[i].n; break; } }

    var main;
    if (dueAll > 0) main = '<button class="btn btn-main" id="b-review" data-act="review">Повторить сейчас · ' + dueAll + '</button>';
    else if (nowDay) main = '<button class="btn btn-main" data-act="learn" data-day="' + nowDay + '">Учить день ' + nowDay + '</button>';
    else main = '<button class="btn btn-main" data-act="cram" data-day="0">Прогон всех вопросов</button>';

    var h = '<header class="hero">' +
      '<div class="eyebrow">Тактическая подготовка · вопросы к зачёту</div>' +
      '<h1>Зачёт по тактике</h1>' +
      '<div class="stat"><b>' + ok + '</b> выучено из ' + total + (lrn ? ' · в работе <b>' + lrn + '</b>' : '') + '</div>' +
      '<div class="bar" role="img" aria-label="Выучено ' + ok + ' из ' + total + '"><i class="ok" style="width:' + (ok / total * 100) + '%"></i><i class="lrn" style="width:' + (lrn / total * 100) + '%"></i></div>' +
      '<div class="legend"><span><i class="l0"></i>не начато</span><span><i class="l1"></i>учу</span><span><i class="l2"></i>выучено</span></div>' +
      main + '</header>';

    h += '<details class="howto"><summary>Как заниматься</summary><ol>' +
      '<li>Каждый день сначала нажимай «Повторить сейчас», потом учи новый день по плану.</li>' +
      '<li>Читай вопрос и отвечай вслух по памяти. Подсказка говорит, сколько пунктов вспомнить.</li>' +
      '<li>Открой каркас и оцени честно: упустил хоть один ключевой пункт — «Снова».</li>' +
      '<li>«Снова» и «Трудно» вернут карточку через пару минут, «Хорошо» — позже, «Легко» — через несколько дней.</li>' +
      '<li>Квадратик с номером открывает вопрос с ответом — удобно подсмотреть перед зачётом.</li>' +
      '</ol></details>';

    h += '<h2>План на неделю</h2><div class="days">';
    DAYS.forEach(function (d) {
      var st = dayStats(d.n);
      var todo = st.nNew + st.due;
      var cells = CARDS.filter(function (c) { return c.day === d.n; }).map(function (c) {
        var ph = phaseOf(c.n), cls = ph === "review" ? "s2" : (ph === "learn" ? "s1" : "");
        if (isDue(c.n)) cls += " due";
        return '<button class="cell ' + cls + '" data-act="view" data-n="' + esc(c.n) + '" aria-label="Вопрос ' + esc(c.n) + '">' + esc(c.n) + '</button>';
      }).join("");
      h += '<section class="day' + (d.n === nowDay ? " now" : "") + '">' +
        '<div class="dayhead"><div class="dayname">День ' + d.n + ' · ' + esc(d.title) + '<small>' + esc(d.sub) + '</small></div>' +
        (d.n === nowDay ? '<span class="tag">сейчас по плану</span>' : (st.ok === st.total ? '<span class="tag">выучено</span>' : '')) + '</div>' +
        '<div class="cells">' + cells + '</div>' +
        '<div class="dayfoot"><div class="counts">новых <b>' + st.nNew + '</b> · к повторению <b>' + st.due + '</b></div>' +
        '<div class="actions"><button class="btn btn-ghost btn-small" data-act="cram" data-day="' + d.n + '">Прогон</button>' +
        '<button class="btn btn-main btn-small" style="width:auto" data-act="learn" data-day="' + d.n + '"' + (todo ? '' : ' disabled') + '>' + (todo ? 'Учить · ' + todo : 'На сегодня всё') + '</button></div></div>' +
        '</section>';
    });
    h += '<section class="day"><div class="dayhead"><div class="dayname">День 7 · Генеральный прогон<small>все ' + CARDS.length + ' карточки вперемешку, без влияния на расписание</small></div></div>' +
      '<div class="dayfoot"><div class="counts">Отметь «Не вспомнил» — карточка вернётся в конце</div>' +
      '<div class="actions"><button class="btn btn-main btn-small" style="width:auto" data-act="cram" data-day="0">Прогон всех</button></div></div></section>';
    h += '</div>';

    h += '<div class="foot"><div>' + (store === "cloud"
      ? 'Прогресс сохраняется в твоём аккаунте Claude — можно продолжать с любого устройства.'
      : 'Прогресс сохраняется в этом браузере. Открывай страницу в одном и том же браузере.') + '</div>' +
      '<div>Каркасы ответов сжаты по стандартным пособиям ВУЦ — цифры и формулировки сверяйте с конспектом.</div>' +
      (confirmReset
        ? '<div class="confirm"><span>Стереть весь прогресс?</span><button class="btn btn-ghost btn-small danger" data-act="reset-yes">Да, стереть</button><button class="btn btn-ghost btn-small" data-act="reset-no">Отмена</button></div>'
        : '<div><button class="btn btn-ghost btn-small" data-act="reset">Сбросить прогресс</button></div>') +
      '</div>';
    app.innerHTML = h;
  }

  // ── сессии ──
  function startLearn(day) {
    var now = Date.now(), lrn = [], rev = [], nw = [], pend = [];
    CARDS.forEach(function (c) {
      if (day && c.day !== day) return;
      var s = state.cards[c.n];
      if (!s) { if (day) nw.push(c.n); return; }
      if (s.due <= now) (s.phase === "learn" ? lrn : rev).push(c.n);
      else if (s.phase === "learn" && s.due <= now + AHEAD) pend.push(c.n);
    });
    S = { mode: day ? "learn" : "review", day: day, queue: lrn.concat(rev, nw), pend: pend, done: 0, last: null, revealed: false };
    S.total = S.queue.length + S.pend.length;
    S.cur = pickNext(); view = "study"; render(true);
  }
  function startCram(day) {
    var list = CARDS.filter(function (c) { return !day || c.day === day; }).map(function (c) { return c.n; });
    if (!day) for (var i = list.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = list[i]; list[i] = list[j]; list[j] = t; }
    S = { mode: "cram", day: day, queue: list, pend: [], done: 0, again: 0, last: null, revealed: false, total: list.length };
    S.cur = pickNext(); view = "study"; render(true);
  }
  function startView(n) {
    var order = CARDS.map(function (c) { return c.n; });
    S = { mode: "view", list: order, idx: order.indexOf(n), revealed: true };
    S.cur = n; view = "study"; render(true);
  }
  function pickNext() {
    var now = Date.now();
    S.pend.sort(function (a, b) { return state.cards[a].due - state.cards[b].due; });
    var i = S.pend.findIndex(function (n) { return state.cards[n].due <= now && n !== S.last; });
    if (i >= 0) return S.pend.splice(i, 1)[0];
    if (S.queue.length) { var j = S.queue.findIndex(function (n) { return n !== S.last; }); if (j < 0) j = 0; return S.queue.splice(j, 1)[0]; }
    if (S.pend.length) { var k = S.pend.findIndex(function (n) { return n !== S.last; }); if (k < 0) k = 0; return S.pend.splice(k, 1)[0]; }
    return null;
  }
  function grade(g) {
    if (!S || !S.cur || !S.revealed) return;
    var n = S.cur;
    if (S.mode === "cram") {
      if (g === 0) { S.queue.splice(Math.min(4, S.queue.length), 0, n); S.again++; } else S.done++;
    } else {
      var ns = next(state.cards[n], g);
      state.cards[n] = ns; scheduleSave();
      if (ns.phase !== "review" && ns.due <= Date.now() + AHEAD) S.pend.push(n); else S.done++;
    }
    S.last = n; S.cur = pickNext(); S.revealed = false; render(true);
  }

  function cardHTML(c, revealed) {
    var h = '<article class="card">' +
      '<div class="chiprow"><span class="num">№ ' + esc(c.n) + '</span><span class="blk">День ' + c.day + ' · ' + esc(c.dayTitle) + '</span></div>' +
      '<h1 class="q">' + c.q + '</h1>';
    if (!revealed) h += '<div class="hint">Ответь вслух по памяти · пунктов: <b>' + c.cnt + '</b></div>';
    else {
      h += '<div class="answer"><div class="label">Каркас ответа · ' + c.cnt + ' п.</div><div class="k">' + c.k + '</div>' +
        (c.m ? '<div class="mn"><span>Запомнить:</span> ' + c.m + '</div>' : '') +
        (c.d ? '<details class="more"><summary>Подробнее</summary>' + c.d + '</details>' : '') +
        (c.src ? '<div class="src">Сверено с лекцией: ' + c.src + '</div>' : '') + '</div>';
    }
    return h + '</article>';
  }

  function renderStudy() {
    var modeName = S.mode === "cram" ? (S.day ? "Прогон · день " + S.day : "Прогон всех")
      : S.mode === "review" ? "Повторение" : S.mode === "view" ? "Просмотр" : "Учить · день " + S.day;
    if (S.mode !== "view" && !S.cur) { renderDone(); return; }
    var c = BY[S.cur];
    var left = S.mode === "view" ? 0 : S.queue.length + S.pend.length + 1;
    var pct = S.mode === "view" ? ((S.idx + 1) / S.list.length * 100) : (S.total ? (S.done / (S.done + left)) * 100 : 0);
    var right = S.mode === "view" ? '<b>' + (S.idx + 1) + '</b> из ' + S.list.length : 'осталось <b>' + left + '</b>';
    var h = '<div class="topbar"><div class="toprow"><button class="back" data-act="home">← План</button>' +
      '<div class="mode">' + modeName + ' · ' + right + '</div></div>' +
      '<div class="sbar"><i style="width:' + pct.toFixed(1) + '%"></i></div></div>' +
      cardHTML(c, S.revealed) + '<div class="spacer"></div>';

    var dock;
    if (S.mode === "view") {
      dock = '<div class="nav3"><button class="btn btn-ghost" data-act="prev"' + (S.idx > 0 ? '' : ' disabled') + ' aria-label="Предыдущий вопрос">‹ Пред.</button>' +
        '<button class="btn btn-main" data-act="home">К плану</button>' +
        '<button class="btn btn-ghost" data-act="next"' + (S.idx < S.list.length - 1 ? '' : ' disabled') + ' aria-label="Следующий вопрос">След. ›</button></div>';
    } else if (!S.revealed) {
      dock = '<button class="btn btn-main" data-act="reveal" style="min-height:58px">Показать ответ</button>';
    } else if (S.mode === "cram") {
      dock = '<div class="grades two"><button class="g g0" data-act="g" data-g="0">Не вспомнил<small>вернётся</small></button>' +
        '<button class="g g2" data-act="g" data-g="2">Вспомнил<small>дальше</small></button></div>';
    } else {
      var s = state.cards[S.cur];
      var names = ["Снова", "Трудно", "Хорошо", "Легко"];
      dock = '<div class="grades">' + names.map(function (nm, g) {
        return '<button class="g g' + g + '" data-act="g" data-g="' + g + '">' + nm + '<small>' + label(next(s, g)) + '</small></button>';
      }).join("") + '</div>';
    }
    h += '<div class="dock"><div class="dock-in">' + dock + '</div></div>';
    app.innerHTML = h;
  }

  function renderDone() {
    var nextDay = 0;
    for (var i = 0; i < DAYS.length; i++) { if (dayStats(DAYS[i].n).nNew > 0) { nextDay = DAYS[i].n; break; } }
    var msg = S.mode === "cram"
      ? "Прогон закончен: " + S.done + " карточек" + (S.again ? ", повторов по «Не вспомнил» — " + S.again : "") + "."
      : "Пройдено карточек: " + S.done + ". Следующие повторения появятся по расписанию.";
    app.innerHTML = '<div class="done"><div class="eyebrow">Готово</div><h1>На сегодня этот блок закрыт</h1><p>' + esc(msg) + '</p>' +
      (nextDay && S.mode !== "cram" && S.day !== nextDay ? '<p>Дальше по плану — день ' + nextDay + ' · ' + esc(DAYS[nextDay - 1].title) + '.</p>' : '') +
      '<button class="btn btn-main" data-act="home">К плану</button></div>';
  }

  function render(top) {
    if (view === "home") renderHome(); else renderStudy();
    if (top) window.scrollTo(0, 0);
  }

  app.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-act]");
    if (!b || b.disabled) return;
    var act = b.getAttribute("data-act");
    if (act === "review") startLearn(0);
    else if (act === "learn") startLearn(+b.getAttribute("data-day"));
    else if (act === "cram") startCram(+b.getAttribute("data-day"));
    else if (act === "view") startView(b.getAttribute("data-n"));
    else if (act === "home") { view = "home"; S = null; render(true); }
    else if (act === "reveal") { S.revealed = true; render(false); }
    else if (act === "g") grade(+b.getAttribute("data-g"));
    else if (act === "prev" || act === "next") {
      S.idx = Math.max(0, Math.min(S.list.length - 1, S.idx + (act === "next" ? 1 : -1)));
      S.cur = S.list[S.idx]; render(true);
    }
    else if (act === "reset") { confirmReset = true; render(false); }
    else if (act === "reset-no") { confirmReset = false; render(false); }
    else if (act === "reset-yes") { state = { cards: {} }; confirmReset = false; scheduleSave(); render(true); }
  });
  document.addEventListener("keydown", function (ev) {
    if (view !== "study" || !S) return;
    if ((ev.key === " " || ev.key === "Enter") && S.mode !== "view" && S.cur && !S.revealed) { ev.preventDefault(); S.revealed = true; render(false); }
    else if (S.revealed && S.mode !== "view" && /^[1-4]$/.test(ev.key)) {
      var g = +ev.key - 1; if (S.mode === "cram") g = g < 2 ? 0 : 2; grade(g);
    }
    else if (S.mode === "view" && (ev.key === "ArrowRight" || ev.key === "ArrowLeft")) {
      S.idx = Math.max(0, Math.min(S.list.length - 1, S.idx + (ev.key === "ArrowRight" ? 1 : -1)));
      S.cur = S.list[S.idx]; render(true);
    }
  });

  render(false);
})();
</script>

</body>
</html>
