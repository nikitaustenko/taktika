<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<style>
/* Layout: one narrow column like a field notebook; plan days as map-legend strips; study card with a fixed thumb bar */
:root {
  --paper: #eef1e8;
  --surface: #fafbf6;
  --ink: #1b201b;
  --muted: #586055;
  --line: #d2d8c7;
  --grid: rgba(56, 92, 60, .11);
  --contour: #8f501d;
  --contour-soft: #f0e0cf;
  --forest: #2a673b;
  --forest-soft: #d9e9d8;
  --hydro: #235d8c;
  --hydro-soft: #dbe7f1;
  --red: #b3322a;
  --red-soft: #f5dcd8;
  --btn: #1b201b;
  --btn-ink: #f3f5ee;
  --f-display: "PT Sans Narrow", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "PT Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono: "PT Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141814; --surface: #1c211c; --ink: #e6e9de; --muted: #a0a898; --line: #343c33;
    --grid: rgba(150, 190, 150, .07);
    --contour: #d9a06a; --contour-soft: #3a2b1d; --forest: #7cc490; --forest-soft: #1f3524;
    --hydro: #7fb5e2; --hydro-soft: #1b2c3b; --red: #f07f73; --red-soft: #3d201d;
    --btn: #e6e9de; --btn-ink: #141814; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141814; --surface: #1c211c; --ink: #e6e9de; --muted: #a0a898; --line: #343c33;
  --grid: rgba(150, 190, 150, .07);
  --contour: #d9a06a; --contour-soft: #3a2b1d; --forest: #7cc490; --forest-soft: #1f3524;
  --hydro: #7fb5e2; --hydro-soft: #1b2c3b; --red: #f07f73; --red-soft: #3d201d;
  --btn: #e6e9de; --btn-ink: #141814; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 17px; line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--paper);
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--hydro); outline-offset: 2px; border-radius: 6px; }
.wrap {
  max-width: 640px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}

/* ── план ── */
.hero {
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0;
  padding: 22px max(16px, env(safe-area-inset-left, 0px)) 20px;
  background-color: var(--surface);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 30px 30px;
  border-bottom: 1px solid var(--line);
  display: grid; gap: 12px;
}
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; color: var(--contour); text-transform: uppercase; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 40px; line-height: 1; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.stat { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 15px; color: var(--muted); }
.stat b { font-family: var(--f-mono); font-weight: 400; font-size: 22px; color: var(--ink); font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .lrn { background: var(--contour); }
.bar .ok { background: var(--forest); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; border: 1px solid var(--line); }
.legend .l0 { background: var(--surface); }
.legend .l1 { background: var(--contour-soft); border-color: var(--contour); }
.legend .l2 { background: var(--forest-soft); border-color: var(--forest); }

.btn {
  appearance: none; border: 1px solid transparent; border-radius: 10px; cursor: pointer;
  min-height: 48px; padding: 10px 16px; font-weight: 700; font-size: 17px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
}
.btn-main { background: var(--btn); color: var(--btn-ink); width: 100%; }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn-small { min-height: 40px; padding: 6px 12px; font-size: 15px; }
.btn[disabled] { opacity: .55; cursor: default; }

.howto { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 2px 14px; margin-top: 16px; }
.howto summary { cursor: pointer; font-weight: 700; padding: 10px 0; color: var(--hydro); }
.howto ol { margin: 0 0 12px; padding-left: 1.3em; display: grid; gap: 6px; font-size: 15px; }

h2 { font-family: var(--f-display); font-size: 24px; margin: 26px 0 10px; letter-spacing: .01em; }
.days { display: grid; gap: 10px; }
.day {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px; display: grid; gap: 10px; min-width: 0;
}
.day.now { border-color: var(--contour); box-shadow: inset 4px 0 0 var(--contour); }
.dayhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.dayname { font-family: var(--f-display); font-size: 21px; line-height: 1.1; }
.dayname small { display: block; font-family: var(--f-body); font-size: 14px; color: var(--muted); font-weight: 400; margin-top: 3px; }
.tag { font-family: var(--f-mono); font-size: 12px; color: var(--contour); border: 1px solid var(--contour); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.cells { display: flex; flex-wrap: wrap; gap: 5px; }
.cell {
  appearance: none; cursor: pointer; width: 38px; height: 32px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--paper);
  font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums;
}
.cell.s1 { background: var(--contour-soft); border-color: var(--contour); color: var(--contour); }
.cell.s2 { background: var(--forest-soft); border-color: var(--forest); color: var(--forest); }
.cell.due { box-shadow: 0 0 0 2px var(--hydro); }
.dayfoot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.counts { font-size: 14px; color: var(--muted); }
.counts b { font-family: var(--f-mono); font-weight: 400; color: var(--ink); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.foot { margin-top: 26px; display: grid; gap: 10px; font-size: 14px; color: var(--muted); }
.confirm { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.danger { color: var(--red); border-color: var(--red); }

/* ── карточка ── */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--paper); border-bottom: 1px solid var(--line);
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 6px;
}
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.back { appearance: none; background: none; border: none; cursor: pointer; padding: 8px 4px; font-weight: 700; color: var(--hydro); font-size: 16px; }
.mode { font-size: 14px; color: var(--muted); text-align: right; min-width: 0; }
.mode b { font-family: var(--f-mono); font-weight: 400; color: var(--ink); }
.sbar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.sbar i { display: block; height: 100%; background: var(--forest); transition: width .25s; }

.card { padding: 18px 0 0; display: grid; gap: 10px; min-width: 0; }
.chiprow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.num { font-family: var(--f-mono); font-size: 14px; color: var(--contour); background: var(--contour-soft); border-radius: 6px; padding: 2px 9px; }
.blk { font-size: 13px; color: var(--muted); }
.q { font-family: var(--f-display); font-size: 27px; line-height: 1.16; margin: 0; text-wrap: balance; }
.hint { font-size: 15px; color: var(--muted); }
.hint b { font-family: var(--f-mono); font-weight: 400; color: var(--ink); }
.answer { border-top: 1px dashed var(--line); padding-top: 12px; margin-top: 4px; display: grid; gap: 4px; min-width: 0; }
.label { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--forest); }
.k ol { margin: 4px 0 6px; padding-left: 1.45em; display: grid; gap: 7px; }
.k li { padding-left: 2px; }
.k li::marker { font-family: var(--f-mono); color: var(--forest); }
.k b { color: var(--forest); }
.k .sub { font-family: var(--f-display); font-size: 17px; letter-spacing: .02em; color: var(--ink); margin-top: 10px; padding-top: 8px; border-top: 1px dotted var(--line); }
.k .sub:first-child { margin-top: 2px; padding-top: 0; border-top: none; }
.mn { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--contour-soft); font-size: 16px; }
.mn span { font-weight: 700; color: var(--contour); }
.more { margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 0 12px; font-size: 16px; }
.more summary { cursor: pointer; padding: 11px 0; font-weight: 700; color: var(--hydro); }
.more ul { margin: 0 0 12px; padding-left: 1.2em; display: grid; gap: 7px; }

.spacer { height: 150px; }
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.dock-in { max-width: 640px; margin: 0 auto; display: grid; gap: 8px; }
.grades { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.grades.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g {
  appearance: none; cursor: pointer; border-radius: 10px; border: 1px solid; min-height: 58px; padding: 6px 4px;
  display: grid; place-items: center; gap: 1px; font-weight: 700; font-size: 15px;
}
.g small { font-family: var(--f-mono); font-weight: 400; font-size: 12px; opacity: .85; }
.g0 { background: var(--red-soft); border-color: var(--red); color: var(--red); }
.g1 { background: var(--contour-soft); border-color: var(--contour); color: var(--contour); }
.g2 { background: var(--forest-soft); border-color: var(--forest); color: var(--forest); }
.g3 { background: var(--hydro-soft); border-color: var(--hydro); color: var(--hydro); }
.nav3 { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 8px; }

.done { padding: 40px 0; display: grid; gap: 14px; }
.done h1 { font-size: 36px; }
.done p { margin: 0; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .sbar i { transition: none; } }
</style>

</head>
