<script type="application/json" id="data">{"days": [{"n": 1, "title": "Общая тактика", "sub": "вопросы 1–12"}, {"n": 2, "title": "Передвижение, оборона, наступление", "sub": "вопросы 13–21"}, {"n": 3, "title": "Управление, инженерка, местность", "sub": "вопросы 22–29"}, {"n": 4, "title": "Топография и документы", "sub": "вопросы 30–35"}, {"n": 5, "title": "Связь", "sub": "вопросы 36–41 и практика 1–4"}, {"n": 6, "title": "ОМП и защита", "sub": "вопросы 42–45 и практика 5–8"}], "cards": [{"n": "1", "day": 1, "dayTitle": "Общая тактика", "q": "Содержание основных тактических понятий.", "k": "<ol><li><b>Бой<\/b> — основная тактическая форма действий: согласованные по цели, задачам, месту и времени <b>удары, огонь и манёвр<\/b><\/li><li><b>Удар<\/b> — одновременное мощное поражение противника (огневой, ракетный, авиационный, удар войск)<\/li><li><b>Огонь<\/b> — поражение противника стрельбой из оружия<\/li><li><b>Манёвр<\/b> — организованное перемещение подразделений и огня для выгодного положения: <b>охват, обход, отход<\/b>, манёвр огнём<\/li><li><b>Боевая задача<\/b>, <b>боевой порядок<\/b>, <b>боевые возможности<\/b><\/li><li>Построение: <b>фронт, фланги, тыл, интервал, дистанция, глубина<\/b><\/li><\/ol>", "cnt": 6, "m": "Бой = Удар + Огонь + Манёвр", "d": "<ul><li>Бой ведётся для уничтожения (разгрома) противника, отражения его ударов и выполнения других задач в ограниченном районе в течение короткого времени.<\/li><li>Боевая задача — то, что подразделение должно выполнить к установленному сроку (в наступлении: ближайшая, последующая, направление дальнейшего наступления; в обороне — удержание опорного пункта).<\/li><li>Боевой порядок — построение подразделений для ведения боя.<\/li><li>Боевые возможности — показатели способности подразделения выполнить задачу (огневые, ударные, манёвренные).<\/li><li>Охват — выход во фланг; обход — более глубокий манёвр в тыл; отход — вывод из-под удара на новый рубеж.<\/li><\/ul>"}, {"n": "2", "day": 1, "dayTitle": "Общая тактика", "q": "Принятые названия и сокращения, порядок их написания в боевых документах.", "k": "<ol><li>Сокращения — <b>строчными буквами, без точек<\/b>: мсб, тб, мср, тр, мсв, тв, мсо<\/li><li>Номер — <b>арабской цифрой перед<\/b> сокращением: 2 мср, 1 тв<\/li><li><b>Населённые пункты<\/b> — в именительном падеже, точно как на карте; одноимённые — с квадратом или координатами<\/li><li><b>Высоты<\/b> — «выс.» + отметка: выс. 210,5<\/li><li><b>Рубежи<\/b> — перечислением точек <b>справа налево<\/b> (лицом к противнику)<\/li><li><b>Время<\/b> — 24‑часовой формат: 6.00 15.11<\/li><\/ol>", "cnt": 6, "m": "", "d": "<ul><li>мсп — мотострелковый полк, мсб — батальон, мср — рота, мсв — взвод, мсо — отделение; тб, тр, тв — танковые; адн — артиллерийский дивизион, птв — противотанковый взвод, гв — гранатомётный взвод.<\/li><li>Общепринятые: ОП — опорный пункт, РО — район обороны, КНП — командно-наблюдательный пункт, БМП, БТР, ПТУР, РХБЗ, РЭБ, БпЛА.<\/li><li>Направление указывают 2–⁠3 пунктами от себя в сторону противника.<\/li><li>В документах — только принятые сокращения, чтобы не было двусмысленности.<\/li><\/ul>"}, {"n": "3", "day": 1, "dayTitle": "Общая тактика", "q": "Виды общевойскового боя и их характеристика.", "k": "<ol><li>Основные виды — <b>оборона<\/b> и <b>наступление<\/b><\/li><li><b>Встречный бой<\/b> — разновидность наступления<\/li><li>Черты боя: <b>решительность, высокая напряжённость, скоротечность, динамичность, манёвренность<\/b><\/li><li>Поражение противника одновременно на <b>всю глубину<\/b>; применение ВТО, БпЛА, РЭБ<\/li><li><b>Быстрый переход<\/b> от одних действий к другим, сложная радиоэлектронная обстановка<\/li><\/ol>", "cnt": 5, "m": "", "d": "<ul><li>Общевойсковой бой ведут совместно мотострелковые и танковые подразделения, артиллерия, ПВО, специальные войска.<\/li><li>Оборона — отразить наступление, нанести потери, удержать район, создать условия для наступления.<\/li><li>Наступление — разгромить противника и овладеть важными районами (рубежами, объектами).<\/li><li>Бой может вестись с применением только обычного оружия или с применением ОМП, а также в особых условиях: город, горы, лес, ночь, зима.<\/li><\/ul>"}, {"n": "4", "day": 1, "dayTitle": "Общая тактика", "q": "Последовательность и содержание работы командира.", "k": "<ol><li><b>Принятие решения<\/b> (уяснение задачи, оценка обстановки, замысел)<\/li><li><b>Рекогносцировка<\/b><\/li><li><b>Постановка задач<\/b> подчинённым (боевой приказ)<\/li><li>Организация <b>взаимодействия<\/b><\/li><li>Организация <b>всестороннего обеспечения<\/b><\/li><li>Организация <b>управления<\/b><\/li><li><b>Подготовка подразделений<\/b> и <b>практическая работа<\/b> (контроль готовности, помощь)<\/li><\/ol>", "cnt": 7, "m": "Решили, Разведали, Поставили → Взаимодействуем, Обеспечиваем, Управляем, Проверяем", "d": "<ul><li>Работа командира начинается с получения задачи и продолжается до её выполнения.<\/li><li>Методы: последовательный (шаг за шагом) или параллельный (одновременно со старшим командиром, чтобы выиграть время).<\/li><li>Главное — экономить время подчинённых: сразу отдать предварительные распоряжения на подготовку.<\/li><li>В ходе боя командир уточняет решение и задачи, поддерживает взаимодействие, докладывает старшему.<\/li><\/ul>"}, {"n": "5", "day": 1, "dayTitle": "Общая тактика", "q": "Организация оборонительного, наступательного боя, штурмовых действий и передвижения.", "k": "<ol><li>Общее для всех: <b>решение → рекогносцировка → постановка задач → взаимодействие → обеспечение → управление → подготовка подразделений → контроль<\/b><\/li><li><b>Оборона<\/b>: + <b>система огня<\/b>, инженерное оборудование опорных пунктов, заграждения<\/li><li><b>Наступление<\/b>: + порядок <b>выдвижения, развёртывания и атаки<\/b>, рубежи перехода в атаку<\/li><li><b>Штурм<\/b>: + создание <b>штурмовых групп<\/b>, тренировка на похожих объектах, блокирование объекта<\/li><li><b>Передвижение<\/b>: + маршрут, <b>порядок построения колонны<\/b>, пункты регулирования, привалы, действия при встрече с противником<\/li><\/ol>", "cnt": 5, "m": "", "d": "<ul><li>Организация боя — работа командира и штаба по подготовке подразделений к выполнению задачи.<\/li><li>В обороне главное — система огня перед передним краем, на флангах и в промежутках, защита от БпЛА и ВТО.<\/li><li>В наступлении — согласование огня артиллерии с атакой, проходы в заграждениях.<\/li><li>В штурме — распределение объектов (зданий) между группами, сигналы опознавания, эвакуация раненых.<\/li><li>На марше — маскировка, ПВО, защита от БпЛА, техническое замыкание.<\/li><\/ul>"}, {"n": "6", "day": 1, "dayTitle": "Общая тактика", "q": "Содержание решения, боевого приказа на бой и на передвижение.", "k": "<div class=\"sub\">Решение<\/div><ol><li><b>Замысел<\/b>: направление главных усилий, способ разгрома (выполнения задачи), построение боевого порядка<\/li><li><b>Задачи подразделениям<\/b> + основные вопросы <b>взаимодействия, обеспечения, управления<\/b><\/li><\/ol><div class=\"sub\">Боевой приказ (рота, взвод)<\/div><ol><li><b>Ориентиры<\/b><\/li><li><b>Противник<\/b>: состав, положение, возможный характер действий<\/li><li><b>Задача<\/b> своего подразделения и замысел старшего<\/li><li><b>Задачи соседей<\/b><\/li><li>«<b>ПРИКАЗЫВАЮ<\/b>» — задачи подчинённым<\/li><li><b>Время готовности<\/b><\/li><li><b>Своё место и заместитель<\/b><\/li><\/ol><div class=\"sub\">Приказ на передвижение (марш)<\/div><ol><li>Противник → задача (маршрут, район, время) → «ПРИКАЗЫВАЮ»: построение колонны, исходный пункт, пункты регулирования, скорость, дистанции, привалы → действия при встрече с противником и ударах с воздуха → время готовности, место, заместитель<\/li><\/ol>", "cnt": 10, "m": "Где мы → кто против → что делаем → кто рядом → кому что → когда → где я", "d": "<ul><li>Решение — основа управления; принимается после уяснения задачи и оценки обстановки.<\/li><li>Боевой приказ отдаётся устно, кратко и чётко, как правило на местности или по карте.<\/li><li>В конце командир проверяет, как подчинённые поняли задачи.<\/li><\/ul>"}, {"n": "7", "day": 1, "dayTitle": "Общая тактика", "q": "Цель проведения штурма и способы его достижения.", "k": "<ol><li><b>Цель<\/b>: овладеть укреплённым объектом (опорным пунктом, зданием, населённым пунктом), уничтожить или пленить противника и <b>удержать объект<\/b><\/li><\/ol><div class=\"sub\">Способы<\/div><ol><li><b>Штурм с ходу<\/b> — внезапно, без длительной подготовки, пока противник не закрепился<\/li><li><b>Штурм после блокирования<\/b> объекта и его огневого поражения<\/li><li><b>Последовательное овладение<\/b> элементами объекта (здание за зданием, этаж за этажом)<\/li><li>Ключевое: <b>внезапность, огневое подавление, решительность<\/b><\/li><\/ol>", "cnt": 5, "m": "", "d": "<ul><li>Штурм применяют, когда объект нельзя обойти, а противник опирается на прочные сооружения.<\/li><li>Перед штурмом: разведка объекта (в т.ч. с БпЛА), подавление огневых точек, проходы в заграждениях.<\/li><li>Внезапность — действия ночью, в тумане, с нескольких направлений одновременно.<\/li><li>Захваченные элементы сразу закрепляют и готовят к отражению контратак.<\/li><\/ul>"}, {"n": "8", "day": 1, "dayTitle": "Общая тактика", "q": "Способы выполнения боевых задач при штурме назначенного объекта.", "k": "<ol><li><b>Блокирование<\/b> объекта — отрезать от резервов и путей отхода<\/li><li><b>Подавление огневых средств<\/b> (артиллерия, танки, БМП, огневые группы, БпЛА)<\/li><li><b>Проделывание проходов<\/b> в заграждениях и стенах (саперы, заряды)<\/li><li><b>Проникновение<\/b> в объект: через проломы, окна, подвалы, крыши — с неожиданного направления<\/li><li><b>Зачистка<\/b> помещений, уничтожение противника<\/li><li><b>Закрепление<\/b> захваченного и <b>отражение контратак<\/b><\/li><\/ol>", "cnt": 6, "m": "", "d": "<ul><li>Штурмовые группы действуют по принципу «огонь и движение»: одни прикрывают огнём, другие перемещаются.<\/li><li>Здание берут по частям; зачищенные помещения отмечают условным знаком.<\/li><li>Опознавание «свой–чужой» — заранее оговорённые сигналы.<\/li><li>Раненых эвакуируют назначенные группы, чтобы не ослаблять штурмующих.<\/li><\/ul>"}, {"n": "9", "day": 1, "dayTitle": "Общая тактика", "q": "Боевые задачи и боевой порядок при штурме.", "k": "<div class=\"sub\">Боевые задачи<\/div><ol><li><b>Ближайшая<\/b> — захват первой линии (передних зданий, позиций) объекта<\/li><li><b>Последующая<\/b> — овладение всем объектом; затем <b>закрепиться и удерживать<\/b><\/li><\/ol><div class=\"sub\">Боевой порядок<\/div><ol><li><b>Штурмовые группы<\/b> (захвата) — врываются и уничтожают противника<\/li><li><b>Группа огневой поддержки<\/b> — подавляет огневые точки, прикрывает<\/li><li><b>Группа обеспечения<\/b> — инженерная (разграждение), эвакуационная, подноса боеприпасов<\/li><li><b>Резерв<\/b> — наращивание усилий, замена потерь, отражение контратак<\/li><\/ol>", "cnt": 6, "m": "", "d": "<ul><li>Каждая группа получает свой объект (здание, этаж, позицию) и маршрут выдвижения.<\/li><li>Танки и БМП, придаваемые штурмовым группам, бьют по огневым точкам прямой наводкой.<\/li><li>Состав и численность групп возьми из лекций ВУЦ — их часто спрашивают.<\/li><\/ul>"}, {"n": "10", "day": 1, "dayTitle": "Общая тактика", "q": "Всестороннее обеспечение боевых действий.", "k": "<ol><li><b>Определение<\/b>: комплекс мероприятий для поддержания <b>высокой боевой готовности<\/b>, сохранения <b>боеспособности<\/b> и создания <b>благоприятных условий<\/b> для выполнения задач<\/li><li>Организует <b>командир<\/b> на основе своего решения; выполняют все подразделения<\/li><li>Проводится <b>своевременно и непрерывно<\/b> — при подготовке и в ходе боя<\/li><li>Виды: <b>боевое, морально-психологическое, материально-техническое<\/b><\/li><\/ol>", "cnt": 4, "m": "", "d": "<ul><li>Задачи по обеспечению командир ставит в боевом приказе или отдельными распоряжениями.<\/li><li>Без обеспечения подразделение быстро теряет боеспособность: нет данных о противнике, нечем стрелять, нечем двигаться.<\/li><li>Подробно виды — в вопросе 11.<\/li><\/ul>"}, {"n": "11", "day": 1, "dayTitle": "Общая тактика", "q": "Виды всестороннего обеспечения и их характеристика.", "k": "<ol><li><b>Боевое<\/b> — недопущение внезапного нападения, снижение эффективности ударов противника, условия для успешного боя<\/li><li><b>Морально-психологическое<\/b> — моральный дух, стойкость, психологическая устойчивость личного состава<\/li><li><b>Материально-техническое (МТО)<\/b> — снабжение (боеприпасы, ГСМ, продовольствие, вещевое), ремонт и эвакуация техники, медицинское обеспечение, транспорт<\/li><li>Ранее МТО делилось на <b>техническое<\/b> и <b>тыловое<\/b><\/li><\/ol>", "cnt": 4, "m": "Б-М-М: Боевое, Моральное, Материальное", "d": "<ul><li>Техническая часть МТО: поддержание вооружения и техники в исправности, ремонт, эвакуация повреждённых машин.<\/li><li>Тыловая часть: подвоз материальных средств, питание, медицинская помощь и эвакуация раненых.<\/li><li>Морально-психологическое: информационно-воспитательная и психологическая работа, защита от информационно-психологического воздействия противника.<\/li><\/ul>"}, {"n": "12", "day": 1, "dayTitle": "Общая тактика", "q": "Сущность, цели и виды боевого обеспечения.", "k": "<ol><li><b>Сущность и цели<\/b>: мероприятия для <b>недопущения внезапного нападения<\/b>, <b>снижения эффективности ударов<\/b> противника и создания условий для <b>организованного вступления в бой<\/b> и его успешного ведения<\/li><\/ol><div class=\"sub\">Виды<\/div><ol><li><b>Разведка<\/b><\/li><li><b>Охранение<\/b><\/li><li><b>Тактическая маскировка<\/b><\/li><li><b>Инженерное обеспечение<\/b><\/li><li><b>РХБ защита<\/b><\/li><li><b>РЭБ<\/b> (радиоэлектронная борьба)<\/li><li><b>Топогеодезическое, навигационное, гидрометеорологическое<\/b> обеспечение<\/li><\/ol>", "cnt": 8, "m": "Рома Охотно Маскирует Инженерную Химию Электроникой (Р-О-М-И-Х-Э) + Топо, Навиг, Гидромет", "d": "<ul><li>Разведка — сведения о противнике и местности.<\/li><li>Охранение — защита от внезапного нападения и наземной разведки (походное, сторожевое, непосредственное).<\/li><li>Маскировка — скрытие своих подразделений и введение противника в заблуждение.<\/li><li>Инженерное — оборудование позиций, заграждения, проходы, переправы.<\/li><li>РХБЗ — защита от ОМП и последствий разрушения опасных объектов.<\/li><li>РЭБ — подавление радиосредств и БпЛА противника, защита своих.<\/li><\/ul>"}, {"n": "13", "day": 2, "dayTitle": "Передвижение, оборона, наступление", "q": "Условия и способы передвижения войск.", "k": "<ol><li><b>Способы<\/b>: <b>марш<\/b> (своим ходом), <b>перевозка<\/b> (железнодорожным, морским, речным, воздушным транспортом), <b>комбинированный<\/b><\/li><li>Основной способ для подразделений — <b>марш<\/b><\/li><li><b>Условия<\/b>: при <b>угрозе столкновения<\/b> с противником или <b>вне угрозы<\/b>; днём, ночью, при ограниченной видимости; разная местность и погода<\/li><li>Учитывать удары <b>авиации, ВТО, БпЛА<\/b>, действия ДРГ, РЭБ противника<\/li><\/ol>", "cnt": 4, "m": "", "d": "<ul><li>Цель передвижения — прибыть в назначенный район вовремя, в полном составе и в готовности к бою.<\/li><li>При угрозе столкновения колонну и охранение строят так, чтобы быстро развернуться в бой.<\/li><li>Перевозки применяют на большие расстояния, чтобы сберечь моторесурс и силы людей.<\/li><\/ul>"}, {"n": "14", "day": 2, "dayTitle": "Передвижение, оборона, наступление", "q": "Марш, его цель, виды и условия совершения.", "k": "<ol><li><b>Марш<\/b> — организованное передвижение в колоннах по дорогам и колонным путям для выхода в назначенный район или на рубеж<\/li><li><b>Цель<\/b>: прибыть <b>вовремя, в полном составе<\/b>, в готовности к задаче<\/li><li><b>Виды<\/b>: <b>к фронту<\/b>, <b>от фронта<\/b>, <b>вдоль фронта<\/b> (рокадный)<\/li><li><b>Условия<\/b>: при угрозе столкновения или вне угрозы; днём или ночью<\/li><li><b>Походный порядок<\/b>: разведка → охранение (головная, боковые, тыловая заставы) → главные силы → техническое замыкание<\/li><li><b>Привалы<\/b>: через 3–⁠4 ч движения — до 1 ч; один до 2 ч во второй половине суточного перехода; в конце — дневной (ночной) отдых<\/li><\/ol>", "cnt": 6, "m": "", "d": "<ul><li>Дистанция между машинами обычно 25–⁠50 м; увеличивается ночью, на пыльных и скользких дорогах, при угрозе ударов с воздуха.<\/li><li>Марш стараются совершать ночью или при ограниченной видимости — для скрытности.<\/li><li>На марше: ПВО, наблюдение за воздухом (в т.ч. БпЛА), маскировка, регулирование движения.<\/li><li>Неисправные машины ремонтирует техническое замыкание.<\/li><\/ul>"}, {"n": "15", "day": 2, "dayTitle": "Передвижение, оборона, наступление", "q": "Особенности передвижения войск воздушным и морским транспортом.", "k": "<ol><li>Этапы: <b>сосредоточение<\/b> в районе ожидания → <b>погрузка<\/b> → <b>перелёт / переход морем<\/b> → <b>выгрузка<\/b> → <b>сосредоточение<\/b> в назначенном районе<\/li><li><b>Воздушный<\/b>: высокая скорость, ограничения по <b>массе и габаритам<\/b> техники, зависимость от <b>аэродромов и погоды<\/b>, уязвимость от ПВО противника, <b>швартовка<\/b> техники, прикрытие<\/li><li><b>Морской<\/b>: большой объём перевозок, зависимость от <b>волнения и погоды<\/b>, угроза с воздуха и моря, <b>охранение (конвой)<\/b>, строгая маскировка в портах<\/li><\/ol>", "cnt": 3, "m": "", "d": "<ul><li>Погрузка и выгрузка — самые уязвимые этапы (войска скучены), их проводят быстро и по возможности ночью.<\/li><li>Технику готовят заранее: заправка, крепёжные средства, планы размещения.<\/li><li>Личный состав изучает правила поведения на борту и действия при аварии.<\/li><\/ul>"}, {"n": "16", "day": 2, "dayTitle": "Передвижение, оборона, наступление", "q": "Сущность оборонительного боя. Виды обороны и условия перехода к обороне. Требования к обороне.", "k": "<ol><li><b>Оборона<\/b> — вид боя для <b>отражения наступления<\/b> превосходящих сил, нанесения им <b>максимальных потерь<\/b>, <b>удержания<\/b> важных районов и создания условий для перехода в наступление<\/li><li><b>Виды<\/b>: <b>позиционная<\/b> (упорное удержание рубежей) и <b>манёвренная<\/b> (бои на последовательных рубежах с отходом в глубину)<\/li><li><b>Переход<\/b>: <b>заблаговременно<\/b> (вне соприкосновения) или <b>в ходе боя<\/b> (в соприкосновении с противником)<\/li><li><b>Требования<\/b>: <b>устойчивая и активная<\/b>; противотанковая, противовоздушная, противодесантная, глубоко эшелонированная, устойчивая к ВТО и ОМП<\/li><\/ol>", "cnt": 4, "m": "Виды: П и М (Позиционная, Манёвренная). Требования: У и А (Устойчивая, Активная)", "d": "<ul><li>Позиционная — основной вид: упорная борьба за каждый рубеж.<\/li><li>Манёвренная — когда сил мало или нужно выиграть время, изматывая противника на нескольких рубежах.<\/li><li>Переход к обороне в ходе боя — самый сложный: противник давит, времени на подготовку мало.<\/li><li>Устойчивость — способность удержать позиции; активность — огонь, контратаки, манёвр.<\/li><\/ul>"}, {"n": "17", "day": 2, "dayTitle": "Передвижение, оборона, наступление", "q": "Построение обороны: боевой порядок, система опорных пунктов и огневых позиций, система инженерных заграждений.", "k": "<ol><li><b>Боевой порядок<\/b> (батальон): <b>первый эшелон<\/b>, <b>второй эшелон<\/b> (или резерв), <b>артиллерия<\/b>, огневые средства в непосредственном подчинении, бронегруппа, огневые засады<\/li><li><b>Система ОП<\/b>: <b>район обороны<\/b> батальона (≈5 × 2–⁠2,5 км) → <b>ротные опорные пункты<\/b> (≈1,5 × 1 км) → <b>взводные<\/b> (≈400 × 300 м); связаны огнём, траншеями, ходами сообщения<\/li><li><b>Огневые позиции<\/b>: основные, запасные, временные; секторы обстрела, <b>зоны сплошного многослойного огня<\/b> перед передним краем, на флангах и в промежутках<\/li><li><b>Заграждения<\/b>: <b>минно-взрывные<\/b> (ПТ и ПП минные поля, фугасы), <b>невзрывные<\/b> (рвы, эскарпы, надолбы, завалы, проволочные), <b>комбинированные<\/b>; обязательно <b>прикрываются огнём<\/b><\/li><\/ol>", "cnt": 4, "m": "", "d": "<ul><li>Построение обороны = боевой порядок + система огня + опорные пункты и позиции + заграждения.<\/li><li>Опорные пункты оборудуют для круговой обороны.<\/li><li>Заграждения ставят перед передним краем, на флангах, в промежутках и в глубине — прежде всего на танкоопасных направлениях.<\/li><li>Размеры районов и ОП ориентировочные — сверь с конспектом.<\/li><\/ul>"}, {"n": "18", "day": 2, "dayTitle": "Передвижение, оборона, наступление", "q": "Способы и мероприятия защиты войск (в т.ч. от БпЛА и FPV-дронов), работа командира по защите войск в бою.", "k": "<ol><li><b>Мероприятия<\/b>: <b>рассредоточение<\/b> и смена позиций; <b>инженерное оборудование<\/b> (укрытия, перекрытия); <b>маскировка<\/b>; <b>РЭБ<\/b>; <b>РХБЗ<\/b>; противопожарные меры; <b>ликвидация последствий<\/b> ударов<\/li><\/ol><div class=\"sub\">От БпЛА и FPV<\/div><ol><li>Постоянное <b>наблюдение за воздухом и оповещение<\/b><\/li><li><b>РЭБ<\/b>: подавители, детекторы дронов<\/li><li><b>Противодроновые сети и козырьки<\/b> над позициями, укрытиями, техникой<\/li><li><b>Огневое поражение<\/b> дронов (дробовики, стрелковое оружие, зенитные средства)<\/li><li>Маскировка, <b>запрет скоплений<\/b>, <b>ограничение радиоизлучений<\/b> и телефонов, <b>ложные позиции<\/b><\/li><\/ol><div class=\"sub\">Работа командира<\/div><ol><li>Оценить угрозу → решение по защите → задачи → наблюдение и оповещение → контроль → ликвидация последствий<\/li><\/ol>", "cnt": 7, "m": "", "d": "<ul><li>Цель защиты — снизить потери и сохранить боеспособность при ударах противника.<\/li><li>Передвижение малыми группами, рассредоточенно, скрытыми маршрутами, лучше при ограниченной видимости.<\/li><li>Каждый знает сигналы оповещения о дронах и свои действия по ним.<\/li><li>Эту тему преподаватели дополняют свежим опытом — допиши сюда их примеры.<\/li><\/ul>"}, {"n": "19", "day": 2, "dayTitle": "Передвижение, оборона, наступление", "q": "Современный наступательный бой, его цель и сущность. Способы перехода в наступление.", "k": "<ol><li><b>Цель<\/b>: <b>разгром противника<\/b> и <b>овладение важными районами<\/b> (рубежами, объектами)<\/li><li><b>Сущность<\/b>: поражение противника всеми средствами, <b>решительная атака<\/b>, <b>стремительное продвижение<\/b> в глубину, уничтожение живой силы, захват вооружения и местности<\/li><li>Наступают на <b>обороняющегося<\/b>, <b>наступающего<\/b> (встречный бой) и <b>отходящего<\/b> (преследование) противника<\/li><li><b>Способы перехода<\/b>: <b>с ходу<\/b> (с выдвижением из глубины) и <b>из положения непосредственного соприкосновения<\/b><\/li><\/ol>", "cnt": 4, "m": "", "d": "<ul><li>С ходу: выдвижение из исходного района → предбоевой порядок → боевой порядок → атака без остановки. Выше внезапность, меньше время под огнём.<\/li><li>Из соприкосновения: подразделения переходят в атаку прямо с занимаемых позиций.<\/li><li>Условия успеха: внезапность, огневое поражение, сосредоточение сил на главном направлении, манёвр.<\/li><\/ul>"}, {"n": "20", "day": 2, "dayTitle": "Передвижение, оборона, наступление", "q": "Боевой порядок подразделений тб в наступлении (элементы и построение).", "k": "<ol><li><b>Элементы<\/b>: <b>первый эшелон<\/b> (танковые роты), <b>второй эшелон<\/b> или <b>общевойсковой резерв<\/b>, <b>артиллерийские подразделения<\/b>, огневые средства в <b>непосредственном подчинении<\/b><\/li><li>Могут придаваться <b>мотострелковые<\/b> подразделения<\/li><li><b>Построение<\/b> роты, взвода: <b>в линию<\/b>, <b>углом вперёд<\/b>, <b>углом назад<\/b>, <b>уступом вправо/влево<\/b><\/li><li>Фронт наступления: <b>тб — до 2 км<\/b> (на прорыве до 1 км), <b>тр — до 1 км<\/b> (до 500 м)<\/li><li><b>Задачи<\/b>: ближайшая, последующая, направление дальнейшего наступления<\/li><\/ol>", "cnt": 5, "m": "", "d": "<ul><li>Главные силы — на главном направлении, по замыслу командира.<\/li><li>Второй эшелон (резерв) — наращивание усилий, развитие успеха, замена подразделений первого эшелона.<\/li><li>Последовательность: походный порядок → предбоевой (колонны взводов) → боевой (боевая линия) перед атакой.<\/li><li>Цифры фронта ориентировочные — сверь с конспектом.<\/li><\/ul>"}, {"n": "21", "day": 2, "dayTitle": "Передвижение, оборона, наступление", "q": "Встречный бой как разновидность наступательного боя.", "k": "<ol><li><b>Встречный бой<\/b> — бой, в котором <b>обе стороны стремятся выполнить задачи наступлением<\/b><\/li><li><b>Цель<\/b>: быстро разгромить выдвигающегося противника, <b>захватить инициативу<\/b><\/li><li><b>Когда возникает<\/b>: при наступлении в глубине обороны противника, при его контратаке, на марше, при выдвижении к фронту<\/li><li><b>Черты<\/b>: резкое <b>изменение обстановки<\/b>, <b>мало сведений<\/b> о противнике, борьба за <b>упреждение<\/b> в развёртывании и открытии огня, <b>скоротечность<\/b>, открытые <b>фланги и промежутки<\/b>, широкий манёвр<\/li><\/ol>", "cnt": 4, "m": "Обе стороны — вперёд; кто первый развернулся, тот и выиграл", "d": "<ul><li>Выигрывает тот, кто раньше обнаружил противника, быстрее развернулся и первым ударил огнём.<\/li><li>Способы разгрома: сковать с фронта и ударить во фланг и тыл, огневое поражение на подходе.<\/li><li>Решение командир часто принимает с ходу, по неполным данным.<\/li><\/ul>"}, {"n": "22", "day": 3, "dayTitle": "Управление, инженерка, местность", "q": "Органы и пункты управления полка.", "k": "<ol><li><b>Органы управления<\/b>: <b>командование<\/b> (командир полка, заместители), <b>штаб<\/b> (начальник штаба, отделения), <b>начальники родов войск и служб<\/b><\/li><li><b>Пункты управления<\/b>: <b>командный пункт (КП)<\/b>, <b>тыловой пункт управления (ТПУ)<\/b><\/li><li>При необходимости: <b>запасный КП (ЗКП)<\/b>, <b>передовой КП / наблюдательный пункт<\/b> командира<\/li><li>Требования к ПУ: <b>живучесть, скрытность, мобильность<\/b>, устойчивая связь<\/li><\/ol>", "cnt": 4, "m": "", "d": "<ul><li>КП — основной пункт, откуда командир руководит боем; на нём командир, начальник штаба, офицеры штаба, начальники родов войск.<\/li><li>ТПУ — управление материально-техническим обеспечением.<\/li><li>ПУ размещают с учётом защитных свойств местности, маскируют, периодически перемещают, рассредоточивают элементы; защищают от БпЛА.<\/li><\/ul>"}, {"n": "23", "day": 3, "dayTitle": "Управление, инженерка, местность", "q": "Порядок работы командира подразделения после получения боевой задачи.", "k": "<ol><li><b>Уяснить задачу<\/b><\/li><li><b>Рассчитать время<\/b><\/li><li><b>Отдать распоряжения<\/b> на подготовку к бою<\/li><li><b>Оценить обстановку<\/b><\/li><li><b>Принять решение<\/b> (замысел), доложить старшему<\/li><li><b>Рекогносцировка<\/b><\/li><li><b>Отдать боевой приказ<\/b><\/li><li>Организовать <b>взаимодействие, обеспечение, управление<\/b><\/li><li><b>Проверить готовность<\/b>, помочь подчинённым, доложить<\/li><\/ol>", "cnt": 9, "m": "Уяснил → Посчитал → Распорядился → Оценил → Решил → Посмотрел на местности → Приказал → Организовал → Проверил", "d": "<ul><li>Уяснить задачу — замысел старшего, своя задача, задачи соседей, время готовности.<\/li><li>Оценить обстановку — противник, свои, соседи, местность, погода, время суток.<\/li><li>Расчёт времени — сколько есть у тебя и у подчинённых; подчинённым оставить больше.<\/li><li>Распоряжения на подготовку — сразу, чтобы подразделения готовились, пока командир работает дальше.<\/li><\/ul>"}, {"n": "24", "day": 3, "dayTitle": "Управление, инженерка, местность", "q": "Содержание взаимодействия в основных видах боя.", "k": "<ol><li><b>Взаимодействие<\/b> — согласованные по <b>цели, задачам, направлениям, рубежам, времени и способам<\/b> действия подразделений, родов войск и соседей<\/li><li>Организуется <b>по задачам, рубежам и времени<\/b>, как правило на местности<\/li><li><b>Оборона<\/b>: при выдвижении противника, его развёртывании и атаке, при <b>вклинении<\/b>, при <b>контратаке<\/b><\/li><li><b>Наступление<\/b>: при выдвижении и развёртывании, <b>атаке переднего края<\/b>, бое в глубине, <b>отражении контратак<\/b>, вводе второго эшелона<\/li><li><b>Встречный бой<\/b>: при встрече, развёртывании и ударе, при отражении ударов противника<\/li><li>Обязательно: <b>сигналы опознавания, целеуказания, оповещения<\/b>, вызова и прекращения огня<\/li><\/ol>", "cnt": 6, "m": "", "d": "<ul><li>Цель — объединить усилия всех подразделений для общей цели боя.<\/li><li>Согласуют действия мотострелков, танков, артиллерии, ПВО, саперов, операторов БпЛА.<\/li><li>В ходе боя взаимодействие поддерживают связью и уточнением задач.<\/li><\/ul>"}, {"n": "25", "day": 3, "dayTitle": "Управление, инженерка, местность", "q": "Назначение, характеристики, способы устройства сооружений для ведения огня, укрытий для личного состава и техники.", "k": "<ol><li><b>Для ведения огня<\/b>: <b>окопы<\/b> (стрелка, отделения, для БМП, танков, орудий), <b>траншеи<\/b>, <b>ходы сообщения<\/b><\/li><li><b>Для личного состава<\/b>: <b>щели<\/b> (открытые и перекрытые), <b>блиндажи<\/b>, <b>убежища<\/b><\/li><li><b>Для техники<\/b>: <b>окопы<\/b> и <b>укрытия котлованного типа<\/b><\/li><li><b>Способы устройства<\/b>: <b>открытый<\/b> (вручную или машинами — БАТ, ПЗМ, МДК), <b>подземный (минный)<\/b>, <b>взрывной<\/b>, из <b>сборных конструкций<\/b><\/li><\/ol>", "cnt": 4, "m": "", "d": "<ul><li>Окоп стрелка отрывают последовательно: для стрельбы лёжа → с колена → стоя.<\/li><li>Траншея объединяет позиции взвода; ходы сообщения связывают их с укрытиями и глубиной.<\/li><li>Перекрытая щель защищает от осколков, пуль, светового излучения, частично от ударной волны.<\/li><li>Блиндаж — отдых и укрытие л/с; убежище — защита от всех поражающих факторов, герметизация, фильтровентиляция.<\/li><li>Танк может окапываться сам бульдозерным оборудованием.<\/li><li>Сейчас обязательно: сетки и перекрытия от дронов, маскировка входов.<\/li><\/ul>"}, {"n": "26", "day": 3, "dayTitle": "Управление, инженерка, местность", "q": "Средства и приёмы маскировки.", "k": "<div class=\"sub\">Средства<\/div><ol><li><b>Естественные<\/b>: рельеф, растительность, ночь, туман<\/li><li><b>Табельные<\/b>: маскировочные сети и комплекты, маскхалаты, окраска, средства против тепловизоров и радиолокации, <b>макеты и ложные цели<\/b><\/li><li><b>Местные<\/b>: ветки, трава, снег, грунт<\/li><li><b>Дымовые<\/b>: гранаты, шашки, термодымовая аппаратура<\/li><\/ol><div class=\"sub\">Приёмы<\/div><ol><li><b>Скрытие<\/b>, <b>имитация<\/b> (ложные позиции, макеты), <b>демонстративные действия<\/b>, <b>дезинформация<\/b><\/li><li><b>Требования<\/b>: <b>активность, правдоподобие, разнообразие, непрерывность<\/b><\/li><\/ol>", "cnt": 6, "m": "Приёмы «СИДД»: Скрытие, Имитация, Демонстративные действия, Дезинформация", "d": "<ul><li>Демаскирующие признаки: форма, цвет, тень, блеск, следы, звук, тепло, радиоизлучения, дым.<\/li><li>Против дронов особенно важны тепловая маскировка, отсутствие следов и скоплений, дисциплина радио и телефонов.<\/li><li>Скрытие — убрать или ослабить демаскирующие признаки; имитация — создать ложные.<\/li><\/ul>"}, {"n": "27", "day": 3, "dayTitle": "Управление, инженерка, местность", "q": "Тактические свойства местности.", "k": "<ol><li><b>Проходимость<\/b><\/li><li>Условия <b>ориентирования<\/b><\/li><li>Условия <b>наблюдения<\/b><\/li><li>Условия <b>маскировки<\/b><\/li><li>Условия <b>ведения огня<\/b><\/li><li><b>Защитные свойства<\/b><\/li><\/ol>", "cnt": 6, "m": "«ПОНМОЗ»: Проходимость, Ориентирование, Наблюдение, Маскировка, Огонь, Защита", "d": "<ul><li>Проходимость — возможность движения вне дорог (грунт, растительность, водные преграды, погода).<\/li><li>Ориентирование — наличие заметных местных предметов и характерных форм рельефа.<\/li><li>Наблюдение — дальность и обзор, господствующие высоты.<\/li><li>Маскировка — складки рельефа, лес, населённые пункты.<\/li><li>Ведение огня — поля обстрела, непоражаемые пространства.<\/li><li>Защитные свойства — ослабление ударов и ОМП (овраги, балки, лес, капитальные здания).<\/li><\/ul>"}, {"n": "28", "day": 3, "dayTitle": "Управление, инженерка, местность", "q": "Понятия: дирекционный угол, истинный азимут, магнитный азимут. Подготовка данных для движения по азимутам.", "k": "<ol><li><b>Дирекционный угол (α)<\/b> — от <b>северного направления вертикальной линии сетки<\/b> карты по часовой стрелке до направления на объект<\/li><li><b>Истинный азимут (А)<\/b> — от <b>северного направления истинного (географического) меридиана<\/b><\/li><li><b>Магнитный азимут (Ам)<\/b> — от <b>северного направления магнитного меридиана<\/b> (по компасу)<\/li><li>Связь между ними: <b>склонение магнитной стрелки δ<\/b> и <b>сближение меридианов γ<\/b><\/li><li><b>ПН = (±δ) − (±γ)<\/b>;  <b>Ам = α − ПН<\/b>;  <b>α = Ам + ПН<\/b><\/li><li><b>Подготовка данных<\/b>: исходный пункт и <b>ориентиры поворотов<\/b> → <b>дирекционные углы и расстояния<\/b> → перевод в <b>магнитные азимуты<\/b> → расстояния в <b>пары шагов<\/b> (≈1,5 м) → <b>схема или таблица<\/b> маршрута<\/li><\/ol>", "cnt": 6, "m": "Дирекционный — от Сетки, истинный — от Географии, магнитный — от Компаса", "d": "<ul><li>Углы — от 0 до 360° (или 0‑00 до 60‑00 в делениях угломера).<\/li><li>δ и γ даны под южной рамкой карты; восточные со знаком «+», западные со знаком «−».<\/li><li>Ориентиры поворотов выбирают легко опознаваемые: перекрёстки, мосты, отдельные постройки.<\/li><li>Отрезки маршрута не делают слишком длинными, чтобы не накапливалась ошибка.<\/li><\/ul>"}, {"n": "29", "day": 3, "dayTitle": "Управление, инженерка, местность", "q": "Ориентиры и порядок их использования в бою, порядок целеуказания в бою.", "k": "<ol><li><b>Ориентиры<\/b> — хорошо видимые <b>местные предметы и формы рельефа<\/b>, относительно которых указывают цели, ставят задачи и управляют огнём<\/li><li>Выбирают <b>равномерно по фронту и в глубину<\/b>, хорошо заметные, <b>не разрушаемые огнём<\/b><\/li><li><b>Нумеруют справа налево<\/b> и по рубежам <b>от себя в сторону противника<\/b>; старший назначает общие, командир добавляет свои<\/li><li><b>Целеуказание<\/b>: <b>от ориентира<\/b>, <b>от направления движения<\/b>, <b>трассирующими<\/b> пулями (снарядами) и сигнальными средствами, <b>по карте<\/b> (координаты, квадрат по «улитке»), с помощью <b>дронов<\/b><\/li><li>Пример: «<b>Ориентир 2, вправо 20, ближе 100 — пулемёт в кустах<\/b>»<\/li><\/ol>", "cnt": 5, "m": "", "d": "<ul><li>Углы при целеуказании — в тысячных (делениях угломера).<\/li><li>Ориентир называют номером и наименованием: «Ориентир 1 — отдельное дерево».<\/li><li>Целеуказание — кратко, точно, понятно; подчинённые знают все ориентиры наизусть.<\/li><\/ul>"}, {"n": "30", "day": 4, "dayTitle": "Топография и документы", "q": "Сущность картографического изображения местности и его основные свойства. Топографическая карта и план, уровенная поверхность, эллипсоид, масштаб карты.", "k": "<ol><li><b>Сущность<\/b>: изображение поверхности Земли на плоскости с <b>уменьшением<\/b> (масштаб), <b>обобщением<\/b> и <b>условными знаками<\/b>, с учётом <b>кривизны Земли<\/b> (проекция)<\/li><li><b>Свойства<\/b>: <b>точность, наглядность, измеримость, полнота и подробность<\/b><\/li><li><b>Топографическая карта<\/b> — уменьшенное обобщённое изображение местности с учётом кривизны Земли (в РФ — проекция Гаусса)<\/li><li><b>План<\/b> — изображение <b>небольшого участка<\/b> без учёта кривизны Земли, в крупном масштабе<\/li><li><b>Уровенная поверхность<\/b> — в каждой точке <b>перпендикулярна отвесной линии<\/b> (спокойная поверхность океанов, продолженная под материками) → фигура <b>геоид<\/b><\/li><li><b>Эллипсоид<\/b> — математическая фигура, близкая к геоиду; в РФ — <b>эллипсоид Красовского<\/b><\/li><li><b>Масштаб<\/b> — степень уменьшения: <b>численный<\/b> (1:50 000), <b>именованный<\/b> (в 1 см 500 м), <b>линейный<\/b><\/li><\/ol>", "cnt": 7, "m": "Свойства «ТНИП»: Точность, Наглядность, Измеримость, Полнота", "d": "<ul><li>Измеримость — по карте определяют координаты, расстояния, площади, высоты, углы.<\/li><li>Эллипсоид Красовского: большая полуось ≈ 6 378 245 м, сжатие ≈ 1 : 298,3.<\/li><li>Чем больше знаменатель масштаба, тем мельче масштаб и меньше подробностей.<\/li><\/ul>"}, {"n": "31", "day": 4, "dayTitle": "Топография и документы", "q": "Разграфка и номенклатура топографических карт. Определение номенклатуры смежных листов.", "k": "<ol><li><b>Разграфка<\/b> — деление карты на листы; <b>номенклатура<\/b> — обозначение листа<\/li><li><b>1:1 000 000<\/b> — лист <b>4° × 6°<\/b>; <b>ряды<\/b> — латинские буквы A–V от экватора, <b>колонны<\/b> 1–⁠60 от меридиана 180°: <b>N‑37<\/b> (Москва), <b>N‑44<\/b> (Барнаул)<\/li><li><b>1:500 000<\/b> — 4 листа: N‑37‑<b>Б<\/b> (А, Б, В, Г)<\/li><li><b>1:200 000<\/b> — 36 листов: N‑37‑<b>XII<\/b> (I–⁠XXXVI)<\/li><li><b>1:100 000<\/b> — 144 листа: N‑37‑<b>144<\/b> (1–⁠144)<\/li><li><b>1:50 000<\/b> — 4 листа от 1:100 000: N‑37‑144‑<b>А<\/b><\/li><li><b>1:25 000<\/b> — 4 листа от 1:50 000: N‑37‑144‑А‑<b>а<\/b><\/li><li><b>1:10 000<\/b> — 4 листа от 1:25 000: N‑37‑144‑А‑а‑<b>1<\/b><\/li><li><b>Смежные листы 1:100 000<\/b> (сетка 12×12): <b>север n−12, юг n+12, запад n−1, восток n+1<\/b><\/li><\/ol>", "cnt": 9, "m": "4 → 36 → 144, дальше всё по 4: А, а, 1", "d": "<ul><li>Пример: N‑37‑56 → север N‑37‑44, юг N‑37‑68, запад N‑37‑55, восток N‑37‑57.<\/li><li>На краю миллионного листа переходят на соседний: например, к северу от N‑37‑5 лежит O‑37‑137.<\/li><li>Размеры: 1:500 000 — 2°×3°; 1:200 000 — 40'×1°; 1:100 000 — 20'×30'; 1:50 000 — 10'×15'; 1:25 000 — 5'×7'30\".<\/li><li>Листы внутри миллионного нумеруют слева направо и сверху вниз.<\/li><\/ul>"}, {"n": "32", "day": 4, "dayTitle": "Топография и документы", "q": "Виды условных знаков, цветовое оформление карт, пояснительные подписи и цифровые обозначения.", "k": "<div class=\"sub\">Виды знаков<\/div><ol><li><b>Масштабные (контурные)<\/b> — объекты в масштабе карты: лес, озеро<\/li><li><b>Внемасштабные<\/b> — мелкие объекты: колодец, отдельное дерево<\/li><li><b>Линейные<\/b> — дороги, реки, ЛЭП<\/li><li><b>Пояснительные<\/b> — доп. характеристика: порода леса, направление течения<\/li><\/ol><div class=\"sub\">Цвета<\/div><ol><li><b>Чёрный<\/b> — контуры, постройки, подписи; <b>коричневый<\/b> — рельеф; <b>синий<\/b> — вода; <b>зелёный<\/b> — растительность; <b>оранжевый<\/b> — шоссе, огнестойкие кварталы; <b>жёлтый<\/b> — улучшенные грунтовые дороги, неогнестойкие кварталы<\/li><\/ol><div class=\"sub\">Подписи и цифры<\/div><ol><li><b>Собственные названия<\/b> и <b>пояснительные<\/b> подписи; цифрами — <b>высоты<\/b>, ширина, глубина и скорость <b>реки<\/b>, <b>мосты<\/b> (длина, ширина, грузоподъёмность), <b>лес<\/b> (высота, толщина, расстояние между деревьями), <b>дороги<\/b><\/li><\/ol>", "cnt": 6, "m": "", "d": "<ul><li>У внемасштабного знака положение объекта — центр (главная точка) знака.<\/li><li>Лес — дробью: в числителе средняя высота деревьев, в знаменателе толщина стволов, справа — расстояние между деревьями (в метрах).<\/li><li>Мост — материал, длина × ширина, грузоподъёмность в тоннах.<\/li><\/ul>"}, {"n": "33", "day": 4, "dayTitle": "Топография и документы", "q": "Виды боевых графических документов, составляемых в подразделениях, их назначение.", "k": "<ol><li><b>Рабочая карта командира<\/b> — основной документ: обстановка, решение, задачи, ход боя<\/li><li><b>Схема опорного пункта<\/b> (района обороны) — позиции, система огня, заграждения<\/li><li><b>Карточка огня<\/b> (взвода, отделения, танка, БМП) — ориентиры, секторы, рубежи огня, дальности<\/li><li><b>Схема ориентиров<\/b> — ориентиры с номерами и расстояниями<\/li><li>Также: <b>схема маршрута<\/b> (движение по азимутам), схема наблюдения, разведки<\/li><\/ol>", "cnt": 5, "m": "", "d": "<ul><li>Графические документы быстро и наглядно передают обстановку и решение.<\/li><li>Карточку огня составляет командир взвода, отделения, танка в обороне.<\/li><li>Все документы — аккуратно, принятыми знаками, с указанием времени.<\/li><\/ul>"}, {"n": "34", "day": 4, "dayTitle": "Топография и документы", "q": "Содержание рабочей карты командира, порядок и правила её ведения.", "k": "<ol><li><b>Содержание<\/b>: полученная <b>задача<\/b>; <b>противник<\/b>; положение <b>своих и соседей<\/b>; <b>решение<\/b> (замысел, задачи подчинённым); вопросы <b>взаимодействия<\/b>; <b>ориентиры, разграничительные линии, рубежи, маршруты<\/b>; изменения в ходе боя<\/li><li><b>Порядок<\/b>: подготовка карты (<b>склейка, подъём<\/b> важных элементов) → нанесение задачи и обстановки → нанесение решения → ведение в ходе боя<\/li><li><b>Правила<\/b>: ведёт <b>лично командир<\/b>; <b>точно, наглядно, аккуратно, своевременно<\/b>; только <b>принятые знаки и сокращения<\/b>; с указанием <b>времени<\/b>; надписи параллельно <b>северной рамке<\/b>; в заголовке — что за карта, <b>должность, звание, подпись<\/b>, гриф<\/li><\/ol>", "cnt": 3, "m": "", "d": "<ul><li>Подъём карты — выделение цветом дорог, рек, населённых пунктов, высот, важных для задачи.<\/li><li>Карту не загромождают: только то, что нужно для управления.<\/li><li>Устаревшую обстановку не стирают, а помечают временем — видно ход боя.<\/li><\/ul>"}, {"n": "35", "day": 4, "dayTitle": "Топография и документы", "q": "Тактические условные знаки и сокращённые обозначения, надписи на картах, нанесение обстановки на карту.", "k": "<ol><li><b>Цвета<\/b>: <b>красный<\/b> — свои войска (общевойсковые подразделения, их позиции и действия); <b>чёрный<\/b> — артиллерия, спецвойска, заграждения, надписи; <b>синий<\/b> — противник<\/li><li><b>Знаки<\/b> показывают: <b>подразделения<\/b>, <b>позиции и районы<\/b>, <b>рубежи и направления<\/b> действий (стрелки), <b>огневые средства<\/b>, <b>заграждения<\/b>, <b>пункты управления<\/b><\/li><li><b>Надписи<\/b>: только принятые <b>сокращения<\/b>, параллельно северу, на свободных местах, с <b>временем<\/b> положения<\/li><li><b>Нанесение<\/b>: точно по месту, ориентируясь на местные предметы; обстановку на разное время — с подписью времени<\/li><\/ol>", "cnt": 4, "m": "", "d": "<ul><li>Центр (основание) знака совпадает с фактическим положением объекта.<\/li><li>Планируемое (предполагаемое) положение — прерывистой линией, фактическое — сплошной.<\/li><li>Направления действий — стрелками: наступление, контратака, отход.<\/li><li>Цветовую схему сверь с конспектом: в пособиях её детализируют по-разному.<\/li><\/ul>"}, {"n": "36", "day": 5, "dayTitle": "Связь", "q": "Задачи связи.", "k": "<ol><li>Главная задача — <b>обеспечение управления<\/b> подразделениями в <b>любой обстановке<\/b><\/li><li>Своевременная <b>передача приказов, команд и сигналов<\/b><\/li><li><b>Сбор донесений<\/b> и докладов<\/li><li><b>Оповещение<\/b> о противнике, ударах с воздуха, БпЛА, ОМП<\/li><li>Обеспечение <b>взаимодействия<\/b> с соседями, артиллерией, авиацией<\/li><\/ol>", "cnt": 5, "m": "", "d": "<ul><li>Связь — основное средство управления; без неё командир теряет влияние на бой.<\/li><li>Организуется по решению командира и указаниям старшего штаба.<\/li><li>Средства: радио, проводные, подвижные (посыльные), сигнальные.<\/li><\/ul>"}, {"n": "37", "day": 5, "dayTitle": "Связь", "q": "Требования, предъявляемые к связи.", "k": "<ol><li><b>Своевременность<\/b> — информация передаётся в установленные сроки<\/li><li><b>Достоверность<\/b> — принимается без искажений<\/li><li><b>Безопасность (скрытность)<\/b> — противник не получает сведений из переговоров и не может засечь средства связи<\/li><li><b>Надёжность (устойчивость)<\/b> — работа при помехах, ударах, перемещениях; живучесть и помехоустойчивость<\/li><\/ol>", "cnt": 4, "m": "«СДБН» — Связь Должна Быть Надёжной", "d": "<ul><li>Как достигается: дублирование каналов, запасные частоты, ДКС и засекречивающая аппаратура, дисциплина связи.<\/li><li>Безопасность нарушают переговоры открытым текстом и лишние выходы в эфир: по ним противник пеленгует станцию и наводит удар.<\/li><\/ul>"}, {"n": "38", "day": 5, "dayTitle": "Связь", "q": "Правила установления связи, передачи и подтверждения сигнала и радиограммы.", "k": "<ol><li><b>Установление связи<\/b>: в радиосети связь устанавливает <b>главная станция<\/b>; подчинённые отвечают по очереди<\/li><li><b>Вызов<\/b>: «<b>Сосна, я Береза, как слышите? Приём<\/b>» → «<b>Береза, я Сосна, слышу хорошо, приём<\/b>»<\/li><li><b>Сигнал<\/b>: «Сосна, я Береза, <b>333, 333<\/b>, приём» → подтверждение <b>повторением сигнала<\/b>: «Береза, я Сосна, 333, приём»<\/li><li><b>Радиограмма<\/b>: вызов → «<b>радиограмма<\/b>» → номер, число групп, <b>текст<\/b> → «приём»; <b>квитанция<\/b>: «Береза, я Сосна, <b>номер радиограммы<\/b>, приём»<\/li><li><b>Правила<\/b>: только <b>позывные и назначенные частоты<\/b>, работа по <b>ДКС<\/b>, кратко; <b>без открытого текста<\/b> о войсках; соблюдать <b>радиомолчание<\/b><\/li><\/ol>", "cnt": 5, "m": "", "d": "<ul><li>Позывные, частоты, время перехода на запасные частоты — в радиоданных.<\/li><li>Сигналы — по таблице сигналов, текст — по переговорной таблице, координаты — по кодированной карте.<\/li><li>Минимум времени на передачу — противник пеленгует станции.<\/li><li>Точные слова и форму квитанции сверь с тем, как учили на занятиях по связи.<\/li><\/ul>"}, {"n": "39", "day": 5, "dayTitle": "Связь", "q": "Радиосеть, радионаправление, направление проводной связи, ось проводной связи.", "k": "<ol><li><b>Радиосеть<\/b> — связь <b>одного<\/b> командира (главной станции) с <b>несколькими<\/b> корреспондентами на <b>общей частоте<\/b><\/li><li><b>Радионаправление<\/b> — связь <b>между двумя<\/b> радиостанциями<\/li><li><b>Направление проводной связи<\/b> — линия от пункта управления старшего к <b>одному<\/b> пункту подчинённого<\/li><li><b>Ось проводной связи<\/b> — линия, проложенная в направлении <b>перемещения ПУ<\/b> старшего; ПУ подчинённых <b>подключаются к ней отводами<\/b><\/li><\/ol>", "cnt": 4, "m": "Сеть — один со многими; направление — один с одним; ось — линия вслед за КП", "d": "<ul><li>Радиосеть экономит частоты и позволяет дать команду всем сразу (циркулярно).<\/li><li>Радионаправление надёжнее и быстрее для важного корреспондента, но занимает отдельную частоту.<\/li><li>Ось удобна в наступлении: линию наращивают по мере продвижения КП.<\/li><\/ul>"}, {"n": "40", "day": 5, "dayTitle": "Связь", "q": "Назначение, характеристика, общее устройство радиостанций Р‑173 и Р‑123М.", "k": "<ol><li><b>Назначение<\/b>: беспоисковая бесподстроечная <b>телефонная связь<\/b> между подвижными объектами (танки, БМП) в тактическом звене — <b>на стоянке и в движении<\/b><\/li><li><b>Тип<\/b>: УКВ, <b>симплексные<\/b>, с <b>частотной модуляцией<\/b>, возимые<\/li><li><b>Р‑173<\/b>: <b>30–⁠75,999 МГц<\/b>, шаг <b>1 кГц<\/b>, <b>10 ЗПЧ<\/b>, мощность <b>≥ 30 Вт<\/b>, дальность <b>до 20 км<\/b>, питание <b>27 В<\/b><\/li><li><b>Р‑123М<\/b>: <b>20–⁠51,5 МГц<\/b> (2 поддиапазона: 20–⁠35,75 и 35,75–⁠51,5), шаг <b>25 кГц<\/b> (1261 частота), <b>4 ЗПЧ<\/b>, мощность <b>≥ 20 Вт<\/b>, дальность <b>до 20 км<\/b> (с включённым шумоподавителем ≈ 13 км), питание <b>26 В<\/b><\/li><li><b>Устройство<\/b>: <b>приёмопередатчик<\/b>, <b>блок питания<\/b> (у Р‑123М), <b>антенное устройство и штыри<\/b>, <b>блок антенных фильтров<\/b>, ВЧ- и НЧ-кабели, <b>нагрудный переключатель<\/b>, ларингофоны (шлемофон), ЗИП<\/li><\/ol>", "cnt": 5, "m": "У 173‑й всё больше: 30–⁠76 МГц, 10 ЗПЧ, 30 Вт. У 123М: 20–⁠51,5 МГц, 4 ЗПЧ, 20 Вт", "d": "<ul><li>Р‑173 — более современная станция (цифровой набор частоты), пришла на смену Р‑123М.<\/li><li>ЗПЧ — заранее подготовленные частоты: переход одним переключателем, без перестройки.<\/li><li>Дальность — для штыревой антенны на средне-пересечённой местности.<\/li><\/ul>"}, {"n": "41", "day": 5, "dayTitle": "Связь", "q": "Документы кодированной связи, их классификация и предназначение.", "k": "<ol><li><b>ДКС<\/b> — для <b>скрытия содержания<\/b> переговоров и <b>сокращения времени<\/b> передачи<\/li><li><b>Переговорные таблицы<\/b> — кодирование типовых слов и фраз (команд, докладов)<\/li><li><b>Таблицы сигналов<\/b> — кодированные сигналы (цифровые, словесные) для управления и оповещения<\/li><li><b>Кодированные карты<\/b> (кодировочные таблицы к карте) — кодирование <b>координат<\/b> и местности<\/li><li><b>Таблицы позывных<\/b> и <b>радиоданные<\/b> — скрытие принадлежности и должностей корреспондентов<\/li><\/ol>", "cnt": 5, "m": "", "d": "<ul><li>ДКС выдают под роспись, хранят и уничтожают по правилам; при угрозе захвата — уничтожают.<\/li><li>Срок действия ограничен, по истечении их меняют.<\/li><li>Набор документов может отличаться — ориентируйся на те, с которыми работали на занятиях.<\/li><\/ul>"}, {"n": "П1", "day": 5, "dayTitle": "Связь", "q": "Практика 1. Кодирование (раскодирование) радиограмм и сигналов (команд).", "k": "<ol><li>Составить текст <b>кратко<\/b><\/li><li>Типовые слова и фразы → <b>коды по переговорной таблице<\/b><\/li><li><b>Координаты<\/b> → по <b>кодированной карте<\/b><\/li><li><b>Сигналы и команды<\/b> → по <b>таблице сигналов<\/b><\/li><li>Проверить, проставить <b>номер, время<\/b>, позывной<\/li><li><b>Раскодирование<\/b> — в <b>обратном порядке<\/b>, по тем же документам<\/li><li>Проверить, что <b>не осталось открытых<\/b> сведений о войсках<\/li><\/ol>", "cnt": 7, "m": "", "d": "<ul><li>Тренируйся на скорость: на зачёте обычно дают типовой текст.<\/li><li>Частые ошибки: перепутаны строка и столбец таблицы, ошибка в координатах, лишний открытый текст.<\/li><\/ul>"}, {"n": "П2", "day": 5, "dayTitle": "Связь", "q": "Практика 2. Работа на радиостанциях с использованием документов кодированной связи.", "k": "<ol><li>Подготовить станцию, получить <b>радиоданные<\/b> (частоты, позывные) и <b>ДКС<\/b><\/li><li><b>Войти в связь<\/b> по правилам: вызов, ответ, оценка слышимости<\/li><li>Передавать <b>сигналы и радиограммы<\/b> только в <b>закодированном<\/b> виде<\/li><li><b>Подтверждать<\/b> приём: квитанция, повтор сигнала<\/li><li>Соблюдать <b>дисциплину связи<\/b>: кратко, позывными, без открытого текста<\/li><\/ol>", "cnt": 5, "m": "", "d": "<ul><li>Это связка вопросов 38 и 41 и практики 1: сначала закодировал, потом передал по правилам.<\/li><\/ul>"}, {"n": "П3", "day": 5, "dayTitle": "Связь", "q": "Практика 3. Подготовка к работе радиостанции Р‑123М. Норматив по связи № 34.", "k": "<ol><li><b>Внешний осмотр<\/b>, проверка <b>комплектности<\/b><\/li><li><b>Подключить<\/b> антенну, кабели, блок питания, шлемофон (нагрудный переключатель)<\/li><li><b>Включить питание<\/b>, дать <b>прогреться<\/b>, проверить работу (шумы в телефонах)<\/li><li><b>Настроить ЗПЧ<\/b>: плавный поддиапазон → частота по шкале → <b>зафиксировать<\/b> → проверить переход на ЗПЧ<\/li><li><b>Настроить антенну<\/b> по максимуму индикатора<\/li><li><b>Проверить связь<\/b>, доложить о готовности<\/li><\/ol>", "cnt": 6, "m": "", "d": "<ul><li>Время на оценки норматива № 34 уточни у преподавателя и впиши сюда (в Anki: ⋮ → Редактировать).<\/li><li>Названия переключателей — как на занятии; отработай руками 5–⁠10 раз.<\/li><\/ul>"}, {"n": "П4", "day": 5, "dayTitle": "Связь", "q": "Практика 4. Настройка частот радиостанции Р‑173. Норматив по связи № 35.", "k": "<ol><li><b>Включить<\/b> станцию, проверить работоспособность<\/li><li><b>Набрать частоту<\/b> наборными переключателями (МГц и кГц)<\/li><li><b>Записать<\/b> её в выбранную <b>ЗПЧ<\/b> (всего 10)<\/li><li>Повторить для остальных ЗПЧ по радиоданным<\/li><li><b>Проверить<\/b>: пройти по ЗПЧ, сверить частоты, проверить связь<\/li><\/ol>", "cnt": 5, "m": "", "d": "<ul><li>Время на оценки норматива № 35 уточни у преподавателя и впиши сюда.<\/li><li>Главное — без ошибки в цифре: одна неверная цифра = нет связи.<\/li><\/ul>"}, {"n": "42", "day": 6, "dayTitle": "ОМП и защита", "q": "Виды ядерных взрывов. Поражающие факторы ядерных взрывов.", "k": "<ol><li><b>Виды<\/b>: <b>высотный<\/b> (выше 10 км), <b>воздушный<\/b>, <b>наземный<\/b>, <b>надводный<\/b>, <b>подземный<\/b>, <b>подводный<\/b><\/li><\/ol><div class=\"sub\">Поражающие факторы (≈ доля энергии)<\/div><ol><li><b>Ударная волна<\/b> — ~50%<\/li><li><b>Световое излучение<\/b> — ~35%<\/li><li><b>Проникающая радиация<\/b> — ~4–⁠5%<\/li><li><b>Радиоактивное заражение<\/b> — ~10%<\/li><li><b>Электромагнитный импульс<\/b> — ~1%<\/li><\/ol>", "cnt": 6, "m": "«УСПРЭ»: Ударная, Световое, Проникающая, Радиоактивное, ЭМИ", "d": "<ul><li>Воздушный: светящаяся область не касается земли; сильнее ударная волна и световое излучение, заражение местности слабое.<\/li><li>Наземный: сильное радиоактивное заражение по следу облака.<\/li><li>Ударная волна — резкое сжатие воздуха; защищают укрытия и складки местности.<\/li><li>Световое излучение — ожоги, ослепление, пожары; защищает любая непрозрачная преграда.<\/li><li>Проникающая радиация — гамма-излучение и нейтроны в первые секунды; лучевая болезнь.<\/li><li>ЭМИ — выводит из строя электронику и связь.<\/li><\/ul>"}, {"n": "43", "day": 6, "dayTitle": "ОМП и защита", "q": "Химическое оружие. Классификация и характеристика отравляющих веществ.", "k": "<ol><li><b>Химическое оружие<\/b> — <b>отравляющие вещества (ОВ)<\/b> + <b>средства их применения<\/b> (снаряды, мины, авиабомбы, ракеты, выливные приборы)<\/li><\/ol><div class=\"sub\">По действию на организм<\/div><ol><li><b>Нервно-паралитические<\/b>: зарин, зоман, V-газы<\/li><li><b>Кожно-нарывные<\/b>: иприт, люизит<\/li><li><b>Общеядовитые<\/b>: синильная кислота, хлорциан<\/li><li><b>Удушающие<\/b>: фосген, дифосген<\/li><li><b>Психохимические<\/b>: Би-Зет<\/li><li><b>Раздражающие<\/b>: Си-Эс, Си-Ар, адамсит<\/li><\/ol><div class=\"sub\">Другие признаки<\/div><ol><li><b>По назначению<\/b>: смертельные, временно выводящие из строя, раздражающие; <b>по быстроте<\/b>: быстро- и медленнодействующие; <b>по стойкости<\/b>: стойкие и нестойкие<\/li><\/ol>", "cnt": 8, "m": "«Нам Копать Окопы Утром, Пока Рано»: Нервно-паралит., Кожно-нарывные, Общеядовитые, Удушающие, Психохимические, Раздражающие", "d": "<ul><li>Нервно-паралитические — самые токсичные: сужение зрачков, слюнотечение, затруднённое дыхание, судороги.<\/li><li>Кожно-нарывные — поражают кожу, глаза, органы дыхания; есть скрытый период.<\/li><li>Общеядовитые — нарушают усвоение кислорода тканями, действуют очень быстро.<\/li><li>Удушающие — поражают лёгкие (отёк), скрытый период несколько часов.<\/li><li>Стойкие ОВ опасны часами и сутками (V-газы, иприт), нестойкие — минутами (синильная кислота, фосген).<\/li><li>Защита: противогаз, ОЗК, своевременное оповещение, антидот из аптечки.<\/li><\/ul>"}, {"n": "44", "day": 6, "dayTitle": "ОМП и защита", "q": "Биологическое оружие. Виды, поражающие свойства и средства применения биологического оружия.", "k": "<ol><li><b>Биологическое оружие<\/b> — <b>биологические средства<\/b> (болезнетворные микроорганизмы и токсины) + <b>средства доставки<\/b><\/li><li><b>Виды<\/b>: <b>бактерии<\/b> (чума, сибирская язва, туляремия, холера), <b>вирусы<\/b> (натуральная оспа, жёлтая лихорадка), <b>риккетсии<\/b> (сыпной тиф, Ку-лихорадка), <b>грибки<\/b>, <b>токсины<\/b> (ботулотоксин)<\/li><li><b>Поражающие свойства<\/b>: действие в <b>малых дозах<\/b>, <b>заразность<\/b> (эпидемии), <b>инкубационный период<\/b>, <b>трудность обнаружения<\/b>, <b>длительность действия<\/b>, проникновение в негерметичные помещения, <b>психологическое<\/b> воздействие<\/li><li><b>Средства применения<\/b>: <b>авиабомбы и кассеты<\/b>, <b>ракеты<\/b>, <b>распылители и аэрозольные генераторы<\/b>, <b>заражённые переносчики<\/b> (насекомые, клещи, грызуны), диверсионные способы<\/li><\/ol>", "cnt": 4, "m": "Виды «БВРГТ»: Бактерии, Вирусы, Риккетсии, Грибки, Токсины", "d": "<ul><li>Основной способ — аэрозольный (заражение приземного слоя воздуха).<\/li><li>Признаки применения: глухие разрывы боеприпасов, полосы дыма или тумана, необычное скопление насекомых и клещей, массовые заболевания людей и животных.<\/li><li>Защита: противогаз и средства защиты кожи, прививки, экстренная профилактика, обсервация и карантин.<\/li><\/ul>"}, {"n": "45", "day": 6, "dayTitle": "ОМП и защита", "q": "Зажигательное оружие. Зажигательные вещества и смеси, средства их боевого применения.", "k": "<ol><li><b>Зажигательное оружие<\/b> — <b>зажигательные вещества<\/b> + <b>средства их применения<\/b><\/li><\/ol><div class=\"sub\">Вещества и смеси<\/div><ol><li><b>Напалмы<\/b> — на основе нефтепродуктов (загущённые и незагущённые)<\/li><li><b>Пирогели<\/b> — металлизированные смеси<\/li><li><b>Термит<\/b> и термитные составы<\/li><li><b>Белый фосфор<\/b> (и пластифицированный)<\/li><li><b>Самовоспламеняющиеся<\/b> смеси, <b>электрон<\/b> (сплав магния)<\/li><\/ol><div class=\"sub\">Средства применения<\/div><ol><li><b>Зажигательные авиабомбы и баки<\/b>, кассеты, <b>огнемёты<\/b> (ранцевые, реактивные пехотные), <b>снаряды, мины, ракеты, гранаты<\/b>, огневые фугасы<\/li><\/ol>", "cnt": 7, "m": "Н-П-Т-Ф: Напалм, Пирогель, Термит, Фосфор", "d": "<ul><li>Поражение: ожоги, пожары, отравление продуктами горения, сильное психологическое воздействие.<\/li><li>Температура горения: напалм ~1000–⁠1200 °C, термит ~3000 °C.<\/li><li>Фосфор самовоспламеняется на воздухе; на коже гасят водой или мокрой тканью.<\/li><li>Защита: укрытия с перекрытием, ОЗК, плащ-накидка, противопожарные меры, быстро сбросить горящую смесь.<\/li><\/ul>"}, {"n": "П5", "day": 6, "dayTitle": "ОМП и защита", "q": "Практика 5. Надевание противогаза. Норматив по ЗОМП № 1.", "k": "<ol><li>По команде «<b>Газы!<\/b>»: <b>задержать дыхание<\/b>, <b>закрыть глаза<\/b><\/li><li>Снять головной убор, вынуть противогаз из сумки<\/li><li>Взять шлем-маску за утолщённые края, <b>приложить к подбородку<\/b>, резко <b>вверх и назад<\/b> натянуть на голову<\/li><li>Без складок, очковый узел — против глаз<\/li><li><b>Полный выдох<\/b>, открыть глаза, возобновить дыхание<\/li><li>Надеть головной убор, закрепить сумку<\/li><li><b>Время<\/b>: отлично <b>7 с<\/b>, хорошо <b>8 с<\/b>, удовл. <b>10 с<\/b> (сверь с преподавателем)<\/li><\/ol>", "cnt": 7, "m": "", "d": "<ul><li>Снижают оценку: не закрыты глаза и не задержано дыхание, не сделан выдох после надевания.<\/li><li>«Неуд»: шлем-маска с перекосом или неплотно прилегает, перекручена соединительная трубка.<\/li><li>Тренировка: 10–⁠15 раз подряд с секундомером на телефоне.<\/li><\/ul>"}, {"n": "П6", "day": 6, "dayTitle": "ОМП и защита", "q": "Практика 6. Надевание ОЗК. Нормативы по ЗОМП № 4А, 4Б.", "k": "<ol><li><b>4А — «Плащ в рукава. Газы!»<\/b>: чулки → противогаз → перчатки → плащ в рукава<\/li><li>Время 4А: отлично <b>3 мин<\/b>, хорошо <b>3 мин 20 с<\/b>, удовл. <b>4 мин<\/b><\/li><li><b>4Б — «Защитный костюм надеть. Газы!»<\/b>: чулки → плащ в виде комбинезона → противогаз → подшлемник → перчатки<\/li><li>Время 4Б: отлично <b>4 мин 35 с<\/b>, хорошо <b>5 мин<\/b>, удовл. <b>6 мин<\/b><\/li><li><b>«Неуд»<\/b>: не застёгнуто <b>более двух шпеньков<\/b> или грубые ошибки с противогазом<\/li><\/ol>", "cnt": 5, "m": "", "d": "<ul><li>Время — от подачи команды до полного надевания.<\/li><li>Оценку снижают на балл: не полностью выполнены отдельные операции, ошибки при надевании противогаза.<\/li><li>Больше всего времени теряют на чулках и шпеньках — отработай их отдельно.<\/li><\/ul>"}, {"n": "П7", "day": 6, "dayTitle": "ОМП и защита", "q": "Практика 7. Подготовка дозиметрических приборов к работе и проверка их работоспособности. Норматив по ЗОМП № 10.", "k": "<ol><li><b>Внешний осмотр<\/b>, проверка <b>комплектности<\/b><\/li><li>Установить <b>источники питания<\/b>, соблюдая полярность<\/li><li><b>Включить<\/b>, проверить <b>режим питания<\/b> (стрелка в режимном секторе или индикация)<\/li><li>Проверить работоспособность по <b>контрольному источнику<\/b> (ДП‑5В: экран зонда в положение «К», щелчки в телефонах, отклонение стрелки)<\/li><li>Установить нужный <b>поддиапазон<\/b>, доложить о готовности<\/li><li><b>Время<\/b> — уточни у преподавателя<\/li><\/ol>", "cnt": 6, "m": "", "d": "<ul><li>Прибор в вашем ВУЦ может быть другим (ДП‑5В, ИМД‑1 и др.): порядок общий, названия переключателей — по инструкции.<\/li><li>Дозиметрические приборы измеряют мощность дозы (уровень радиации) и заражённость поверхностей.<\/li><\/ul>"}, {"n": "П8", "day": 6, "dayTitle": "ОМП и защита", "q": "Практика 8. Подготовка приборов химической разведки к работе и определение ОВ противника. Норматив по ЗОМП № 11.", "k": "<ol><li><b>Прибор ВПХР<\/b>: ручной насос, <b>индикаторные трубки<\/b>, насадка, защитные колпачки, грелка<\/li><li><b>Трубки<\/b>: <b>красное кольцо и точка<\/b> — нервно-паралитические (зарин, зоман, V-газы); <b>три зелёных кольца<\/b> — фосген, синильная кислота, хлорциан; <b>одно жёлтое<\/b> — иприт<\/li><li><b>Порядок<\/b>: подготовить прибор → вскрыть трубку (для нервно-паралитических — <b>опытную и контрольную<\/b>) → разбить ампулы → вставить в насос и <b>прокачать воздух<\/b> → <b>сравнить окраску<\/b> с контрольной трубкой или эталоном<\/li><li>Сначала определяют <b>опасные концентрации<\/b> нервно-паралитических ОВ, затем остальные<\/li><li><b>Время<\/b> — уточни у преподавателя<\/li><\/ol>", "cnt": 5, "m": "", "d": "<ul><li>Ориентировочно число качаний: красная — 5–⁠6, три зелёные — 10–⁠15, жёлтая — 60. Сверь с инструкцией.<\/li><li>Работают в противогазе; концы трубок надрезают ножом на головке насоса.<\/li><li>Для нервно-паралитических: если опытная трубка осталась красной, а контрольная пожелтела — ОВ есть.<\/li><\/ul>"}]}</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("data").textContent);
  var CARDS = DATA.cards, DAYS = DATA.days;
  var BY = {}; CARDS.forEach(function (c) { BY[c.n] = c; });
  var KEY = "taktika-vuc-progress-v1";
  var MIN = 60000, AHEAD = 20 * MIN, MAXIVL = 4;
  var app = document.getElementById("app");

  var state = { cards: {} };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var p = JSON.parse(raw); if (p && p.cards) state = p; }
  } catch (e) {}

  // ── расписание повторений ──
  function dayAt(d) {
    var x = new Date();
    if (x.getHours() < 4) x.setDate(x.getDate() - 1);
    x.setHours(4, 0, 0, 0);
    x.setDate(x.getDate() + d);
    return x.getTime();
  }
  function next(s, g) {
    var now = Date.now();
    var st = s ? JSON.parse(JSON.stringify(s)) : { phase: "new", ivl: 0, reps: 0, lapses: 0, step: 0 };
    st.reps += 1; st.t = now;
    if (st.phase === "review") {
      if (g === 0) { st.lapses += 1; st.phase = "learn"; st.step = 0; st.due = now + 10 * MIN; }
      else {
        var f = [0, 1.2, 2.2, 3][g];
        var ivl = Math.round(st.ivl * f);
        if (g > 1) ivl = Math.max(ivl, st.ivl + 1);
        st.ivl = Math.min(MAXIVL, Math.max(1, ivl));
        st.due = dayAt(st.ivl);
      }
    } else {
      if (g === 0) { st.phase = "learn"; st.step = 0; st.due = now + MIN; }
      else if (g === 1) { st.phase = "learn"; st.due = now + 6 * MIN; }
      else if (g === 2) {
        if (st.phase === "new" || (st.step || 0) < 1) { st.phase = "learn"; st.step = 1; st.due = now + 10 * MIN; }
        else { st.phase = "review"; st.ivl = 1; st.due = dayAt(1); }
      } else { st.phase = "review"; st.ivl = st.lapses ? 2 : 3; st.due = dayAt(st.ivl); }
    }
    return st;
  }
  function label(st) {
    if (st.phase === "review") return st.ivl + " д";
    var m = Math.max(1, Math.round((st.due - Date.now()) / MIN));
    return m + " мин";
  }
  function phaseOf(n) { var s = state.cards[n]; return s ? s.phase : "new"; }
  function isDue(n) { var s = state.cards[n]; return !!s && s.due <= Date.now(); }

  // ── сохранение ──
  var dbRef = null, saving = false, dirty = false, saveTimer = null, retried = false;
  var store = "local";
  function persistLocal() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function scheduleSave() {
    persistLocal();
    if (!dbRef) return;
    dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700);
  }
  function flush() {
    if (saving || !dirty || !dbRef) return;
    saving = true; dirty = false;
    dbRef.set({ v: 1, cards: state.cards, updated: Date.now() }).then(function () {
      retried = false; saving = false; if (dirty) flush();
    }, function (e) {
      saving = false;
      if (e && e.code === "unavailable" && !retried) { retried = true; dirty = true; setTimeout(flush, 1200 + Math.random() * 1200); }
      else { dbRef = null; store = "local"; if (view === "home") render(); }
    });
  }
  function mergeCards(remote) {
    var changed = false;
    Object.keys(remote || {}).forEach(function (n) {
      if (!BY[n]) return;
      var r = remote[n], l = state.cards[n];
      if (!l || (r && r.t > (l.t || 0))) { state.cards[n] = r; changed = true; }
    });
    return changed;
  }
  // ── состояние экрана ──
  var view = "home", S = null, confirmReset = false;

  function dayStats(d) {
    var list = CARDS.filter(function (c) { return c.day === d; });
    var st = { total: list.length, nNew: 0, due: 0, ok: 0, lrn: 0 };
    list.forEach(function (c) {
      var ph = phaseOf(c.n);
      if (ph === "new") st.nNew++; else if (ph === "review") st.ok++; else st.lrn++;
      if (isDue(c.n)) st.due++;
    });
    return st;
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (ch) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]; }); }

  function renderHome() {
    var total = CARDS.length, ok = 0, lrn = 0, dueAll = 0;
    CARDS.forEach(function (c) {
      var ph = phaseOf(c.n);
      if (ph === "review") ok++; else if (ph === "learn") lrn++;
      if (isDue(c.n)) dueAll++;
    });
    var nowDay = 0;
    for (var i = 0; i < DAYS.length; i++) { if (dayStats(DAYS[i].n).nNew > 0) { nowDay = DAYS[i].n; break; } }

    var main;
    if (dueAll > 0) main = '<button class="btn btn-main" id="b-review" data-act="review">Повторить сейчас · ' + dueAll + '</button>';
    else if (nowDay) main = '<button class="btn btn-main" data-act="learn" data-day="' + nowDay + '">Учить день ' + nowDay + '</button>';
    else main = '<button class="btn btn-main" data-act="cram" data-day="0">Прогон всех вопросов</button>';

    var h = '<header class="hero">' +
      '<div class="eyebrow">Тактическая подготовка · вопросы к зачёту</div>' +
      '<h1>Зачёт по тактике</h1>' +
      '<div class="stat"><b>' + ok + '</b> выучено из ' + total + (lrn ? ' · в работе <b>' + lrn + '</b>' : '') + '</div>' +
      '<div class="bar" role="img" aria-label="Выучено ' + ok + ' из ' + total + '"><i class="ok" style="width:' + (ok / total * 100) + '%"></i><i class="lrn" style="width:' + (lrn / total * 100) + '%"></i></div>' +
      '<div class="legend"><span><i class="l0"></i>не начато</span><span><i class="l1"></i>учу</span><span><i class="l2"></i>выучено</span></div>' +
      main + '</header>';

    h += '<details class="howto"><summary>Как заниматься</summary><ol>' +
      '<li>Каждый день сначала нажимай «Повторить сейчас», потом учи новый день по плану.</li>' +
      '<li>Читай вопрос и отвечай вслух по памяти. Подсказка говорит, сколько пунктов вспомнить.</li>' +
      '<li>Открой каркас и оцени честно: упустил хоть один ключевой пункт — «Снова».</li>' +
      '<li>«Снова» и «Трудно» вернут карточку через пару минут, «Хорошо» — позже, «Легко» — через несколько дней.</li>' +
      '<li>Квадратик с номером открывает вопрос с ответом — удобно подсмотреть перед зачётом.</li>' +
      '</ol></details>';

    h += '<h2>План на неделю</h2><div class="days">';
    DAYS.forEach(function (d) {
      var st = dayStats(d.n);
      var todo = st.nNew + st.due;
      var cells = CARDS.filter(function (c) { return c.day === d.n; }).map(function (c) {
        var ph = phaseOf(c.n), cls = ph === "review" ? "s2" : (ph === "learn" ? "s1" : "");
        if (isDue(c.n)) cls += " due";
        return '<button class="cell ' + cls + '" data-act="view" data-n="' + esc(c.n) + '" aria-label="Вопрос ' + esc(c.n) + '">' + esc(c.n) + '</button>';
      }).join("");
      h += '<section class="day' + (d.n === nowDay ? " now" : "") + '">' +
        '<div class="dayhead"><div class="dayname">День ' + d.n + ' · ' + esc(d.title) + '<small>' + esc(d.sub) + '</small></div>' +
        (d.n === nowDay ? '<span class="tag">сейчас по плану</span>' : (st.ok === st.total ? '<span class="tag">выучено</span>' : '')) + '</div>' +
        '<div class="cells">' + cells + '</div>' +
        '<div class="dayfoot"><div class="counts">новых <b>' + st.nNew + '</b> · к повторению <b>' + st.due + '</b></div>' +
        '<div class="actions"><button class="btn btn-ghost btn-small" data-act="cram" data-day="' + d.n + '">Прогон</button>' +
        '<button class="btn btn-main btn-small" style="width:auto" data-act="learn" data-day="' + d.n + '"' + (todo ? '' : ' disabled') + '>' + (todo ? 'Учить · ' + todo : 'На сегодня всё') + '</button></div></div>' +
        '</section>';
    });
    h += '<section class="day"><div class="dayhead"><div class="dayname">День 7 · Генеральный прогон<small>все ' + CARDS.length + ' карточки вперемешку, без влияния на расписание</small></div></div>' +
      '<div class="dayfoot"><div class="counts">Отметь «Не вспомнил» — карточка вернётся в конце</div>' +
      '<div class="actions"><button class="btn btn-main btn-small" style="width:auto" data-act="cram" data-day="0">Прогон всех</button></div></div></section>';
    h += '</div>';

    h += '<div class="foot"><div>' + (store === "cloud"
      ? 'Прогресс сохраняется в твоём аккаунте Claude — можно продолжать с любого устройства.'
      : 'Прогресс сохраняется в этом браузере. Открывай страницу в одном и том же браузере.') + '</div>' +
      '<div>Каркасы ответов сжаты по стандартным пособиям ВУЦ — цифры и формулировки сверяйте с конспектом.</div>' +
      (confirmReset
        ? '<div class="confirm"><span>Стереть весь прогресс?</span><button class="btn btn-ghost btn-small danger" data-act="reset-yes">Да, стереть</button><button class="btn btn-ghost btn-small" data-act="reset-no">Отмена</button></div>'
        : '<div><button class="btn btn-ghost btn-small" data-act="reset">Сбросить прогресс</button></div>') +
      '</div>';
    app.innerHTML = h;
  }

  // ── сессии ──
  function startLearn(day) {
    var now = Date.now(), lrn = [], rev = [], nw = [], pend = [];
    CARDS.forEach(function (c) {
      if (day && c.day !== day) return;
      var s = state.cards[c.n];
      if (!s) { if (day) nw.push(c.n); return; }
      if (s.due <= now) (s.phase === "learn" ? lrn : rev).push(c.n);
      else if (s.phase === "learn" && s.due <= now + AHEAD) pend.push(c.n);
    });
    S = { mode: day ? "learn" : "review", day: day, queue: lrn.concat(rev, nw), pend: pend, done: 0, last: null, revealed: false };
    S.total = S.queue.length + S.pend.length;
    S.cur = pickNext(); view = "study"; render(true);
  }
  function startCram(day) {
    var list = CARDS.filter(function (c) { return !day || c.day === day; }).map(function (c) { return c.n; });
    if (!day) for (var i = list.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = list[i]; list[i] = list[j]; list[j] = t; }
    S = { mode: "cram", day: day, queue: list, pend: [], done: 0, again: 0, last: null, revealed: false, total: list.length };
    S.cur = pickNext(); view = "study"; render(true);
  }
  function startView(n) {
    var order = CARDS.map(function (c) { return c.n; });
    S = { mode: "view", list: order, idx: order.indexOf(n), revealed: true };
    S.cur = n; view = "study"; render(true);
  }
  function pickNext() {
    var now = Date.now();
    S.pend.sort(function (a, b) { return state.cards[a].due - state.cards[b].due; });
    var i = S.pend.findIndex(function (n) { return state.cards[n].due <= now && n !== S.last; });
    if (i >= 0) return S.pend.splice(i, 1)[0];
    if (S.queue.length) { var j = S.queue.findIndex(function (n) { return n !== S.last; }); if (j < 0) j = 0; return S.queue.splice(j, 1)[0]; }
    if (S.pend.length) { var k = S.pend.findIndex(function (n) { return n !== S.last; }); if (k < 0) k = 0; return S.pend.splice(k, 1)[0]; }
    return null;
  }
  function grade(g) {
    if (!S || !S.cur || !S.revealed) return;
    var n = S.cur;
    if (S.mode === "cram") {
      if (g === 0) { S.queue.splice(Math.min(4, S.queue.length), 0, n); S.again++; } else S.done++;
    } else {
      var ns = next(state.cards[n], g);
      state.cards[n] = ns; scheduleSave();
      if (ns.phase !== "review" && ns.due <= Date.now() + AHEAD) S.pend.push(n); else S.done++;
    }
    S.last = n; S.cur = pickNext(); S.revealed = false; render(true);
  }

  function cardHTML(c, revealed) {
    var h = '<article class="card">' +
      '<div class="chiprow"><span class="num">№ ' + esc(c.n) + '</span><span class="blk">День ' + c.day + ' · ' + esc(c.dayTitle) + '</span></div>' +
      '<h1 class="q">' + c.q + '</h1>';
    if (!revealed) h += '<div class="hint">Ответь вслух по памяти · пунктов: <b>' + c.cnt + '</b></div>';
    else {
      h += '<div class="answer"><div class="label">Каркас ответа · ' + c.cnt + ' п.</div><div class="k">' + c.k + '</div>' +
        (c.m ? '<div class="mn"><span>Запомнить:</span> ' + c.m + '</div>' : '') +
        (c.d ? '<details class="more"><summary>Подробнее</summary>' + c.d + '</details>' : '') + '</div>';
    }
    return h + '</article>';
  }

  function renderStudy() {
    var modeName = S.mode === "cram" ? (S.day ? "Прогон · день " + S.day : "Прогон всех")
      : S.mode === "review" ? "Повторение" : S.mode === "view" ? "Просмотр" : "Учить · день " + S.day;
    if (S.mode !== "view" && !S.cur) { renderDone(); return; }
    var c = BY[S.cur];
    var left = S.mode === "view" ? 0 : S.queue.length + S.pend.length + 1;
    var pct = S.mode === "view" ? ((S.idx + 1) / S.list.length * 100) : (S.total ? (S.done / (S.done + left)) * 100 : 0);
    var right = S.mode === "view" ? '<b>' + (S.idx + 1) + '</b> из ' + S.list.length : 'осталось <b>' + left + '</b>';
    var h = '<div class="topbar"><div class="toprow"><button class="back" data-act="home">← План</button>' +
      '<div class="mode">' + modeName + ' · ' + right + '</div></div>' +
      '<div class="sbar"><i style="width:' + pct.toFixed(1) + '%"></i></div></div>' +
      cardHTML(c, S.revealed) + '<div class="spacer"></div>';

    var dock;
    if (S.mode === "view") {
      dock = '<div class="nav3"><button class="btn btn-ghost" data-act="prev"' + (S.idx > 0 ? '' : ' disabled') + ' aria-label="Предыдущий вопрос">‹ Пред.</button>' +
        '<button class="btn btn-main" data-act="home">К плану</button>' +
        '<button class="btn btn-ghost" data-act="next"' + (S.idx < S.list.length - 1 ? '' : ' disabled') + ' aria-label="Следующий вопрос">След. ›</button></div>';
    } else if (!S.revealed) {
      dock = '<button class="btn btn-main" data-act="reveal" style="min-height:58px">Показать ответ</button>';
    } else if (S.mode === "cram") {
      dock = '<div class="grades two"><button class="g g0" data-act="g" data-g="0">Не вспомнил<small>вернётся</small></button>' +
        '<button class="g g2" data-act="g" data-g="2">Вспомнил<small>дальше</small></button></div>';
    } else {
      var s = state.cards[S.cur];
      var names = ["Снова", "Трудно", "Хорошо", "Легко"];
      dock = '<div class="grades">' + names.map(function (nm, g) {
        return '<button class="g g' + g + '" data-act="g" data-g="' + g + '">' + nm + '<small>' + label(next(s, g)) + '</small></button>';
      }).join("") + '</div>';
    }
    h += '<div class="dock"><div class="dock-in">' + dock + '</div></div>';
    app.innerHTML = h;
  }

  function renderDone() {
    var nextDay = 0;
    for (var i = 0; i < DAYS.length; i++) { if (dayStats(DAYS[i].n).nNew > 0) { nextDay = DAYS[i].n; break; } }
    var msg = S.mode === "cram"
      ? "Прогон закончен: " + S.done + " карточек" + (S.again ? ", повторов по «Не вспомнил» — " + S.again : "") + "."
      : "Пройдено карточек: " + S.done + ". Следующие повторения появятся по расписанию.";
    app.innerHTML = '<div class="done"><div class="eyebrow">Готово</div><h1>На сегодня этот блок закрыт</h1><p>' + esc(msg) + '</p>' +
      (nextDay && S.mode !== "cram" && S.day !== nextDay ? '<p>Дальше по плану — день ' + nextDay + ' · ' + esc(DAYS[nextDay - 1].title) + '.</p>' : '') +
      '<button class="btn btn-main" data-act="home">К плану</button></div>';
  }

  function render(top) {
    if (view === "home") renderHome(); else renderStudy();
    if (top) window.scrollTo(0, 0);
  }

  app.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-act]");
    if (!b || b.disabled) return;
    var act = b.getAttribute("data-act");
    if (act === "review") startLearn(0);
    else if (act === "learn") startLearn(+b.getAttribute("data-day"));
    else if (act === "cram") startCram(+b.getAttribute("data-day"));
    else if (act === "view") startView(b.getAttribute("data-n"));
    else if (act === "home") { view = "home"; S = null; render(true); }
    else if (act === "reveal") { S.revealed = true; render(false); }
    else if (act === "g") grade(+b.getAttribute("data-g"));
    else if (act === "prev" || act === "next") {
      S.idx = Math.max(0, Math.min(S.list.length - 1, S.idx + (act === "next" ? 1 : -1)));
      S.cur = S.list[S.idx]; render(true);
    }
    else if (act === "reset") { confirmReset = true; render(false); }
    else if (act === "reset-no") { confirmReset = false; render(false); }
    else if (act === "reset-yes") { state = { cards: {} }; confirmReset = false; scheduleSave(); render(true); }
  });
  document.addEventListener("keydown", function (ev) {
    if (view !== "study" || !S) return;
    if ((ev.key === " " || ev.key === "Enter") && S.mode !== "view" && S.cur && !S.revealed) { ev.preventDefault(); S.revealed = true; render(false); }
    else if (S.revealed && S.mode !== "view" && /^[1-4]$/.test(ev.key)) {
      var g = +ev.key - 1; if (S.mode === "cram") g = g < 2 ? 0 : 2; grade(g);
    }
    else if (S.mode === "view" && (ev.key === "ArrowRight" || ev.key === "ArrowLeft")) {
      S.idx = Math.max(0, Math.min(S.list.length - 1, S.idx + (ev.key === "ArrowRight" ? 1 : -1)));
      S.cur = S.list[S.idx]; render(true);
    }
  });

  render(false);
})();
</script>

</body>
</html>
